[package]
name = "siyuan-research-worktable"
version = "0.2.1"
description = "思源科研工作台 - 把思源笔记变成可查询、可统计、可导出的科研工作台"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
raw-window-handle = "0.6"

# 体积优先：这是个小工具，没必要为了几毫秒启动时间多占 30 MB
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
