<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>预览</title>
<style>
:root{
  --ink:#2b2a26; --sub:#8a8478; --brand:#1B365D;
  --line:rgba(226,214,186,.85);
}

  html, body{
    margin:0; padding:0; height:100%; width:100%;
    background:transparent; overflow:hidden;
    font:12px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color:var(--ink);
  }
  #card{
    height:100%; box-sizing:border-box;
    padding:12px 14px; overflow-y:auto;
    background:rgba(255,251,238,.99);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 4px 10px rgba(120,110,90,.14),
               0 16px 44px rgba(120,110,90,.26),
               inset 0 1px 0 rgba(255,255,255,.95);
    scrollbar-width:thin; scrollbar-color:rgba(150,140,120,.35) transparent;
  }
  #card::-webkit-scrollbar{ width:6px; }
  #card::-webkit-scrollbar-thumb{ background:rgba(150,140,120,.32); border-radius:3px; }
  .pvTitle{
    font-size:12.5px; font-weight:700; color:var(--brand);
    margin:0 0 10px; padding-bottom:7px;
    border-bottom:1px solid rgba(226,214,186,.7);
    display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;
  }
  .pvTitle .pvHint{
    margin-left:auto; font-size:10px; font-weight:400; color:#b9b2a3;
  }
  #body > *:first-child{ margin-top:0 !important; }
  #body > *:last-child{ margin-bottom:0 !important; }

/* ===== 以下从侧边栏原样搬过来，保证预览里的排版和卡片一致 ===== */

  :root{
    --bg:#f6f4ec; --card:#fffdf7; --line:#e2dccb; --line2:#cdb48c;
    /* 文字统一用近纯黑，配合下面的提亮底衬托 */
    --ink:#0d0c0a; --sub:#2b2925; --dim:#4a453d; --brand:#1B365D;
  }
  *{ box-sizing:border-box; }
  html,
  /* 毛玻璃，边缘做成**不规则**的雾化。

     ⚠ 关键约束：窗口只有 400px 宽，渐变画到 100% 就被截断。
     每层 alpha 必须提前归零，否则最后几像素是实心白 → 硬边。

     怎么做到"不规则"：
     单个椭圆再宽也是个规整的蛋形。这里用 9 层**偏心、长宽比各不相同**
     的径向渐变叠加，每层的中心点、半径、衰减曲线都不一样，
     合成后的不透明度就没有任何可辨认的轮廓 —— 像烟不规则地散开。
     再叠一层 SVG 噪点做细微扰动，让过渡带上带有轻微的颗粒感，
     不会出现那种"计算机画出来的完美渐变"观感。 */
  
  /* 噪点层：单独一层，叠在玻璃之上、文字之下，只影响观感不影响阅读 */
  
  @keyframes noiseShift{
    0%   { background-position:0 0; }
    20%  { background-position:-24px -18px; }
    40%  { background-position:18px -30px; }
    60%  { background-position:-30px 22px; }
    80%  { background-position:26px 13.3px; }
    100% { background-position:0 0; }
  }
  @keyframes smokeDrift{
    0%   { transform:translate3d(0, 0, 0) scale(1); }
    33%  { transform:translate3d(-0.3%, -0.35%, 0) scale(1.006); }
    66%  { transform:translate3d(0.35%, 0.2%, 0) scale(1.011); }
    100% { transform:translate3d(0.15%, -0.15%, 0) scale(1.004); }
  }
  /* 用户要求减弱动画时全部静止 */
  @media (prefers-reduced-motion: reduce){
    body::before, body::after{ animation:none; }
  }
  /* 顶栏：透的，只留一条细分隔线；悬停时轻微加深，方便抓取拖动 */
  
  .hd:hover{ background:rgba(255,255,255,.55); }
  .hd .ttl{ font-weight:700; color:var(--brand); font-size:12.8px; letter-spacing:.02em;
    text-shadow:0 0.9px 0 rgba(255,255,255,.6);
    flex:none; white-space:nowrap; cursor:pointer; }
  .hd .sp{ flex:1 1 auto; min-width:0; }
  .hd button{
    border:0.9px solid rgba(190,180,160,.5); background:rgba(255,255,255,.55); color:var(--sub);
    border-radius:5.7px; font-size:10.9px; padding:1.9px 7.6px; cursor:pointer; font-family:inherit;
    white-space:nowrap; flex:none;
  }
  .hd button:hover{ border-color:var(--brand); color:var(--brand); background:rgba(255,255,255,.85); }
  /* 「打开工作台」：主入口，做得比其它小按钮显眼一点 */
  .hd .hdOpen{
    border-color:rgba(27,54,93,.45); background:rgba(27,54,93,.08); color:var(--brand);
    font-weight:600; letter-spacing:.01em;
    /* 固定宽度：「⤢ 工作台」和「⤡ 收起」字数不同，
       不锁宽的话切换时标题栏会左右抖一下 */
    min-width:74px; text-align:center;
  }
  .hd .hdOpen:hover{ background:var(--brand); color:#fff; border-color:var(--brand); }
  /* 开关状态：工作台开着时按钮反色、常亮，一眼看出「再点一下就会收起」 */
  .hd .hdOpen.on{
    background:var(--brand); color:#fff; border-color:var(--brand);
    box-shadow:0 0 0 1.9px rgba(27,54,93,.14);
  }
  .hd .hdOpen.on:hover{ background:#12253f; border-color:#12253f; }

  /* 手动拉取选择框：盖在侧边栏上，玻璃底 + 纸感按钮 */
  .pullAsk{
    position:fixed; inset:0; z-index:999; display:none;
    align-items:center; justify-content:center;
    background:rgba(20,18,14,.28); backdrop-filter:blur(2.8px);
  }
  .pullAsk .pa-card{
    width:260px; padding:15.2px 15.2px 11.4px;
    background:linear-gradient(180deg,#fffdf7,#f7f4ea);
    border:0.9px solid rgba(190,180,160,.6); border-radius:11.4px;
    box-shadow:0 11.4px 34px -11.4px rgba(27,54,93,.45), 0 0.9px 0 rgba(255,255,255,.8) inset;
    display:flex; flex-direction:column; gap:7.6px;
  }
  .pullAsk .pa-title{ font-size:12.8px; font-weight:700; color:var(--brand); }
  .pullAsk .pa-desc{ font-size:10.9px; color:var(--dim); margin-bottom:1.9px; }
  /* 两端差异说明：列出仅本地 / 仅云端各是哪几条 */
  .pullAsk .pa-diff{ font-size:10.0px; color:#8a6d2f; background:rgba(217,160,21,.08);
    border:0.9px solid #e8d9a8; border-radius:4.8px; padding:3.8px 6.6px; margin:2.8px 0 4.8px;
    line-height:1.55; word-break:break-all; }
  .pullAsk .pa-btn{
    padding:7.6px 9.5px; border-radius:7.6px; cursor:pointer; font-family:inherit;
    border:0.9px solid rgba(27,54,93,.35); background:rgba(27,54,93,.06);
    color:var(--brand); font-size:11.4px; font-weight:600;
    transition:background .15s, color .15s, border-color .15s;
    display:flex; flex-direction:column; align-items:flex-start; gap:1.9px;
  }
  .pullAsk .pa-btn:hover{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .pullAsk .pa-btn:hover .pa-time{ opacity:.9; }
  .pullAsk .pa-btn .pa-nm{ font-size:11.4px; font-weight:600; }
  .pullAsk .pa-btn .pa-time{
    font-size:10.0px; font-weight:400; opacity:.75; font-variant-numeric:tabular-nums;
  }
  .pullAsk .pa-wb{
    margin-top:1.9px; padding:5.7px 7.6px; border-radius:5.7px;
    background:rgba(190,180,160,.12); border:0.9px dashed rgba(190,180,160,.5);
    font-size:10.0px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  .pullAsk .pa-cancel{
    margin-top:1.9px; padding:4.8px; border:0; background:transparent;
    color:var(--dim); font-size:10.9px; cursor:pointer; font-family:inherit;
  }
  .pullAsk .pa-cancel:hover{ color:var(--sub); }

  /* ================= 卡片布局 =================
     每张卡片是一个固定高度的块，内容超出时在卡片内部滚动
     （卡片自己带滚动条，能看出「还有内容」）。
     卡片之间不抢空间，整列在 .scroll 里上下滚。

     三种交互：
       · 悬停 → 右侧浮出完整预览（只读，不改变卡片本身高度）
       · 双击标题 → 在侧边栏内展开 / 再双击折叠
       · 标题右侧的 ⌄ 按钮 → 同上，点一下即知当前状态
     ============================================ */
  

  /* 折叠态：只留标题行 */
  .scroll > .card.isCollapsed{
    max-height:46px; overflow:hidden;
  }
  .scroll > .card.isCollapsed > :not(h3){ display:none !important; }

  /* 展开态：内容全部铺开，不设高度上限、不出滚动条 */
  .scroll > .card.isExpanded{
    max-height:none; overflow:visible;
  }

  /* ---- 卡片两种视图 ----
     折叠态（默认）：只显示 .todoBrief —— 分数栏 + 所有待办名 + 当前步骤
     展开态（双击标题）：显示 .todoDetail —— 完整明细
     两者互斥，靠卡片上的 isExpanded 类切换。
     悬停浮层抓的始终是 .todoDetail（完整版）。 */
  /* 折叠态：连摘要也不显示，只剩标题 */
  .scroll > .card.isCollapsed .todoBrief{ display:none !important; }
  /* 摘要只在「既不折叠也不展开」时出现 */
  .scroll > .card.isCollapsed .todoDetail,
  .scroll > .card:not(.isExpanded) .todoDetail{ display:none !important; }
  .scroll > .card.isExpanded .todoBrief{ display:none !important; }

  .todoBrief{ font-size:11.4px; }
  .todoBrief .score{ margin-bottom:5.7px; }
  .todoBrief .briefList{ margin-top:7.6px; display:flex; flex-direction:column; gap:4.8px; }
  /* 精简卡的一行待办：两行排布
       第 1 行  优先级色点 + 待办名
       第 2 行  当前在做的步骤（换行，缩进对齐） */
  .briefRow{
    display:flex; flex-direction:column; gap:1.9px;
    padding:4.8px 0; line-height:1.45;
  }
  .briefLine1{
    display:flex; align-items:center; gap:6.6px; min-width:0;
  }
  .briefDot{
    flex:none; width:6.6px; height:6.6px; border-radius:50%;
    background:#c9b98f;
  }
  /* 优先级配色：红 > 橙 > 琥珀 > 绿 */
  .briefRow.p1 .briefDot{ background:#e05252; box-shadow:0 0 0 1.9px rgba(224,82,82,.16); }
  .briefRow.p2 .briefDot{ background:#e8863a; box-shadow:0 0 0 1.9px rgba(232,134,58,.16); }
  .briefRow.p3 .briefDot{ background:#d9a015; box-shadow:0 0 0 1.9px rgba(217,160,21,.16); }
  .briefRow.p4 .briefDot{ background:#4caf6e; box-shadow:0 0 0 1.9px rgba(76,175,110,.16); }

  .briefRow.p1 .briefName{ color:#b83a3a; }
  .briefRow.p2 .briefName{ color:#a95f21; }
  .briefRow.p3 .briefName{ color:#8a6a10; }
  .briefRow.p4 .briefName{ color:#2f7a4f; }

  .briefName{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:600;
  }
  /* 第二行：当前步骤，缩进到和待办名对齐 */
  .briefCur{
    padding-left:13.3px;
    color:var(--sub); font-size:10.9px; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .briefCur::before{ content:"▸ "; color:#c9b98f; }

  .briefCur.curDone{ color:#7bb37b; }
  /* 其余未完成项：列名字，带同色小点 */
  .briefRest{ margin-top:5.7px; }
  .briefRestHead{
    font-size:9.5px; color:#b9b2a3; margin-bottom:2.8px; padding-left:1.9px;
  }
  .briefRestItem{
    display:flex; align-items:center; gap:5.7px;
    padding:1.9px 0; font-size:10.9px;
  }
  .briefRestItem .briefDot.sm{ width:4.8px; height:4.8px; box-shadow:none; }
  .briefRestName{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--sub);
  }
  .briefRestItem.p1 .briefRestName{ color:#b83a3a; }
  .briefRestItem.p2 .briefRestName{ color:#a95f21; }
  .briefRestItem.p3 .briefRestName{ color:#8a6a10; }
  .briefRestItem.p4 .briefRestName{ color:#2f7a4f; }
  .briefEmpty{
    font-size:10.9px; color:#7bb37b; padding:3.8px 0;
  }

  /* ---- 文档检索：折叠看摘要，展开看完整 ----
     折叠态：总文档、总字数、今天在编辑的几篇
     展开态：完整明细 */
  .scroll > .card:not(.isExpanded) .docDetail{ display:none !important; }

  .docToday{ margin-top:7.6px; }
  .docTopHead{
    font-size:10.0px; color:#b9b2a3; margin-bottom:2.8px;
  }
  .docTopRow{
    display:flex; align-items:baseline; gap:7.6px;
    font-size:11.4px; padding:3.8px 0;
    border-top:0.9px dashed rgba(226,214,186,.7);
  }
  .docTopNm{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--ink); font-weight:600;
  }
  .docTopWc{
    flex:none; color:#1B365D; font-weight:700; font-size:10.9px;
  }
  .docEmpty{ font-size:10.9px; color:#b9b2a3; font-style:italic; }

  /* 详情卡：文档名加粗、编辑时间、字数右对齐 */
  .docList{ display:flex; flex-direction:column; }
  .docItem{
    display:flex; align-items:baseline; gap:7.6px;
    padding:4.8px 0; border-bottom:0.9px dashed rgba(226,214,186,.55);
    font-size:10.9px;
  }
  .docItem:last-child{ border-bottom:none; }
  .docItemNm{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:700; color:var(--ink);
  }
  .docItemTime{
    flex:none; font-size:10.0px; color:#b9b2a3;
    font-variant-numeric:tabular-nums;
  }
  .docItemWc{
    flex:none; min-width:56px; text-align:right;
    color:#1B365D; font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .docDetailHead{
    font-size:10.4px; color:var(--sub); margin:1.9px 0 5.7px;
    padding-bottom:4.8px; border-bottom:0.9px dashed rgba(226,214,186,.7);
  }

  /* 数据库：折叠看总量+标签，展开看完整 */
  .scroll > .card:not(.isExpanded) .dbDetail{ display:none !important; }
  .scroll > .card.isCollapsed .dbBrief{ display:none !important; }
  .dbTagChips{ margin-top:7.6px; }
  /* 数据库标签：彩色。
     --tc 是每个笔记本自己的颜色（见 NB_COLORS），
     色点用实色、边框和底用同色低透明度，文字略深。 */
  .dbTagChips .chip.dbTag{
    display:inline-flex; align-items:center; gap:4.8px;
    font-size:10.0px; padding:1.9px 7.6px 1.9px 5.7px;
    border:0.9px solid var(--tc, #c9b98f);
    background:color-mix(in srgb, var(--tc, #c9b98f) 11%, transparent);
    color:var(--tc, #6b6558);
    border-radius:20px;
  }
  .dbTagChips .chip.dbTag b.dbTagDot{
    flex:none; width:5.7px; height:5.7px; border-radius:50%;
    background:var(--tc, #c9b98f);
  }
  .dbTagChips .chip.dbTag i{
    color:var(--tc, #8a8478); opacity:.78; font-style:normal;
  }

  /* 今日执行力：精简卡只留数字（完成率 / 步骤分 / 效率 / 用时），
     整块提示列表（.wkTodayTips）都收进展开态和悬停浮层。 */
  .scroll > .card:not(.isExpanded) .wkTodayTips{ display:none !important; }

  /* ---- 标题行：常驻，右侧带折叠按钮 ---- */
  .scroll > .card > h3{
    position:sticky; top:0; z-index:2;
    background:rgba(255,251,238,.97);
    cursor:pointer;
    user-select:none;
    /* 占满卡片宽度，滚动时标题条不会只覆盖一部分 */
    margin-left:-11.4px; margin-right:-11.4px;
    padding-left:11.4px; padding-right:11.4px;
    padding-top:1.9px; padding-bottom:1.9px;
  }
  .scroll > .card.isCollapsed > h3{ margin-bottom:0; }

  /* 折叠/展开按钮：一个小胶囊，箭头 + 状态文字，一眼看出当前是什么状态。
     折叠时箭头朝右并写「展开」，展开时箭头朝下并高亮写「收起」。 */
  
  
  
  
  
  
  
  

  /* 卡片：默认**完全透明**，让底下的不规则玻璃层完整透出来。
     之前给 .30 的白底会把边缘渐变盖住，看起来就是"玻璃没有雾化、
     只是一块白" —— 这是雾化没生效的最主要原因。
     鼠标移上去时才变成接近不透明。 */
  
  .card:hover{
    background:rgba(255,251,238,.97);
    border-color:rgba(226,214,186,.55);
    box-shadow:0 1.9px 5.7px rgba(120,110,90,.08),
               0 9.5px 32px rgba(120,110,90,.13),
               0 22px 60px rgba(120,110,90,.07),
               inset 0 0.9px 0 rgba(255,255,255,.9);
  }
  /* 悬停时卡片里的小控件也用不透明底，避免透出别的东西显得脏 */
  .card:hover .pomoBtn,
  .card:hover .pomoNoteIn,
  .card:hover .pomoCur,
  .card:hover .hdBtn,
  .card:hover .addTask,
  .card:hover .miniAct,
  .card:hover .planAdd,
  .card:hover .planCancel{ background:#fffdf7; }
  .card > h3{
    margin:0 0 7.6px; font-size:11.4px; color:var(--brand); font-weight:700;
    display:flex; align-items:baseline; gap:5.7px;
  }
  .card > h3 .mini{ font-size:10.0px; color:#4a453d; font-weight:400; margin-left:auto; }

  /* 评分 */
  .score{ display:flex; align-items:baseline; gap:5.7px; margin-bottom:5.7px; }
  .score b{ font-size:26px; color:var(--brand); font-family:Georgia,serif; line-height:1; }
  .score .u{ font-size:10.4px; color:var(--sub); }
  .score .g{ font-size:10.4px; font-weight:700; color:#fff; background:var(--brand); border-radius:4.8px; padding:0 6.6px; }
  .score .g[data-g="A"]{ background:#2f7a4f; }
  .score .g[data-g="C"]{ background:#b5762a; }
  .score .g[data-g="D"]{ background:#8b4513; }
  .score .g[data-g="S"]{ background:#8a6d2f; }
  .bar{ height:3.8px; background:rgba(239,232,216,.6); border-radius:2.8px; overflow:hidden; margin-bottom:5.7px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,#1B365D,#4f8ef7); }
  .meta{ font-size:10.4px; color:var(--sub); display:flex; flex-wrap:wrap; gap:1.9px 9.5px; }
  .meta b{ color:var(--brand); }

  /* 任务 */
  .task{ border-top:0.9px dashed #e6e0d1; padding:6.6px 0 4.8px; }
  .task:first-of-type{ border-top:0; padding-top:1.9px; }
  .task .row1{ display:flex; align-items:baseline; gap:5.7px; }
  .task .nm{ flex:1 1 auto; min-width:0; font-size:11.9px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task .q{ flex:none; font-size:9.5px; color:#8a6d2f; background:rgba(247,239,216,.55);
    border:0.9px solid #e6d9b4; border-radius:6.6px; padding:0 4.8px; }
  .subs{ margin:3.8px 0 0; padding:0; list-style:none; }
  .subs li{ font-size:10.9px; color:var(--sub); display:flex; gap:5.7px; padding:0.9px 0; }
  .subs li.done{ color:#a9a397; text-decoration:line-through; }
  .subs .bx{ flex:none; width:10.4px; height:10.4px; border:0.9px solid #c9c1ae; border-radius:2.8px; margin-top:3.8px; }
  .subs li.done .bx{ background:#2f7a4f; border-color:#2f7a4f; }
  .subs li{ cursor:pointer; border-radius:3.8px; }
  .subTxt{ flex:1 1 auto; min-width:0; }
  /* 步骤级番茄：累计徽标 + 悬停出现的记时按钮 */
  .pomoBadge{ flex:none; font-size:9.0px; color:#8a6d2f; background:rgba(247,239,216,.55);

  /* 笔记本分组 */
  .nbGroup{ margin-bottom:5.7px; }

  /* 周报 */
  .wkLine{ font-size:11.4px; color:var(--ink); margin:0 0 5.7px; line-height:1.65; }

  /* 分数可能长（0/110），字号压小一点，保证一格放得下不换行 */

  .wkTodayBar{ height:3.8px; background:#efe9da; border-radius:2.8px; overflow:hidden; margin-bottom:3.8px; }
  .wkTodayBar i{ display:block; height:100%; border-radius:2.8px; transition:width .25s; }
  .wkTodaySub{ font-size:9.0px; color:#4a453d; }
  .wkTodayTips{ list-style:none; margin:6.6px 0 0; padding:0; }
  /* 每条 = 一行「关键结论」大字 + 一行「措施」小字。
     颜色按语义：坏=红、好=绿、持平=不变色。

  /* 结论里的数字：放大一号，颜色跟条目一致 */
  .wkTipK b.n{ font-size:13.3px; font-weight:800; color:var(--brand); padding:0 0.9px; }
  .wkTipD{ font-size:9.5px; color:#7d776b; line-height:1.5; }

  /* —— 坏（慢 / 降 / 低）：红，三档深浅 —— */
  .wkTodayTips li.bad.lv1{ border-left-color:#e8c4bd; }
  .wkTodayTips li.bad.lv1 .wkTipK{ color:#c06a5c; }
  .wkTodayTips li.bad.lv2{ border-left-color:#d98a7a; }
  .wkTodayTips li.bad.lv2 .wkTipK{ color:#b3453a; }
  .wkTodayTips li.bad.lv3{ border-left-color:#a93226; background:rgba(192,57,43,.045); }
  .wkTodayTips li.bad.lv3 .wkTipK{ color:#95261a; }
  .wkTodayTips li.bad .wkTipK b.n{ color:inherit; }

  /* —— 好（快 / 升 / 高）：绿，三档深浅 —— */
  .wkTodayTips li.good.lv1{ border-left-color:#bcdcc3; }
  .wkTodayTips li.good.lv1 .wkTipK{ color:#4f9169; }
  .wkTodayTips li.good.lv2{ border-left-color:#78b78c; }
  .wkTodayTips li.good.lv2 .wkTipK{ color:#2f7a4f; }
  .wkTodayTips li.good.lv3{ border-left-color:#2f7a4f; background:rgba(47,122,79,.045); }
  .wkTodayTips li.good.lv3 .wkTipK{ color:#1f5c39; }
  .wkTodayTips li.good .wkTipK b.n{ color:inherit; }

  /* —— 持平：不变色 —— */
  .wkTodayTips li.flat .wkTipK{ color:var(--ink); }

  /* 数字格子 / 标签 / 列表（知识图谱、数据库汇总） */
  .grid4, .grid2{ display:grid; gap:5.7px; margin-bottom:7.6px; }
  .grid4{ grid-template-columns:repeat(4,1fr); }
  .grid2{ grid-template-columns:repeat(2,1fr); }
  .grid4 > div, .grid2 > div{ text-align:center; background:transparent; border:0.9px solid rgba(221,213,196,.55);
    border-radius:7.6px; padding:5.7px 1.9px; }
  .grid4 b, .grid2 b{ display:block; font-size:15.2px; color:var(--brand); font-family:Georgia,serif; line-height:1.2; }
  .grid4 span, .grid2 span{ font-size:9.5px; color:#4a453d; }
  .chips{ display:flex; flex-wrap:wrap; gap:4.8px; margin-bottom:7.6px; overflow:hidden; }
  .chip{ font-size:10.0px; color:var(--sub); background:transparent; border:0.9px solid rgba(221,213,196,.55);
    border-radius:20px; padding:0 7.6px; max-width:150px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  /* 悬停整张卡片时，这些统计块才补上底色 */
  .card:hover .grid4 > div, .card:hover .grid2 > div{ background:#f7f4ea; border-color:var(--line); }
  .card:hover .chip{ background:#f7f4ea; border-color:var(--line); }
  .chip i{ font-style:normal; color:var(--brand); margin-left:3.8px; font-size:9.5px; }
  .recent{ font-size:10.9px; color:var(--sub); }
  .rline{ display:flex; gap:5.7px; align-items:baseline; padding:0.9px 0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .subTitle{ font-size:10.0px; color:#4a453d; margin:5.7px 0 1.9px; }

  .empty{ font-size:11.4px; color:#4a453d; line-height:1.8; }
  .empty code{ background:#f3f0e5; border:0.9px solid var(--line); border-radius:3.8px; padding:0 3.8px; font-size:10.4px; }

  /* 原地编辑时的视觉提示 */
  .pvEditing{
    outline: 2px solid rgba(217,160,21,.55);

    border-radius: 3px;

  }

  /* 预览里的步骤百分比滑动条 */
  .pvPctBox{
    display:flex; align-items:center; gap:7px;
    margin:3px 0 5px 14px; padding:5px 8px;

    box-sizing:border-box;
  }
  .pvPctBox .stepPctLbl{ flex:none; font-size:10px; color:#7a6f5c; }
  .pvPctBox input[type="range"]{
    flex:1 1 auto; min-width:0; height:4px;
    accent-color:#d9822b; cursor:pointer;
  }
  .pvPctBox .stepPctVal{
    flex:none; min-width:34px; text-align:right;
    font-size:10.5px; font-weight:600; color:#8a6d2f;
  }
  .pvPctBox .stepPctOk{
    flex:none; padding:2px 9px; border:1px solid #d9a015;
    background:#fbeec4; color:#8a6d2f; border-radius:4px;
    font:10.5px/1.5 inherit; font-family:inherit; font-weight:600; cursor:pointer;
  }
  .pvPctBox .stepPctOk:hover{ background:#f7e3ac; }
  .pvPctBox .stepPctCancel{
    flex:none; padding:2px 7px; border:1px solid #ded6c4;
    background:#fffdf7; color:#9a9384; border-radius:4px;
    font:10.5px/1.5 inherit; font-family:inherit; cursor:pointer;
  }
  .pvPctBox .stepPctCancel:hover{ background:#f4efe4; }

</style>

<body>
  <div id="card">
    <div class="pvTitle">
      <span id="name">预览</span>
      <span class="pvHint" id="pvHint"></span>
    </div>
    <div id="body"></div>
  </div>

<!-- 页面内的输入框（代替 window.prompt） -->
  <div id="askMask">
    <div id="askBox">
      <div id="askTitle">输入</div>
      <input id="askInput" type="text" />
      <div id="askBtns">
        <button id="askCancel">取消</button>
        <button id="askOk">确定</button>
      </div>
    </div>
  </div>

<script>
(function(){
  "use strict";
  var nameEl = document.getElementById("name");
  var bodyEl = document.getElementById("body");

  /* ---- 页面内输入框（替代 window.prompt / confirm）----
     Tauri 里调 prompt 会弹「tauri.localhost 想要…」的系统提示，
     又丑又会中断手感。这里用页面内的浮层。 */
  var askMask = document.getElementById("askMask");
  var askBox = document.getElementById("askBox");
  var askTitle = document.getElementById("askTitle");
  var askInput = document.getElementById("askInput");
  var askOk = document.getElementById("askOk");
  var askCancel = document.getElementById("askCancel");
  var askResolve = null;
  var askIsConfirm = false;
  /* 待删除的任务下标，点「确定」时用它 */
  window.__pendingDelIdx = null;

  function closeAsk(val){
    askMask.classList.remove("on");
    var r = askResolve;
    askResolve = null;
    if (r) r(val);
  }

  function openAsk(title, defVal, isConfirm){
    return new Promise(function(resolve){
      askResolve = resolve;
      askIsConfirm = !!isConfirm;
      askTitle.textContent = title;
      askInput.value = defVal == null ? "" : String(defVal);
      askInput.style.display = isConfirm ? "none" : "block";
      askMask.classList.add("on");
      if (!isConfirm) {
        setTimeout(function(){ askInput.focus(); askInput.select(); }, 30);
      }
    });
  }

  /* 返回字符串；取消返回 null */
  function askText(title, defVal){
    return openAsk(title, defVal, false);
  }
  /* 返回 true / false */
  function askConfirm(title){
    return openAsk(title, "", true).then(function(v){ return v !== null && v !== false; });
  }

  if (askOk) {
    askOk.addEventListener("click", function(){
      closeAsk(askIsConfirm ? true : askInput.value);
    });
    askCancel.addEventListener("click", function(){ closeAsk(null); });
    askInput.addEventListener("keydown", function(e){
      if (e.key === "Enter") { e.preventDefault(); closeAsk(askInput.value); }
      if (e.key === "Escape") { e.preventDefault(); closeAsk(null); }
    });
    askMask.addEventListener("click", function(e){
      if (e.target === askMask) closeAsk(null);
    });
  }

  function invoke(cmd, args){
    try {
      var iv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
      return iv ? iv(cmd, args || {}) : Promise.reject(new Error("no invoke"));
    } catch(e) { return Promise.reject(e); }
  }

  function render(payload){
    try {
      var p = typeof payload === "string" ? JSON.parse(payload) : payload;
      if (!p) return;
      /* ⚠ 正在双击编辑时不要重建 DOM ——
         重建会把编辑中的元素整个换掉：光标丢失、打到一半的字没了，
         看起来就是「双击后突然刷新」。
         用 window 标记而不是局部变量，避免声明顺序（TDZ）问题。 */
      /* 正在编辑文字，或者百分比滑动条开着 —— 都不要重建 DOM。
         重建会把正在操作的控件弹掉，看起来就是"突然刷新"。 */
      if (window.__editing || window.__pctBoxOpen) return;
      nameEl.textContent = p.title || "预览";
      var _h = p.html || "";
      /* ⚠ 内容完全一样就不要碰 DOM。
         以前无条件重赋值，每 200ms 重建一次全部节点，
         导致图标 hover 状态反复重置（看起来"一直在跳"），
         而且每次重建都重新绑事件，可能吞掉点击。 */
      if (bodyEl.innerHTML !== _h) {
        bodyEl.innerHTML = _h;
        bindActions();
      }
    } catch(e) {
      bodyEl.textContent = "（内容解析失败）";
    }
  }

  /* ================= 交互转发 =================
     预览里的 DOM 是**拷贝**，原来绑的监听器不会跟过来。
     这里把点击/双击抓下来，原样发回侧边栏，由它在真实卡片上复现。

     侧边栏一共有这几类可交互元素（按属性区分）：
       data-act        按钮动作（番茄记录等）
       data-ti/data-si 点击切换步骤完成
       data-star       切换重要性
       data-deltask    删除任务
       data-step-pct   设置步骤百分比（点了要弹输入框，见下）
       data-edit       双击改任务名
       data-edit-sub   双击改步骤名
     ============================================ */

  /* 找到最近的、带指定 data 属性的祖先 */
  function closestData(el, attr){
    while (el && el !== bodyEl && el !== document.body) {
      if (el.getAttribute && el.getAttribute(attr) != null) return el;
      el = el.parentNode;
    }
    return null;
  }

  /* 去重：同一次物理点击有时会触发多次 send（多个监听器叠加、
     或合成事件），导致 toggleSub 被翻转偶数次 = 看起来没反应。
     这里按「动作+目标」做 250ms 去重。 */
  var _lastSendKey = "";
  var _lastSendAt = 0;

  function send(kind, data){
    var key = kind + "|" + (data ? JSON.stringify(data) : "");
    var now = Date.now();
    if (key === _lastSendKey && now - _lastSendAt < 250) {
      return;   /* 250ms 内的重复触发，忽略 */
    }
    _lastSendKey = key;
    _lastSendAt = now;
    try {
      invoke("preview_action", { kind: kind, data: data }).catch(function(){});
    } catch(e){}
  }


  /* ⚠ 监听器绑在 **document** 而不是 bodyEl：
       render() 每次替换 bodyEl 的子节点，如果绑定挂在子节点上会失效；
       挂在 bodyEl 本身有时也会因为时序问题拿不到新节点。
       绑定到 document 一次，永久有效。 */
  /* ================= 光标进出回报 =================
     侧边栏需要知道光标是不是在浮层里 —— 在里面就绝不能关窗口。
     以前它靠猜（elementFromPoint 在侧边栏里找卡片），
     光标一进浮层就找不到卡片，于是把窗口关掉了。 */
  function reportPointer(inside){
    try {
      invoke("preview_pointer", { inside: inside }).catch(function(){});
    } catch(e){}
  }

  (function(){
    var wasIn = false;
    document.addEventListener("mouseover", function(){
      if (!wasIn) { wasIn = true; reportPointer(true); }
    }, true);
    /* 每次移动都回报心跳（限流 300ms），
       让侧边栏能持续知道「光标还在浮层里」，别把浮层关掉。 */
    var lastBeat = 0;
    document.addEventListener("mousemove", function(){
      wasIn = true;
      var now = Date.now();
      if (now - lastBeat < 300) return;
      lastBeat = now;
      reportPointer(true);
    }, true);
    document.addEventListener("mouseout", function(ev){
      if (ev.relatedTarget) return;      /* 还在页面里 */
      if (wasIn) { wasIn = false; reportPointer(false); }
    }, true);
    document.addEventListener("mouseleave", function(){
      if (wasIn) { wasIn = false; reportPointer(false); }
    }, true);

    /* ⚠ 不要"启动即回报 inside=true"。
       浮层是鼠标悬停时弹出的，此时光标还在侧边栏的卡片上，
       根本没进浮层。虚假回报会让侧边栏把 __pointerInPreview 置 true，
       而浮层又收不到后续 mouseout（鼠标压根没进来过），
       这个标记就永远清不掉 —— 于是 scheduleHide 一直被挡，
       浮层再也关不掉。

       改成：只在**真的**收到鼠标事件时才回报 true。 */
  })();

  function bindActions(){
    if (window.__pvBound) return;
    window.__pvBound = true;
    var bindTarget = document;

    /* ---------- 单击 ---------- */
    bindTarget.addEventListener("click", function(ev){
      var t = ev.target;
      /* 确认框/输入框里的点击由它们自己的监听器处理，别在这儿拦 */
      if (t && t.closest && t.closest("#askMask")) return;
      if (!t || !t.getAttribute) return;

      /* 1. 百分比按钮：展开一条滑动条（和侧边栏一样，不用弹框） */
      var pct = closestData(t, "data-step-pct");
      if (pct) {
        ev.preventDefault();
        ev.stopPropagation();
        togglePctBox(pct);
        return;
      }

      /* 2. 通用动作按钮 */
      var act = closestData(t, "data-act");
      if (act) {
        ev.preventDefault();
        ev.stopPropagation();
        var data = {};
        Array.prototype.forEach.call(act.attributes, function(a){
          if (a.name.indexOf("data-") === 0) data[a.name.slice(5)] = a.value;
        });
        send("act", data);
        return;
      }

      /* 3. 删除任务 */
      var del = closestData(t, "data-deltask");
      if (del) {
        ev.preventDefault();
        ev.stopPropagation();
        /* 直接删，不弹框 —— 确认框在浮层里和点击委托打架，实测不可靠。
           删错了可以从云端拉回来。 */
        var _dIdx = del.getAttribute("data-deltask");
        if (_dIdx != null) send("deltask", { idx: _dIdx });
        return;
      }

      /* 3.5 数据库：笔记本 / 单个数据库的展开 */
      var nb = closestData(t, "data-nb");
      if (nb) {
        ev.preventDefault();
        ev.stopPropagation();
        send("dbToggle", { kind: "nb", key: nb.getAttribute("data-nb") });
        return;
      }
      var av = closestData(t, "data-av");
      if (av) {
        ev.preventDefault();
        ev.stopPropagation();
        send("dbToggle", { kind: "av", key: av.getAttribute("data-av") });
        return;
      }

      /* 4. 星标（重要性） */
      var star = closestData(t, "data-star");
      if (star) {
        ev.preventDefault();
        ev.stopPropagation();
        send("star", { idx: star.getAttribute("data-star") });
        return;
      }

      /* 4.4 番茄预备面板：开始 / 取消 */
      var prepCancel = closestData(t, "data-prep-cancel");
      if (prepCancel) {
        ev.preventDefault();
        ev.stopPropagation();
        send("prepCancel", {});
        return;
      }
      var prepGo = t.closest ? t.closest(".stepPrepGo") : null;
      if (prepGo) {
        ev.preventDefault();
        ev.stopPropagation();
        /* 从按钮往上找预备框，读出时长和说明 */
        var box = prepGo.closest("li.stepPrep") || prepGo.parentNode;
        var mi = box ? box.querySelector(".stepPrepMin") : null;
        var nt = box ? box.querySelector(".stepPrepNote") : null;
        var mins = mi ? (Math.round(Number(mi.value) || 0)) : 0;
        if (!(mins > 0)) mins = 25;
        send("prepGo", {
          ti: box ? box.getAttribute("data-prep-ti") : null,
          si: box ? box.getAttribute("data-prep-si") : null,
          min: mins,
          note: nt ? String(nt.value || "").trim() : ""
        });
        return;
      }

      /* 4.45 补录番茄 / 新增步骤 */
      var retro = closestData(t, "data-retro");
      if (retro) {
        ev.preventDefault();
        ev.stopPropagation();
        send("retroOpen", { key: retro.getAttribute("data-retro") });
        return;
      }
      var retroOk2 = closestData(t, "data-retro-ok");
      if (retroOk2) {
        ev.preventDefault();
        ev.stopPropagation();
        var rbx2 = retroOk2.closest(".retroBox") || retroOk2.parentNode;
        var rmi2 = rbx2 ? rbx2.querySelector(".retroMin") : null;
        var rnt2 = rbx2 ? rbx2.querySelector(".retroNote") : null;
        send("retroSave", {
          key: retroOk2.getAttribute("data-retro-ok"),
          min: rmi2 ? (Math.round(Number(rmi2.value) || 0)) : 25,
          note: rnt2 ? String(rnt2.value || "") : ""
        });
        return;
      }
      var subAdd = closestData(t, "data-subadd");
      if (subAdd) {
        ev.preventDefault();
        ev.stopPropagation();
        send("subAddOpen", { ti: subAdd.getAttribute("data-subadd") });
        return;
      }
      var subAddOk2 = closestData(t, "data-subadd-ok");
      if (subAddOk2) {
        ev.preventDefault();
        ev.stopPropagation();
        var sbx2 = subAddOk2.closest(".subAddBox") || subAddOk2.parentNode;
        var sin2 = sbx2 ? sbx2.querySelector(".subAddIn") : null;
        send("subAddSave", {
          ti: subAddOk2.getAttribute("data-subadd-ok"),
          text: sin2 ? String(sin2.value || "") : ""
        });
        return;
      }

      /* 4.5 插入步骤 / 删除步骤 / 番茄计时 */
      var ins = closestData(t, "data-step-ins");
      if (ins) {
        ev.preventDefault();
        ev.stopPropagation();
        send("stepIns", { key: ins.getAttribute("data-step-ins") });
        return;
      }
      var pomo = closestData(t, "data-step-pomo");
      if (pomo) {
        ev.preventDefault();
        ev.stopPropagation();
        send("stepPomo", { ti: pomo.getAttribute("data-ti"), si: pomo.getAttribute("data-si") });
        return;
      }
      var delStep = closestData(t, "data-step-del");
      if (delStep) {
        ev.preventDefault();
        ev.stopPropagation();
        send("stepDel", { key: delStep.getAttribute("data-step-del") });
        return;
      }

      /* 5. 点步骤 = 切换完成 */
      var li = closestData(t, "data-si");
      if (li && li.getAttribute("data-ti") != null) {
        ev.preventDefault();
        ev.stopPropagation();
        send("toggleSub", { ti: li.getAttribute("data-ti"), si: li.getAttribute("data-si") });
        return;
      }
    }, true);

    /* ---------- 双击：**原地编辑** ----------
       以前双击弹一个输入框让用户确认，多一步操作。
       现在直接把那个元素变成可编辑，回车 / 失焦即提交，Esc 取消。
       和侧边栏卡片里的双击行为一致。 */
    /* ---------- 步骤百分比：滑动条 ----------
       侧边栏里点 % 会展开一条滑动条。预览是拷贝的 DOM，
       这个面板不会带过来，所以在这里现做一份。 */
    var pctBox = null;
    function closePctBox(){
      if (pctBox && pctBox.parentNode) pctBox.parentNode.removeChild(pctBox);
      pctBox = null;
      window.__pctBoxOpen = false;
    }
    function togglePctBox(btn){
      var key = btn.getAttribute("data-step-pct");
      /* 再点同一个就收起 */
      if (pctBox && pctBox.getAttribute("data-for") === key) { closePctBox(); return; }
      closePctBox();

      var curTxt = (btn.textContent || "").trim();
      var cur = /^\d+$/.test(curTxt) ? parseInt(curTxt, 10) : 0;

      var box = document.createElement("div");
      box.className = "stepPctBox pvPctBox";
      box.setAttribute("data-for", key);

      var lbl = document.createElement("span");
      lbl.className = "stepPctLbl";
      lbl.textContent = "完成";
      box.appendChild(lbl);

      var range = document.createElement("input");
      range.type = "range";
      range.min = "0";
      range.max = "100";
      range.step = "5";
      range.value = cur;
      range.className = "stepPctRange";
      box.appendChild(range);

      var val = document.createElement("span");
      val.className = "stepPctVal";
      val.textContent = cur + "%";
      box.appendChild(val);

      var ok = document.createElement("button");
      ok.className = "stepPctOk";
      ok.textContent = "定";
      box.appendChild(ok);

      var cancel = document.createElement("button");
      cancel.className = "stepPctCancel";
      cancel.textContent = "✕";
      box.appendChild(cancel);

      /* 拖动时只更新数字，松手/点「定」才提交 */
      range.addEventListener("input", function(){ val.textContent = range.value + "%"; });
      range.addEventListener("change", function(){
        val.textContent = range.value + "%";
      });

      ok.addEventListener("click", function(e2){
        e2.preventDefault();
        e2.stopPropagation();
        send("stepPct", { key: key, pct: parseInt(range.value, 10) || 0 });
        closePctBox();
      });
      cancel.addEventListener("click", function(e2){
        e2.preventDefault();
        e2.stopPropagation();
        closePctBox();
      });

      /* 插到这个步骤 li 的后面 */
      var li = btn.closest("li") || btn.parentNode;
      li.parentNode.insertBefore(box, li.nextSibling);
      pctBox = box;
      window.__pctBoxOpen = true;      /* 让 render 暂停，别把面板冲掉 */
      try { range.focus(); } catch(e2){}
    }

    var editingEl = null;
    var editingOrig = "";

    function beginEdit(el, commit){
      if (editingEl === el) return;
      if (editingEl) cancelEdit();

      editingEl = el;
      window.__editing = true;
      editingOrig = (el.textContent || "").trim();
      el.setAttribute("contenteditable", "true");
      el.classList.add("pvEditing");
      el.focus();

      /* 全选，方便直接重打 */
      try {
        var r = document.createRange();
        r.selectNodeContents(el);
        var sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(r);
      } catch(e){}

      function finish(ok){
        if (editingEl !== el) return;
        el.removeEventListener("keydown", onKey);
        el.removeEventListener("blur", onBlur);
        el.setAttribute("contenteditable", "false");
        el.classList.remove("pvEditing");
        editingEl = null;
        window.__editing = false;

        var now = (el.textContent || "").trim();
        if (!ok || now === editingOrig) {
          el.textContent = editingOrig;    /* 取消或没改：还原 */
          return;
        }
        commit(now);
      }
      function onKey(e2){
        if (e2.key === "Enter") { e2.preventDefault(); e2.stopPropagation(); finish(true); }
        else if (e2.key === "Escape") { e2.preventDefault(); e2.stopPropagation(); finish(false); }
      }
      function onBlur(){ finish(true); }

      el.addEventListener("keydown", onKey);
      el.addEventListener("blur", onBlur);
    }

    function cancelEdit(){
      if (!editingEl) return;
      var el = editingEl;
      editingEl = null;
      window.__editing = false;
      el.setAttribute("contenteditable", "false");
      el.classList.remove("pvEditing");
      el.textContent = editingOrig;
    }

    bindTarget.addEventListener("dblclick", function(ev){
      var t = ev.target;
      if (!t || !t.getAttribute) return;

      var sub = closestData(t, "data-edit-sub");
      if (sub) {
        ev.preventDefault();
        ev.stopPropagation();
        var key = sub.getAttribute("data-edit-sub");
        beginEdit(sub, function(v){
          send("editSub", { key: key, text: v });
        });
        return;
      }

      var nm = closestData(t, "data-edit");
      if (nm) {
        ev.preventDefault();
        ev.stopPropagation();
        var key2 = nm.getAttribute("data-edit");
        beginEdit(nm, function(v2){
          send("editName", { key: key2, text: v2 });
        });
      }
    }, true);

    /* 编辑中的元素不要被「重渲染」冲掉：
       刷新内容时如果正在编辑，就把编辑状态记下来，渲染后恢复 */
    window.__editingKey = function(){
      if (!editingEl) return null;
      return editingEl.getAttribute("data-edit-sub") || editingEl.getAttribute("data-edit") || null;
    };

    /* 输入框保持可用，但别让浏览器默认提交 */
    bindTarget.addEventListener("submit", function(ev){ ev.preventDefault(); }, true);

    /* ---- 搜索框输入 ----
       预览是独立窗口，它这里没有侧边栏的 DOM，
       所以把输入内容发给侧边栏去过滤。 */
    bindTarget.addEventListener("input", function(ev){
      var t = ev.target;
      if (!t || !t.classList || !t.classList.contains("pvDbSearch")) return;
      send("dbSearch", { q: t.value });
    }, true);
  }

  var _lastRaw = "";   /* 上一次渲染过的 payload，用来跳过无变化的轮询 */
  window.__renderCount = 0;

  function loadOnce(){
    invoke("preview_payload").then(function(txt){
      _lastRaw = txt || "";
      render(txt);
      window.__renderCount++;
    }).catch(function(){
      bodyEl.textContent = "（内容读取失败）";
    });
  }

  window.__renderPreview = render;
  /* Rust 侧内容更新后会调它，只重读文件、不动窗口 */
  window.__reload = loadOnce;

  loadOnce();
  setTimeout(loadOnce, 220);

  /* ---- 主动轮询 ----
     Rust 那边原本用 eval("__reload()") 通知刷新，但 WebView2 上
     eval 到另一个窗口有时会被丢掉 —— 表现就是「操作完了浮层不变，
     要关掉重开才更新」。
     这里改成自己每 320ms 读一次 payload 文件，内容变了就重渲染。
     payload 只有几 KB，开销可以忽略。 */
  /* ================= 自动刷新 =================
     预览窗独立运行，侧边栏改完数据后要让它自己发现。
     这里用 setTimeout 递归轮询（不用 setInterval，避免回调堆积），
     每 200ms 读一次 payload 文件，读到就渲染。
     不做"内容没变就跳过"的优化 —— 那个优化一旦某次渲染失败，
     之后内容就再也不会更新（表现就是"点了没反应，关掉重开才好"）。
     每 200ms 重写一次 7KB 的 DOM，开销可以忽略。 */
  var _pollTimer = null;
  var _pollBusy = false;
  var _pollFails = 0;

  function pollOnce(){
    if (_pollBusy) { schedulePoll(); return; }
    _pollBusy = true;
    var inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
    if (!inv) { _pollBusy = false; schedulePoll(); return; }

    var done = false;
    function finish(){
      if (done) return;
      done = true;
      _pollBusy = false;
  schedulePoll();
    }

    /* 兜底：3 秒还没回来就强制解锁，不让轮询停摆 */
    setTimeout(finish, 3000);

    try {
      inv("preview_payload").then(function(txt){
        _pollFails = 0;
        if (txt) {
          try { render(txt); window.__renderCount++; } catch(e){}
        }
        finish();
      }).catch(function(){
        _pollFails++;
        finish();
      });
    } catch(e) {
      finish();
    }
  }

  function schedulePoll(){
    if (_pollTimer) clearTimeout(_pollTimer);
    _pollTimer = setTimeout(pollOnce, 200);
  }

  schedulePoll();
})();
</script>


</body>
</html>
