<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>预览</title>
<style>
:root{
  --ink:#2b2a26; --sub:#8a8478; --brand:#1B365D;
  --line:rgba(226,214,186,.85);
}

  html, body{
    margin:0; padding:0; height:100%; width:100%;
    background:transparent; overflow:hidden;
    font:12px/1.65 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color:var(--ink);
  }
  #card{
    height:100%; box-sizing:border-box;
    padding:12px 14px; overflow-y:auto;
    background:rgba(255,251,238,.99);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 4px 10px rgba(120,110,90,.14),
               0 16px 44px rgba(120,110,90,.26),
               inset 0 1px 0 rgba(255,255,255,.95);
    scrollbar-width:thin; scrollbar-color:rgba(150,140,120,.35) transparent;
  }
  #card::-webkit-scrollbar{ width:6px; }
  #card::-webkit-scrollbar-thumb{ background:rgba(150,140,120,.32); border-radius:3px; }
  .pvTitle{
    font-size:12.5px; font-weight:700; color:var(--brand);
    margin:0 0 10px; padding-bottom:7px;
    border-bottom:1px solid rgba(226,214,186,.7);
    display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;
  }
  .pvTitle .pvHint{
    margin-left:auto; font-size:10px; font-weight:400; color:#b9b2a3;
  }
  #body > *:first-child{ margin-top:0 !important; }
  #body > *:last-child{ margin-bottom:0 !important; }

/* ===== 以下从侧边栏原样搬过来，保证预览里的排版和卡片一致 ===== */

  :root{
    --bg:#f6f4ec; --card:#fffdf7; --line:#e2dccb; --line2:#cdb48c;
    /* 文字统一用近纯黑，配合下面的提亮底衬托 */
    --ink:#0d0c0a; --sub:#2b2925; --dim:#4a453d; --brand:#1B365D;
  }
  *{ box-sizing:border-box; }
  html,
  /* 毛玻璃，边缘做成**不规则**的雾化。

     ⚠ 关键约束：窗口只有 400px 宽，渐变画到 100% 就被截断。
     每层 alpha 必须提前归零，否则最后几像素是实心白 → 硬边。

     怎么做到"不规则"：
     单个椭圆再宽也是个规整的蛋形。这里用 9 层**偏心、长宽比各不相同**
     的径向渐变叠加，每层的中心点、半径、衰减曲线都不一样，
     合成后的不透明度就没有任何可辨认的轮廓 —— 像烟不规则地散开。
     再叠一层 SVG 噪点做细微扰动，让过渡带上带有轻微的颗粒感，
     不会出现那种"计算机画出来的完美渐变"观感。 */
  
  /* 噪点层：单独一层，叠在玻璃之上、文字之下，只影响观感不影响阅读 */
  
  @keyframes noiseShift{
    0%   { background-position:0 0; }
    20%  { background-position:-24px -18px; }
    40%  { background-position:18px -30px; }
    60%  { background-position:-30px 22px; }
    80%  { background-position:26px 13.3px; }
    100% { background-position:0 0; }
  }
  @keyframes smokeDrift{
    0%   { transform:translate3d(0, 0, 0) scale(1); }
    33%  { transform:translate3d(-0.3%, -0.35%, 0) scale(1.006); }
    66%  { transform:translate3d(0.35%, 0.2%, 0) scale(1.011); }
    100% { transform:translate3d(0.15%, -0.15%, 0) scale(1.004); }
  }
  /* 用户要求减弱动画时全部静止 */
  @media (prefers-reduced-motion: reduce){
    body::before, body::after{ animation:none; }
  }
  /* 顶栏：透的，只留一条细分隔线；悬停时轻微加深，方便抓取拖动 */
  
  .hd:hover{ background:rgba(255,255,255,.55); }
  .hd .ttl{ font-weight:700; color:var(--brand); font-size:12.8px; letter-spacing:.02em;
    text-shadow:0 0.9px 0 rgba(255,255,255,.6);
    flex:none; white-space:nowrap; cursor:pointer; }
  .hd .sp{ flex:1 1 auto; min-width:0; }
  .hd button{
    border:0.9px solid rgba(190,180,160,.5); background:rgba(255,255,255,.55); color:var(--sub);
    border-radius:5.7px; font-size:10.9px; padding:1.9px 7.6px; cursor:pointer; font-family:inherit;
    white-space:nowrap; flex:none;
  }
  .hd button:hover{ border-color:var(--brand); color:var(--brand); background:rgba(255,255,255,.85); }
  /* 「打开工作台」：主入口，做得比其它小按钮显眼一点 */
  .hd .hdOpen{
    border-color:rgba(27,54,93,.45); background:rgba(27,54,93,.08); color:var(--brand);
    font-weight:600; letter-spacing:.01em;
    /* 固定宽度：「⤢ 工作台」和「⤡ 收起」字数不同，
       不锁宽的话切换时标题栏会左右抖一下 */
    min-width:74px; text-align:center;
  }
  .hd .hdOpen:hover{ background:var(--brand); color:#fff; border-color:var(--brand); }
  /* 开关状态：工作台开着时按钮反色、常亮，一眼看出「再点一下就会收起」 */
  .hd .hdOpen.on{
    background:var(--brand); color:#fff; border-color:var(--brand);
    box-shadow:0 0 0 1.9px rgba(27,54,93,.14);
  }
  .hd .hdOpen.on:hover{ background:#12253f; border-color:#12253f; }

  /* 手动拉取选择框：盖在侧边栏上，玻璃底 + 纸感按钮 */
  .pullAsk{
    position:fixed; inset:0; z-index:999; display:none;
    align-items:center; justify-content:center;
    background:rgba(20,18,14,.28); backdrop-filter:blur(2.8px);
  }
  .pullAsk .pa-card{
    width:260px; padding:15.2px 15.2px 11.4px;
    background:linear-gradient(180deg,#fffdf7,#f7f4ea);
    border:0.9px solid rgba(190,180,160,.6); border-radius:11.4px;
    box-shadow:0 11.4px 34px -11.4px rgba(27,54,93,.45), 0 0.9px 0 rgba(255,255,255,.8) inset;
    display:flex; flex-direction:column; gap:7.6px;
  }
  .pullAsk .pa-title{ font-size:12.8px; font-weight:700; color:var(--brand); }
  .pullAsk .pa-desc{ font-size:10.9px; color:var(--dim); margin-bottom:1.9px; }
  /* 两端差异说明：列出仅本地 / 仅云端各是哪几条 */
  .pullAsk .pa-diff{ font-size:10.0px; color:#8a6d2f; background:rgba(217,160,21,.08);
    border:0.9px solid #e8d9a8; border-radius:4.8px; padding:3.8px 6.6px; margin:2.8px 0 4.8px;
    line-height:1.55; word-break:break-all; }
  .pullAsk .pa-btn{
    padding:7.6px 9.5px; border-radius:7.6px; cursor:pointer; font-family:inherit;
    border:0.9px solid rgba(27,54,93,.35); background:rgba(27,54,93,.06);
    color:var(--brand); font-size:11.4px; font-weight:600;
    transition:background .15s, color .15s, border-color .15s;
    display:flex; flex-direction:column; align-items:flex-start; gap:1.9px;
  }
  .pullAsk .pa-btn:hover{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .pullAsk .pa-btn:hover .pa-time{ opacity:.9; }
  .pullAsk .pa-btn .pa-nm{ font-size:11.4px; font-weight:600; }
  .pullAsk .pa-btn .pa-time{
    font-size:10.0px; font-weight:400; opacity:.75; font-variant-numeric:tabular-nums;
  }
  .pullAsk .pa-wb{
    margin-top:1.9px; padding:5.7px 7.6px; border-radius:5.7px;
    background:rgba(190,180,160,.12); border:0.9px dashed rgba(190,180,160,.5);
    font-size:10.0px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  .pullAsk .pa-cancel{
    margin-top:1.9px; padding:4.8px; border:0; background:transparent;
    color:var(--dim); font-size:10.9px; cursor:pointer; font-family:inherit;
  }
  .pullAsk .pa-cancel:hover{ color:var(--sub); }

  /* ================= 卡片布局 =================
     每张卡片是一个固定高度的块，内容超出时在卡片内部滚动
     （卡片自己带滚动条，能看出「还有内容」）。
     卡片之间不抢空间，整列在 .scroll 里上下滚。

     三种交互：
       · 悬停 → 右侧浮出完整预览（只读，不改变卡片本身高度）
       · 双击标题 → 在侧边栏内展开 / 再双击折叠
       · 标题右侧的 ⌄ 按钮 → 同上，点一下即知当前状态
     ============================================ */
  
  .scroll > .card::-webkit-scrollbar{ width:5.7px; }
  .scroll > .card::-webkit-scrollbar-thumb{ background:rgba(150,140,120,.3); border-radius:2.8px; }
  .scroll > .card::-webkit-scrollbar-track{ background:transparent; }

  /* 番茄钟内容少，给个更矮的上限 */
  .scroll > .card#cardPomo{ max-height:none; overflow:hidden; }

  /* ---- 折叠态 ---- */
  .scroll > .card.isCollapsed{
    max-height:46px; overflow:hidden;
  }
  .scroll > .card.isCollapsed > :not(h3){ display:none !important; }

  /* ---- 展开态（双击 / 点按钮）---- */
  .scroll > .card.isExpanded{
    max-height:420px; overflow-y:auto;
  }

  /* ---- 标题行：常驻，右侧带折叠按钮 ---- */
  .scroll > .card > h3{
    position:sticky; top:0; z-index:2;
    background:rgba(255,251,238,.97);
    cursor:pointer;
    user-select:none;
    /* 占满卡片宽度，滚动时标题条不会只覆盖一部分 */
    margin-left:-11.4px; margin-right:-11.4px;
    padding-left:11.4px; padding-right:11.4px;
    padding-top:1.9px; padding-bottom:1.9px;
  }
  .scroll > .card.isCollapsed > h3{ margin-bottom:0; }

  /* 折叠/展开按钮：一个小胶囊，箭头 + 状态文字，一眼看出当前是什么状态。
     折叠时箭头朝右并写「展开」，展开时箭头朝下并高亮写「收起」。 */
  
  
  
  
  
  #cardPreview.on{ opacity:1; transform:translateY(0); }
  #cardPreview::-webkit-scrollbar{ width:5.7px; }
  #cardPreview::-webkit-scrollbar-thumb{ background:rgba(150,140,120,.32); border-radius:2.8px; }
  #cardPreview .pvTitle{
    font-size:11.9px; font-weight:700; color:var(--brand, #1B365D);
    margin:0 0 7.6px; padding-bottom:5.7px;
    border-bottom:0.9px solid rgba(226,214,186,.7);
    display:flex; align-items:baseline; gap:5.7px; flex-wrap:wrap;
  }
  #cardPreview .pvTitle .pvHint{
    margin-left:auto; font-size:9.5px; font-weight:400; color:#b9b2a3;
  }
  #cardPreview .pvBody > *:first-child{ margin-top:0 !important; }
  #cardPreview .pvBody > *:last-child{ margin-bottom:0 !important; }


  /* 滚动内容不做任何遮罩：mask 会把文字一起淡掉。
     真正需要柔化的只有窗口边缘的玻璃层，那是 body::before 的事。 */

  /* 剪藏助手 iframe：透明底，跟着整块玻璃走 */
  .clipFrame{
    width:100%; height:420px; border:0.9px solid rgba(221,213,196,.5);
    border-radius:7.6px; background:transparent; display:block;
    color-scheme:normal;
  }

  /* 卡片：默认**完全透明**，让底下的不规则玻璃层完整透出来。
     之前给 .30 的白底会把边缘渐变盖住，看起来就是"玻璃没有雾化、
     只是一块白" —— 这是雾化没生效的最主要原因。
     鼠标移上去时才变成接近不透明。 */
  
  .card:hover{
    background:rgba(255,251,238,.97);
    border-color:rgba(226,214,186,.55);
    box-shadow:0 1.9px 5.7px rgba(120,110,90,.08),
               0 9.5px 32px rgba(120,110,90,.13),
               0 22px 60px rgba(120,110,90,.07),
               inset 0 0.9px 0 rgba(255,255,255,.9);
  }
  /* 悬停时卡片里的小控件也用不透明底，避免透出别的东西显得脏 */
  .card:hover .pomoBtn,
  .card:hover .pomoNoteIn,
  .card:hover .pomoCur,
  .card:hover .hdBtn,
  .card:hover .addTask,
  .card:hover .miniAct,
  .card:hover .planAdd,
  .card:hover .planCancel{ background:#fffdf7; }
  .card > h3{
    margin:0 0 7.6px; font-size:11.4px; color:var(--brand); font-weight:700;
    display:flex; align-items:baseline; gap:5.7px;
  }
  .card > h3 .mini{ font-size:10.0px; color:#4a453d; font-weight:400; margin-left:auto; }

  /* 评分 */
  .score{ display:flex; align-items:baseline; gap:5.7px; margin-bottom:5.7px; }
  .score b{ font-size:26px; color:var(--brand); font-family:Georgia,serif; line-height:1; }
  .score .u{ font-size:10.4px; color:var(--sub); }
  .score .g{ font-size:10.4px; font-weight:700; color:#fff; background:var(--brand); border-radius:4.8px; padding:0 6.6px; }
  .score .g[data-g="A"]{ background:#2f7a4f; }
  .score .g[data-g="C"]{ background:#b5762a; }
  .score .g[data-g="D"]{ background:#8b4513; }
  .score .g[data-g="S"]{ background:#8a6d2f; }
  .bar{ height:3.8px; background:rgba(239,232,216,.6); border-radius:2.8px; overflow:hidden; margin-bottom:5.7px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,#1B365D,#4f8ef7); }
  .meta{ font-size:10.4px; color:var(--sub); display:flex; flex-wrap:wrap; gap:1.9px 9.5px; }
  .meta b{ color:var(--brand); }

  /* 任务 */
  .task{ border-top:0.9px dashed #e6e0d1; padding:6.6px 0 4.8px; }
  .task:first-of-type{ border-top:0; padding-top:1.9px; }
  .task .row1{ display:flex; align-items:baseline; gap:5.7px; }
  .task .nm{ flex:1 1 auto; min-width:0; font-size:11.9px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task .q{ flex:none; font-size:9.5px; color:#8a6d2f; background:rgba(247,239,216,.55);
    border:0.9px solid #e6d9b4; border-radius:6.6px; padding:0 4.8px; }
  .subs{ margin:3.8px 0 0; padding:0; list-style:none; }
  .subs li{ font-size:10.9px; color:var(--sub); display:flex; gap:5.7px; padding:0.9px 0; }
  .subs li.done{ color:#a9a397; text-decoration:line-through; }
  .subs .bx{ flex:none; width:10.4px; height:10.4px; border:0.9px solid #c9c1ae; border-radius:2.8px; margin-top:3.8px; }
  .subs li.done .bx{ background:#2f7a4f; border-color:#2f7a4f; }
  .subs li{ cursor:pointer; border-radius:3.8px; }
  .subTxt{ flex:1 1 auto; min-width:0; }
  /* 步骤级番茄：累计徽标 + 悬停出现的记时按钮 */
  .pomoBadge{ flex:none; font-size:9.0px; color:#8a6d2f; background:rgba(247,239,216,.55);
    border:0.9px solid #e6d9b4; border-radius:6.6px; padding:0 3.8px; white-space:nowrap; }
  .stepPomo{ flex:none; border:0; background:transparent; color:#c9a227; cursor:pointer;
    font-size:9.5px; padding:0 1.9px; opacity:0; transition:opacity .12s; font-family:inherit; }
  .subs li:hover .stepPomo{ opacity:1; }
  .stepPomo:hover{ color:#d9822b; }
  /* 步骤行右侧的 ＋ 插入 / ✕ 删除：平时很淡，悬停才明显，别抢注意力 */
  .stepIns, .stepDel{ flex:none; border:0; background:transparent; cursor:pointer;
    font-size:9.5px; line-height:1; padding:0 1.9px; opacity:.18; transition:opacity .12s; }
  .subs li:hover .stepIns, .subs li:hover .stepDel{ opacity:1; }
  .stepIns{ color:#7a9a6a; }
  .stepIns:hover{ color:#2f7a4f; }
  .stepDel{ color:#b0897a; }
  .stepDel:hover{ color:#c0392b; }
  /* 步骤进度徽标：0% 时只显示一个很淡的「%」，有进度才染色 */
  .stepPct{ flex:none; border:0.9px solid transparent; border-radius:3.8px; cursor:pointer;
    font:600 9.0px/1.5 inherit; font-family:inherit; padding:0 3.8px; min-width:22px; text-align:center; }
  .stepPct.none{ color:#a8a397; background:transparent; opacity:.28; font-weight:400; }
  .subs li:hover .stepPct.none{ opacity:.9; }
  .stepPct.low{ color:#8a6d2f; background:#fff3d8; border-color:#ecd9a4; }
  .stepPct.mid{ color:#1B365D; background:#eaf0f8; border-color:#c3d2e6; }
  .stepPct.high{ color:#2f7a4f; background:#eaf5ee; border-color:#bfdccb; }
  .stepPct.full{ color:#2f7a4f; background:#dff0e7; border-color:#a8d0b8; }
  /* 进度调节条 */
  li.stepPctBox{ display:flex; align-items:center; gap:5.7px; margin:1.9px 0 3.8px 13.3px;
    padding:3.8px 6.6px; border:0.9px solid #d8d0bd; background:#fffbe9; border-radius:4.8px; }
  .stepPctLbl{ flex:none; font-size:9.5px; color:#7a6f5c; }
  .stepPctRange{ flex:1 1 auto; min-width:0; height:2.8px; accent-color:#d9822b; cursor:pointer; }
  .stepPctVal{ flex:none; min-width:32px; text-align:right; font:600 10.0px/1.5 inherit;
    font-family:inherit; color:#8a6d2f; }
  .stepPctOk{ flex:none; padding:0.9px 8.5px; border:0.9px solid #d9a015; background:#fbeec4;
    color:#8a6d2f; border-radius:3.8px; font:10.0px/1.6 inherit; font-family:inherit;
    font-weight:600; cursor:pointer; }
  .stepPctOk:hover{ background:#f6e2a8; }
  .stepPctCancel{ flex:none; padding:0.9px 5.7px; border:0.9px solid #d8d2c4; background:#fffdf7;
    color:#8a8579; border-radius:3.8px; font:10.0px/1.6 inherit; font-family:inherit; cursor:pointer; }
  /* 插入新步骤的输入行 */
  li.stepInsBox{ display:flex; align-items:center; gap:3.8px; margin:1.9px 0 3.8px 13.3px;
    padding:2.8px 4.8px; border:0.9px solid #d8d0bd; background:#fffefb; border-radius:4.8px; }
  .stepInsIn{ flex:1 1 auto; min-width:0; border:0.9px solid #e0dacb; border-radius:3.8px;
    padding:0.9px 4.8px; font:10.4px/1.6 inherit; font-family:inherit; background:#fff; color:var(--ink); }
  .stepInsIn:focus{ outline:none; border-color:var(--brand); }
  .stepInsOk{ flex:none; padding:0.9px 8.5px; border:0.9px solid var(--brand); background:#EEF2F7;
    color:var(--brand); border-radius:3.8px; font:10.0px/1.6 inherit; font-family:inherit; cursor:pointer; }
  .stepInsOk:hover{ background:#dde6f2; }
  .stepInsCancel{ flex:none; padding:0.9px 5.7px; border:0.9px solid #d8d2c4; background:#fffdf7;
    color:#8a8579; border-radius:3.8px; font:10.0px/1.6 inherit; font-family:inherit; cursor:pointer; }
  /* 点 🍅 后的「设时长」预备框：跟在步骤行下面 */
  li.stepPrep{ display:flex; align-items:center; gap:4.8px; margin:2.8px 0 3.8px 13.3px;
    padding:3.8px 5.7px; border:0.9px solid #e8d9a8; background:#fffbe9; border-radius:4.8px; }
  .stepPrepMin{ width:46px; box-sizing:border-box; padding:0.9px 3.8px; border:0.9px solid #d8caa0;
    border-radius:3.8px; font:10.4px/1.6 inherit; font-family:inherit; color:var(--ink); background:#fff; }
  .stepPrepMin:focus{ outline:none; border-color:#d9822b; }
  .stepPrepUnit{ font-size:9.5px; color:#7a6f5c; }
  /* 「这一步在做什么」输入框：占满中间，和主窗口的说明框一致 */
  .stepPrepNote{ flex:1 1 auto; min-width:0; box-sizing:border-box; padding:0.9px 4.8px;
    border:0.9px solid #e2d5b0; border-radius:3.8px; font:10.4px/1.6 inherit; font-family:inherit;
    background:#fffefb; color:var(--ink); }
  .stepPrepNote:focus{ outline:none; border-color:#d9822b; }
  .stepPrepGo{ flex:none; padding:0.9px 9.5px; border:0.9px solid #d9a015; background:#fbeec4;
    color:#8a6d2f; border-radius:3.8px; font:10.4px/1.6 inherit; font-family:inherit;
    font-weight:600; cursor:pointer; }
  .stepPrepGo:hover{ background:#f6e2a8; }
  .stepPrepCancel{ flex:none; padding:0.9px 5.7px; border:0.9px solid #d8d2c4; background:#fffdf7;
    color:#8a8579; border-radius:3.8px; font:10.4px/1.6 inherit; font-family:inherit; cursor:pointer; }
  .stepPrepCancel:hover{ background:#f4f2ec; }

  .wkTodayTips li.good.lv3 .wkTipK{ color:#1f5c39; }
  .wkTodayTips li.good .wkTipK b.n{ color:inherit; }

  /* —— 持平：不变色 —— */
  .wkTodayTips li.flat .wkTipK{ color:var(--ink); }

  /* 数字格子 / 标签 / 列表（知识图谱、数据库汇总） */
  .grid4, .grid2{ display:grid; gap:5.7px; margin-bottom:7.6px; }
  .grid4{ grid-template-columns:repeat(4,1fr); }
  .grid2{ grid-template-columns:repeat(2,1fr); }
  .grid4 > div, .grid2 > div{ text-align:center; background:transparent; border:0.9px solid rgba(221,213,196,.55);
    border-radius:7.6px; padding:5.7px 1.9px; }
  .grid4 b, .grid2 b{ display:block; font-size:15.2px; color:var(--brand); font-family:Georgia,serif; line-height:1.2; }
  .grid4 span, .grid2 span{ font-size:9.5px; color:#4a453d; }
  .chips{ display:flex; flex-wrap:wrap; gap:4.8px; margin-bottom:7.6px; overflow:hidden; }
  .chip{ font-size:10.0px; color:var(--sub); background:transparent; border:0.9px solid rgba(221,213,196,.55);
    border-radius:20px; padding:0 7.6px; max-width:150px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  /* 悬停整张卡片时，这些统计块才补上底色 */
  .card:hover .grid4 > div, .card:hover .grid2 > div{ background:#f7f4ea; border-color:var(--line); }
  .card:hover .chip{ background:#f7f4ea; border-color:var(--line); }
  .chip i{ font-style:normal; color:var(--brand); margin-left:3.8px; font-size:9.5px; }
  .recent{ font-size:10.9px; color:var(--sub); }
  .rline{ display:flex; gap:5.7px; align-items:baseline; padding:0.9px 0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rline .num{ margin-left:auto; color:var(--brand); font-size:10.0px; }
  .subTitle{ font-size:10.0px; color:#4a453d; margin:5.7px 0 1.9px; }

  .empty{ font-size:11.4px; color:#4a453d; line-height:1.8; }
  .empty code{ background:#f3f0e5; border:0.9px solid var(--line); border-radius:3.8px; padding:0 3.8px; font-size:10.4px; }
  .foot{ flex:none; border-top:0.9px solid var(--line); padding:5.7px 11.4px; font-size:10.0px; color:#4a453d; }

</style>
</head>
<body>
  <div id="card">
    <div class="pvTitle">
      <span id="name">预览</span>
      <span class="pvHint">只读预览</span>
    </div>
    <div id="body"></div>
  </div>

<script>
(function(){
  "use strict";
  var nameEl = document.getElementById("name");
  var bodyEl = document.getElementById("body");

  /* 内容由 Rust 写进 app_config_dir/preview-payload.json。
     ⚠ 不走 URL 参数：卡片 HTML 上千字符，编码后 URL 超长会白屏。
     ⚠ 不走 eval：WebView2 上 eval 会同步阻塞，hover 时界面卡。 */
  function render(payload){
    try {
      var p = typeof payload === "string" ? JSON.parse(payload) : payload;
      if (!p) return;
      nameEl.textContent = p.title || "预览";
      bodyEl.innerHTML = p.html || "";
    } catch(e) {
      bodyEl.textContent = "（内容解析失败）";
    }
  }

  function loadOnce(){
    try {
      var inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
      if (!inv) { bodyEl.textContent = "（预览不可用）"; return; }
      inv("preview_payload").then(render).catch(function(){
        bodyEl.textContent = "（内容读取失败）";
      });
    } catch(e) {
      bodyEl.textContent = "（预览不可用）";
    }
  }

  window.__renderPreview = render;
  loadOnce();
  setTimeout(loadOnce, 220);
})();
</script>
</body>
</html>
