<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工作台侧边栏</title>
<style>
  :root{
    --bg:#f6f4ec; --card:#fffdf7; --line:#e2dccb; --line2:#cdb48c;
    /* 文字统一用近纯黑，配合下面的提亮底衬托 */
    --ink:#0d0c0a; --sub:#2b2925; --dim:#4a453d; --brand:#1B365D;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  /* ---------- 透明 + 悬停不透明 ----------
     默认几乎全透明：窗口背后有什么就显示什么，不做任何模糊。
     只叠一层非常淡的暖黄，让文字和背景有个轻微的分离，
     又不至于挡住后面的画面。鼠标移到某张卡片上时才变不透明。 */
  html{ background:transparent; }
  body{
    margin:0; color:var(--ink);
    background:transparent;
    font:13px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
    /* 不要白色描边：叠加多层 text-shadow 会让黑字发灰发虚。
       浅色底 + 纯黑字本身的对比已经足够。 */
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    /* 让 body::before 作为独立层参与合成，不吃 body 自身的任何遮罩 */
    isolation:isolate;
  }
  /* 毛玻璃，边缘做成**不规则**的雾化。

     ⚠ 关键约束：窗口只有 400px 宽，渐变画到 100% 就被截断。
     每层 alpha 必须提前归零，否则最后几像素是实心白 → 硬边。

     怎么做到"不规则"：
     单个椭圆再宽也是个规整的蛋形。这里用 9 层**偏心、长宽比各不相同**
     的径向渐变叠加，每层的中心点、半径、衰减曲线都不一样，
     合成后的不透明度就没有任何可辨认的轮廓 —— 像烟不规则地散开。
     再叠一层 SVG 噪点做细微扰动，让过渡带上带有轻微的颗粒感，
     不会出现那种"计算机画出来的完美渐变"观感。 */
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      /* ===== 九层雾团：中心、形状、衰减全不同 ===== */
      /* 1. 主雾：偏上，宽扁 */
      radial-gradient(ellipse 138% 112% at 48% 42%,
        rgba(255,252,244,.50) 0%,
        rgba(255,252,244,.47) 24%,
        rgba(255,252,244,.42) 40%,
        rgba(255,252,244,.34) 54%,
        rgba(255,252,244,.25) 66%,
        rgba(255,252,244,.15) 77%,
        rgba(255,252,244,.07) 87%,
        rgba(255,252,244,.02) 94%,
        rgba(255,252,244,0) 98%),
      /* 2. 左侧雾：窄高，往左下拖 */
      radial-gradient(ellipse 74% 130% at 16% 62%,
        rgba(255,253,248,.34) 0%,
        rgba(255,253,248,.27) 30%,
        rgba(255,253,248,.18) 52%,
        rgba(255,253,248,.09) 70%,
        rgba(255,253,248,.03) 84%,
        rgba(255,253,248,0) 96%),
      /* 3. 右侧雾：窄高，往右上拖 */
      radial-gradient(ellipse 68% 118% at 88% 34%,
        rgba(255,253,248,.30) 0%,
        rgba(255,253,248,.23) 32%,
        rgba(255,253,248,.15) 54%,
        rgba(255,253,248,.07) 72%,
        rgba(255,253,248,.02) 86%,
        rgba(255,253,248,0) 96%),
      /* 4. 顶部雾：极扁，只影响上缘 */
      radial-gradient(ellipse 130% 46% at 44% 6%,
        rgba(255,252,242,.22) 0%,
        rgba(255,252,242,.15) 34%,
        rgba(255,252,242,.08) 56%,
        rgba(255,252,242,.02) 80%,
        rgba(255,252,242,0) 95%),
      /* 5. 底部雾：极扁，只影响下缘 */
      radial-gradient(ellipse 122% 52% at 58% 96%,
        rgba(255,250,236,.20) 0%,
        rgba(255,250,236,.13) 36%,
        rgba(255,250,236,.06) 58%,
        rgba(255,250,236,.02) 80%,
        rgba(255,250,236,0) 95%),
      /* 6. 左上小云 */
      radial-gradient(ellipse 62% 48% at 24% 18%,
        rgba(255,254,250,.16) 0%,
        rgba(255,254,250,.08) 44%,
        rgba(255,254,250,.02) 74%,
        rgba(255,254,250,0) 92%),
      /* 7. 右下小云 */
      radial-gradient(ellipse 58% 52% at 76% 84%,
        rgba(255,254,250,.15) 0%,
        rgba(255,254,250,.07) 46%,
        rgba(255,254,250,.02) 74%,
        rgba(255,254,250,0) 92%),
      /* 8. 中部偏右的横向絮状带：打断上下对称 */
      radial-gradient(ellipse 96% 34% at 64% 62%,
        rgba(255,252,246,.13) 0%,
        rgba(255,252,246,.06) 48%,
        rgba(255,252,246,0) 88%),
      /* 9. 中部偏左的横向絮状带 */
      radial-gradient(ellipse 88% 30% at 30% 48%,
        rgba(255,252,246,.11) 0%,
        rgba(255,252,246,.05) 50%,
        rgba(255,252,246,0) 88%),
      /* ===== 边缘收口：把四边精确压到透明 ===== */
      linear-gradient(to right,
        rgba(255,252,244,0) 0,
        rgba(255,252,244,.04) 8px,
        rgba(255,252,244,.11) 20px,
        rgba(255,252,244,.19) 36px,
        rgba(255,252,244,.26) 56px,
        rgba(255,252,244,.32) 82px,
        rgba(255,252,244,.36) 112px,
        rgba(255,252,244,.39) 146px,
        rgba(255,252,244,.40) 186px,
        rgba(255,252,244,.40) calc(100% - 186px),
        rgba(255,252,244,.39) calc(100% - 146px),
        rgba(255,252,244,.36) calc(100% - 112px),
        rgba(255,252,244,.32) calc(100% - 82px),
        rgba(255,252,244,.26) calc(100% - 56px),
        rgba(255,252,244,.19) calc(100% - 36px),
        rgba(255,252,244,.11) calc(100% - 20px),
        rgba(255,252,244,.04) calc(100% - 8px),
        rgba(255,252,244,0) 100%),
      linear-gradient(to bottom,
        rgba(255,252,244,0) 0,
        rgba(255,252,244,.05) 10px,
        rgba(255,252,244,.13) 24px,
        rgba(255,252,244,.22) 44px,
        rgba(255,252,244,.30) 70px,
        rgba(255,252,244,.35) 100px,
        rgba(255,252,244,.38) 130px,
        rgba(255,252,244,.38) calc(100% - 130px),
        rgba(255,252,244,.35) calc(100% - 100px),
        rgba(255,252,244,.30) calc(100% - 70px),
        rgba(255,252,244,.22) calc(100% - 44px),
        rgba(255,252,244,.13) calc(100% - 24px),
        rgba(255,252,244,.05) calc(100% - 10px),
        rgba(255,252,244,0) 100%);
    background-blend-mode:normal;
    backdrop-filter:blur(22px) saturate(1.10);
    -webkit-backdrop-filter:blur(22px) saturate(1.10);
    /* 噪点扰动：让过渡带上带极细的颗粒，不再像纯计算机渐变。
       SVG turbulence 生成，data-uri 内联，无需外部资源。 */
    -webkit-mask-image:none;
    animation:smokeDrift 34s ease-in-out infinite alternate;
  }
  /* 噪点层：单独一层，叠在玻璃之上、文字之下，只影响观感不影响阅读 */
  body::after{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    opacity:.045;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'>\
<filter id='n'>\
<feTurbulence type='fractalNoise' baseFrequency='0.86' numOctaves='3' stitchTiles='stitch'/>\
<feColorMatrix type='saturate' values='0'/>\
</filter>\
<rect width='180' height='180' filter='url(%23n)'/>\
</svg>");
    background-size:180px 180px;
    /* 噪点也只在中部明显，四周随玻璃一起淡出 */
    -webkit-mask-image:radial-gradient(ellipse 120% 108% at 50% 48%,
      #000 0%, #000 55%, rgba(0,0,0,.5) 78%, transparent 96%);
    mask-image:radial-gradient(ellipse 120% 108% at 50% 48%,
      #000 0%, #000 55%, rgba(0,0,0,.5) 78%, transparent 96%);
    animation:noiseShift 9s steps(6) infinite;
  }
  @keyframes noiseShift{
    0%   { background-position:0 0; }
    20%  { background-position:-24px -18px; }
    40%  { background-position:18px -30px; }
    60%  { background-position:-30px 22px; }
    80%  { background-position:26px 14px; }
    100% { background-position:0 0; }
  }
  @keyframes smokeDrift{
    0%   { transform:translate3d(0, 0, 0) scale(1); }
    33%  { transform:translate3d(-0.3%, -0.35%, 0) scale(1.006); }
    66%  { transform:translate3d(0.35%, 0.2%, 0) scale(1.011); }
    100% { transform:translate3d(0.15%, -0.15%, 0) scale(1.004); }
  }
  /* 用户要求减弱动画时全部静止 */
  @media (prefers-reduced-motion: reduce){
    body::before, body::after{ animation:none; }
  }
  /* 顶栏：透的，只留一条细分隔线；悬停时轻微加深，方便抓取拖动 */
  .hd{
    flex:none; display:flex; align-items:center; gap:8px;
    padding:10px 12px; border-bottom:1px solid rgba(190,180,160,.25);
    background:transparent;
    cursor:default;
    transition:background .15s;
  }
  .hd:hover{ background:rgba(255,255,255,.55); }
  .hd .ttl{ font-weight:700; color:var(--brand); font-size:13.5px; letter-spacing:.02em;
    text-shadow:0 1px 0 rgba(255,255,255,.6);
    flex:none; white-space:nowrap; cursor:pointer; }
  .hd .sp{ flex:1 1 auto; min-width:0; }
  .hd button{
    border:1px solid rgba(190,180,160,.5); background:rgba(255,255,255,.55); color:var(--sub);
    border-radius:6px; font-size:11.5px; padding:2px 8px; cursor:pointer; font-family:inherit;
    white-space:nowrap; flex:none;
  }
  .hd button:hover{ border-color:var(--brand); color:var(--brand); background:rgba(255,255,255,.85); }
  /* 「打开工作台」：主入口，做得比其它小按钮显眼一点 */
  .hd .hdOpen{
    border-color:rgba(27,54,93,.45); background:rgba(27,54,93,.08); color:var(--brand);
    font-weight:600; letter-spacing:.01em;
    /* 固定宽度：「⤢ 工作台」和「⤡ 收起」字数不同，
       不锁宽的话切换时标题栏会左右抖一下 */
    min-width:74px; text-align:center;
  }
  .hd .hdOpen:hover{ background:var(--brand); color:#fff; border-color:var(--brand); }
  /* 开关状态：工作台开着时按钮反色、常亮，一眼看出「再点一下就会收起」 */
  .hd .hdOpen.on{
    background:var(--brand); color:#fff; border-color:var(--brand);
    box-shadow:0 0 0 2px rgba(27,54,93,.14);
  }
  .hd .hdOpen.on:hover{ background:#12253f; border-color:#12253f; }

  /* 手动拉取选择框：盖在侧边栏上，玻璃底 + 纸感按钮 */
  .pullAsk{
    position:fixed; inset:0; z-index:999; display:none;
    align-items:center; justify-content:center;
    background:rgba(20,18,14,.28); backdrop-filter:blur(3px);
  }
  .pullAsk .pa-card{
    width:260px; padding:16px 16px 12px;
    background:linear-gradient(180deg,#fffdf7,#f7f4ea);
    border:1px solid rgba(190,180,160,.6); border-radius:12px;
    box-shadow:0 12px 34px -12px rgba(27,54,93,.45), 0 1px 0 rgba(255,255,255,.8) inset;
    display:flex; flex-direction:column; gap:8px;
  }
  .pullAsk .pa-title{ font-size:13.5px; font-weight:700; color:var(--brand); }
  .pullAsk .pa-desc{ font-size:11.5px; color:var(--dim); margin-bottom:2px; }
  /* 两端差异说明：列出仅本地 / 仅云端各是哪几条 */
  .pullAsk .pa-diff{ font-size:10.5px; color:#8a6d2f; background:rgba(217,160,21,.08);
    border:1px solid #e8d9a8; border-radius:5px; padding:4px 7px; margin:3px 0 5px;
    line-height:1.55; word-break:break-all; }
  .pullAsk .pa-btn{
    padding:8px 10px; border-radius:8px; cursor:pointer; font-family:inherit;
    border:1px solid rgba(27,54,93,.35); background:rgba(27,54,93,.06);
    color:var(--brand); font-size:12px; font-weight:600;
    transition:background .15s, color .15s, border-color .15s;
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
  }
  .pullAsk .pa-btn:hover{ background:var(--brand); color:#fff; border-color:var(--brand); }
  .pullAsk .pa-btn:hover .pa-time{ opacity:.9; }
  .pullAsk .pa-btn .pa-nm{ font-size:12px; font-weight:600; }
  .pullAsk .pa-btn .pa-time{
    font-size:10.5px; font-weight:400; opacity:.75; font-variant-numeric:tabular-nums;
  }
  .pullAsk .pa-wb{
    margin-top:2px; padding:6px 8px; border-radius:6px;
    background:rgba(190,180,160,.12); border:1px dashed rgba(190,180,160,.5);
    font-size:10.5px; color:var(--dim); font-variant-numeric:tabular-nums;
  }
  .pullAsk .pa-cancel{
    margin-top:2px; padding:5px; border:0; background:transparent;
    color:var(--dim); font-size:11.5px; cursor:pointer; font-family:inherit;
  }
  .pullAsk .pa-cancel:hover{ color:var(--sub); }

  /* ================= 卡片布局 =================
     每张卡片是一个固定高度的块，内容超出时在卡片内部滚动
     （卡片自己带滚动条，能看出「还有内容」）。
     卡片之间不抢空间，整列在 .scroll 里上下滚。

     三种交互：
       · 悬停 → 右侧浮出完整预览（只读，不改变卡片本身高度）
       · 双击标题 → 在侧边栏内展开 / 再双击折叠
       · 标题右侧的 ⌄ 按钮 → 同上，点一下即知当前状态
     ============================================ */
  .scroll{ flex:1 1 0; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:8px; display:flex; flex-direction:column; gap:8px;
    scrollbar-width:thin; scrollbar-color:rgba(150,140,120,.35) transparent; }
  .scroll::-webkit-scrollbar{ width:6px; }
  .scroll::-webkit-scrollbar-thumb{ background:rgba(150,140,120,.32); border-radius:3px; }
  .scroll::-webkit-scrollbar-track{ background:transparent; }

  /* 卡片：固定高度 + 内部滚动。
     collapsed 状态下内容不显示，只留标题行。 */
  /* 卡片：**不出现滚动条**。
     折叠态只露标题；展开态把内容完整铺开（高度由内容决定）。
     内容多的细节交给悬停浮层看，卡片里保持清爽。 */
  .scroll > .card{
    flex:0 0 auto; position:relative;
    overflow:hidden;
    transition:max-height .26s cubic-bezier(.22,.61,.36,1);
  }

  /* 折叠态：只留标题行 */
  .scroll > .card.isCollapsed{
    max-height:46px; overflow:hidden;
  }
  .scroll > .card.isCollapsed > :not(h3){ display:none !important; }

  /* 展开态：内容全部铺开，不设高度上限、不出滚动条 */
  .scroll > .card.isExpanded{
    max-height:none; overflow:visible;
  }

  /* ---- 卡片两种视图 ----
     折叠态（默认）：只显示 .todoBrief —— 分数栏 + 所有待办名 + 当前步骤
     展开态（双击标题）：显示 .todoDetail —— 完整明细
     两者互斥，靠卡片上的 isExpanded 类切换。
     悬停浮层抓的始终是 .todoDetail（完整版）。 */
  /* 折叠态：连摘要也不显示，只剩标题 */
  .scroll > .card.isCollapsed .todoBrief{ display:none !important; }
  /* 摘要只在「既不折叠也不展开」时出现 */
  .scroll > .card.isCollapsed .todoDetail,
  .scroll > .card:not(.isExpanded) .todoDetail{ display:none !important; }
  .scroll > .card.isExpanded .todoBrief{ display:none !important; }

  .todoBrief{ font-size:12px; }
  .todoBrief .score{ margin-bottom:6px; }
  .todoBrief .briefList{ margin-top:8px; display:flex; flex-direction:column; gap:5px; }
  /* 精简卡的一行待办：两行排布
       第 1 行  优先级色点 + 待办名
       第 2 行  当前在做的步骤（换行，缩进对齐） */
  .briefRow{
    display:flex; flex-direction:column; gap:2px;
    padding:5px 0; line-height:1.45;
  }
  .briefLine1{
    display:flex; align-items:center; gap:7px; min-width:0;
  }
  .briefDot{
    flex:none; width:7px; height:7px; border-radius:50%;
    background:#c9b98f;
  }
  /* 优先级配色：红 > 橙 > 琥珀 > 绿 */
  .briefRow.p1 .briefDot{ background:#e05252; box-shadow:0 0 0 2px rgba(224,82,82,.16); }
  .briefRow.p2 .briefDot{ background:#e8863a; box-shadow:0 0 0 2px rgba(232,134,58,.16); }
  .briefRow.p3 .briefDot{ background:#d9a015; box-shadow:0 0 0 2px rgba(217,160,21,.16); }
  .briefRow.p4 .briefDot{ background:#4caf6e; box-shadow:0 0 0 2px rgba(76,175,110,.16); }

  .briefRow.p1 .briefName{ color:#b83a3a; }
  .briefRow.p2 .briefName{ color:#a95f21; }
  .briefRow.p3 .briefName{ color:#8a6a10; }
  .briefRow.p4 .briefName{ color:#2f7a4f; }

  .briefName{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:600;
  }
  /* 第二行：当前步骤，缩进到和待办名对齐 */
  .briefCur{
    padding-left:14px;
    color:var(--sub); font-size:11.5px; line-height:1.5;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .briefCur::before{ content:"▸ "; color:#c9b98f; }

  .briefCur.curDone{ color:#7bb37b; }
  /* 其余未完成项：列名字，带同色小点 */
  .briefRest{ margin-top:6px; }
  .briefRestHead{
    font-size:10px; color:#b9b2a3; margin-bottom:3px; padding-left:2px;
  }
  .briefRestItem{
    display:flex; align-items:center; gap:6px;
    padding:2px 0; font-size:11.5px;
  }
  .briefRestItem .briefDot.sm{ width:5px; height:5px; box-shadow:none; }
  .briefRestName{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--sub);
  }
  .briefRestItem.p1 .briefRestName{ color:#b83a3a; }
  .briefRestItem.p2 .briefRestName{ color:#a95f21; }
  .briefRestItem.p3 .briefRestName{ color:#8a6a10; }
  .briefRestItem.p4 .briefRestName{ color:#2f7a4f; }
  .briefEmpty{
    font-size:11.5px; color:#7bb37b; padding:4px 0;
  }

  /* 数据库浮层里的搜索框 */
  .dbSearchWrap{ margin-bottom:8px; }
  .dbDetail .pvDbSearch{
    width:100%; box-sizing:border-box;
    padding:5px 9px; font:11.5px/1.6 inherit; font-family:inherit;
    border:1px solid rgba(200,190,170,.8); border-radius:6px;
    background:#fffdf7; color:var(--ink); outline:none;
  }
  .dbDetail .pvDbSearch:focus{
    border-color:#d9a015; box-shadow:0 0 0 2px rgba(217,160,21,.14);
  }

  /* ---- 文档检索：折叠看摘要，展开看完整 ----
     折叠态：总文档、总字数、今天在编辑的几篇
     展开态：完整明细 */
  .scroll > .card:not(.isExpanded) .docDetail{ display:none !important; }

  .docToday{ margin-top:8px; }
  .docTopHead{
    font-size:10.5px; color:#b9b2a3; margin-bottom:3px;
  }
  .docTopRow{
    display:flex; align-items:baseline; gap:8px;
    font-size:12px; padding:4px 0;
    border-top:1px dashed rgba(226,214,186,.7);
  }
  .docTopNm{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--ink); font-weight:600;
  }
  .docTopWc{
    flex:none; color:#1B365D; font-weight:700; font-size:11.5px;
  }
  .docEmpty{ font-size:11.5px; color:#b9b2a3; font-style:italic; }

  /* 详情卡：文档名加粗、编辑时间、字数右对齐 */
  .docList{ display:flex; flex-direction:column; }
  .docItem{
    display:flex; align-items:baseline; gap:8px;
    padding:5px 0; border-bottom:1px dashed rgba(226,214,186,.55);
    font-size:11.5px;
  }
  .docItem:last-child{ border-bottom:none; }
  .docItemNm{
    flex:1 1 0; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-weight:700; color:var(--ink);
  }
  .docItemTime{
    flex:none; font-size:10.5px; color:#b9b2a3;
    font-variant-numeric:tabular-nums;
  }
  .docItemWc{
    flex:none; min-width:56px; text-align:right;
    color:#1B365D; font-weight:700;
    font-variant-numeric:tabular-nums;
  }

  .docDetailHead{
    font-size:11px; color:var(--sub); margin:2px 0 6px;
    padding-bottom:5px; border-bottom:1px dashed rgba(226,214,186,.7);
  }

  /* 数据库：折叠看总量+标签，展开看完整 */
  .scroll > .card:not(.isExpanded) .dbDetail{ display:none !important; }
  .scroll > .card.isCollapsed .dbBrief{ display:none !important; }
  .dbTagChips{ margin-top:8px; }
  /* 数据库标签：彩色。
     --tc 是每个笔记本自己的颜色（见 NB_COLORS），
     色点用实色、边框和底用同色低透明度，文字略深。 */
  .dbTagChips .chip.dbTag{
    display:inline-flex; align-items:center; gap:5px;
    font-size:10.5px; padding:2px 8px 2px 6px;
    border:1px solid var(--tc, #c9b98f);
    background:color-mix(in srgb, var(--tc, #c9b98f) 11%, transparent);
    color:var(--tc, #6b6558);
    border-radius:20px;
  }
  .dbTagChips .chip.dbTag b.dbTagDot{
    flex:none; width:6px; height:6px; border-radius:50%;
    background:var(--tc, #c9b98f);
  }
  .dbTagChips .chip.dbTag i{
    color:var(--tc, #8a8478); opacity:.78; font-style:normal;
  }

  /* 今日执行力：精简卡只留数字（完成率 / 步骤分 / 效率 / 用时），
     整块提示列表（.wkTodayTips）都收进展开态和悬停浮层。 */
  .scroll > .card:not(.isExpanded) .wkTodayTips{ display:none !important; }

  /* ---- 标题行：常驻，右侧带折叠按钮 ---- */
  .scroll > .card > h3{
    position:sticky; top:0; z-index:2;
    background:rgba(255,251,238,.97);
    cursor:pointer;
    user-select:none;
    /* 占满卡片宽度，滚动时标题条不会只覆盖一部分 */
    margin-left:-12px; margin-right:-12px;
    padding-left:12px; padding-right:12px;
    padding-top:2px; padding-bottom:2px;
  }
  .scroll > .card.isCollapsed > h3{ margin-bottom:0; }

  /* 折叠/展开按钮：一个小胶囊，箭头 + 状态文字，一眼看出当前是什么状态。
     折叠时箭头朝右并写「展开」，展开时箭头朝下并高亮写「收起」。 */
  .cardToggle{
    flex:none; margin-left:6px;
    display:inline-flex; align-items:center; gap:3px;
    height:20px; padding:0 7px;
    border:1px solid rgba(180,170,150,.45); border-radius:10px;
    background:rgba(255,255,255,.42); color:#8a8478;
    font-family:inherit; font-size:10.5px; line-height:1; cursor:pointer;
    white-space:nowrap;
    transition:background .2s, border-color .2s, color .2s, box-shadow .2s;
  }
  .cardToggle .ctArrow{
    display:inline-block; font-size:9px; line-height:1;
    transition:transform .24s cubic-bezier(.22,.61,.36,1);
    transform:rotate(-90deg);                       /* 折叠态：箭头朝右 */
  }
  .cardToggle:hover{
    background:#fffdf7; border-color:rgba(180,170,150,.8); color:#4a453d;
    box-shadow:0 1px 3px rgba(120,110,90,.12);
  }
  .cardToggle.open{
    background:rgba(217,160,21,.16);
    border-color:rgba(217,160,21,.5);
    color:#8a6a10;
  }
  .cardToggle.open .ctArrow{ transform:rotate(0deg); }  /* 展开态：箭头朝下 */
  .cardToggle:active{ filter:brightness(.96); }

  .scroll > .card[hidden]{ display:none !important; }

  /* ================= 悬浮预览 =================
     直接在侧边栏内部弹出，**不改窗口尺寸**。
     浮层铺在卡片上方，会盖住旁边的卡片 —— 移开鼠标就消失。
     预览是**只读副本**，不响应点击，也不改变卡片本身高度。 */
  #cardPreview{
    position:fixed; z-index:9000;
    overflow-y:auto;
    padding:12px 14px;
    background:rgba(255,251,238,.99);
    border:1px solid rgba(226,214,186,.85);
    border-radius:12px;
    box-shadow:0 4px 10px rgba(120,110,90,.14),
               0 16px 44px rgba(120,110,90,.26),
               inset 0 1px 0 rgba(255,255,255,.95);
    color:var(--ink, #2b2a26); font-size:12px; line-height:1.65;
    opacity:0; pointer-events:none;
    transform:translateY(4px);
    transition:opacity .18s ease, transform .18s cubic-bezier(.22,.61,.36,1);
    scrollbar-width:thin; scrollbar-color:rgba(150,140,120,.35) transparent;
  }
  #cardPreview.on{ opacity:1; transform:translateY(0); }
  #cardPreview::-webkit-scrollbar{ width:6px; }
  #cardPreview::-webkit-scrollbar-thumb{ background:rgba(150,140,120,.32); border-radius:3px; }
  #cardPreview .pvTitle{
    font-size:12.5px; font-weight:700; color:var(--brand, #1B365D);
    margin:0 0 8px; padding-bottom:6px;
    border-bottom:1px solid rgba(226,214,186,.7);
    display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;
  }
  #cardPreview .pvTitle .pvHint{
    margin-left:auto; font-size:10px; font-weight:400; color:#b9b2a3;
  }
  #cardPreview .pvBody > *:first-child{ margin-top:0 !important; }
  #cardPreview .pvBody > *:last-child{ margin-bottom:0 !important; }


  /* 滚动内容不做任何遮罩：mask 会把文字一起淡掉。
     真正需要柔化的只有窗口边缘的玻璃层，那是 body::before 的事。 */

  /* 剪藏助手 iframe：透明底，跟着整块玻璃走 */
  .clipFrame{
    width:100%; height:420px; border:1px solid rgba(221,213,196,.5);
    border-radius:8px; background:transparent; display:block;
    color-scheme:normal;
  }

  /* 卡片：默认**完全透明**，让底下的不规则玻璃层完整透出来。
     之前给 .30 的白底会把边缘渐变盖住，看起来就是"玻璃没有雾化、
     只是一块白" —— 这是雾化没生效的最主要原因。
     鼠标移上去时才变成接近不透明。 */
  .card{
    background:transparent;
    border:1px solid rgba(226,214,186,.18);
    border-radius:12px; padding:10px 12px;
    transition:background .45s cubic-bezier(.22,.61,.36,1),
               border-color .45s cubic-bezier(.22,.61,.36,1),
               box-shadow .45s cubic-bezier(.22,.61,.36,1);
  }
  .card:hover{
    background:rgba(255,251,238,.97);
    border-color:rgba(226,214,186,.55);
    box-shadow:0 2px 6px rgba(120,110,90,.08),
               0 10px 32px rgba(120,110,90,.13),
               0 22px 60px rgba(120,110,90,.07),
               inset 0 1px 0 rgba(255,255,255,.9);
  }
  /* 悬停时卡片里的小控件也用不透明底，避免透出别的东西显得脏 */
  .card:hover .pomoBtn,
  .card:hover .pomoNoteIn,
  .card:hover .pomoCur,
  .card:hover .hdBtn,
  .card:hover .addTask,
  .card:hover .miniAct,
  .card:hover .planAdd,
  .card:hover .planCancel{ background:#fffdf7; }
  .card > h3{
    margin:0 0 8px; font-size:12px; color:var(--brand); font-weight:700;
    display:flex; align-items:baseline; gap:6px;
  }
  .card > h3 .mini{ font-size:10.5px; color:#4a453d; font-weight:400; margin-left:auto; }

  /* 评分 */
  .score{ display:flex; align-items:baseline; gap:6px; margin-bottom:6px; }
  .score b{ font-size:26px; color:var(--brand); font-family:Georgia,serif; line-height:1; }
  .score .u{ font-size:11px; color:var(--sub); }
  .score .g{ font-size:11px; font-weight:700; color:#fff; background:var(--brand); border-radius:5px; padding:0 7px; }
  .score .g[data-g="A"]{ background:#2f7a4f; }
  .score .g[data-g="C"]{ background:#b5762a; }
  .score .g[data-g="D"]{ background:#8b4513; }
  .score .g[data-g="S"]{ background:#8a6d2f; }
  .bar{ height:4px; background:rgba(239,232,216,.6); border-radius:3px; overflow:hidden; margin-bottom:6px; }
  .bar i{ display:block; height:100%; background:linear-gradient(90deg,#1B365D,#4f8ef7); }
  .meta{ font-size:11px; color:var(--sub); display:flex; flex-wrap:wrap; gap:2px 10px; }
  .meta b{ color:var(--brand); }

  /* 任务 */
  .task{ border-top:1px dashed #e6e0d1; padding:7px 0 5px; }
  .task:first-of-type{ border-top:0; padding-top:2px; }
  .task .row1{ display:flex; align-items:baseline; gap:6px; }
  .task .nm{ flex:1 1 auto; min-width:0; font-size:12.5px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .task .q{ flex:none; font-size:10px; color:#8a6d2f; background:rgba(247,239,216,.55);
    border:1px solid #e6d9b4; border-radius:7px; padding:0 5px; }
  .subs{ margin:4px 0 0; padding:0; list-style:none; }
  .subs li{ font-size:11.5px; color:var(--sub); display:flex; gap:6px; padding:1px 0; }
  .subs li.done{ color:#a9a397; text-decoration:line-through; }
  .subs .bx{ flex:none; width:11px; height:11px; border:1px solid #c9c1ae; border-radius:3px; margin-top:4px; }
  .subs li.done .bx{ background:#2f7a4f; border-color:#2f7a4f; }
  .subs li{ cursor:pointer; border-radius:4px; }
  .subTxt{ flex:1 1 auto; min-width:0; }
  /* 步骤级番茄：累计徽标 + 悬停出现的记时按钮 */
  .pomoBadge{ flex:none; font-size:9.5px; color:#8a6d2f; background:rgba(247,239,216,.55);
    border:1px solid #e6d9b4; border-radius:7px; padding:0 4px; white-space:nowrap; }
  .stepPomo{ flex:none; border:0; background:transparent; color:#c9a227; cursor:pointer;
    font-size:10px; padding:0 2px; opacity:0; transition:opacity .12s; font-family:inherit; }
  .subs li:hover .stepPomo{ opacity:1; }
  .stepPomo:hover{ color:#d9822b; }
  /* 步骤行右侧的 ＋ 插入 / ✕ 删除：平时很淡，悬停才明显，别抢注意力 */
  .stepIns, .stepDel{ flex:none; border:0; background:transparent; cursor:pointer;
    font-size:10px; line-height:1; padding:0 2px; opacity:.18; transition:opacity .12s; }
  .subs li:hover .stepIns, .subs li:hover .stepDel{ opacity:1; }
  .stepIns{ color:#7a9a6a; }
  .stepIns:hover{ color:#2f7a4f; }
  .stepDel{ color:#b0897a; }
  .stepDel:hover{ color:#c0392b; }
  /* 步骤进度徽标：0% 时只显示一个很淡的「%」，有进度才染色 */
  .stepPct{ flex:none; border:1px solid transparent; border-radius:4px; cursor:pointer;
    font:600 9.5px/1.5 inherit; font-family:inherit; padding:0 4px; min-width:22px; text-align:center; }
  .stepPct.none{ color:#a8a397; background:transparent; opacity:.28; font-weight:400; }
  .subs li:hover .stepPct.none{ opacity:.9; }
  .stepPct.low{ color:#8a6d2f; background:#fff3d8; border-color:#ecd9a4; }
  .stepPct.mid{ color:#1B365D; background:#eaf0f8; border-color:#c3d2e6; }
  .stepPct.high{ color:#2f7a4f; background:#eaf5ee; border-color:#bfdccb; }
  .stepPct.full{ color:#2f7a4f; background:#dff0e7; border-color:#a8d0b8; }
  /* 进度调节条 */
  li.stepPctBox{ display:flex; align-items:center; gap:6px; margin:2px 0 4px 14px;
    padding:4px 7px; border:1px solid #d8d0bd; background:#fffbe9; border-radius:5px; }
  .stepPctLbl{ flex:none; font-size:10px; color:#7a6f5c; }
  .stepPctRange{ flex:1 1 auto; min-width:0; height:3px; accent-color:#d9822b; cursor:pointer; }
  .stepPctVal{ flex:none; min-width:32px; text-align:right; font:600 10.5px/1.5 inherit;
    font-family:inherit; color:#8a6d2f; }
  .stepPctOk{ flex:none; padding:1px 9px; border:1px solid #d9a015; background:#fbeec4;
    color:#8a6d2f; border-radius:4px; font:10.5px/1.6 inherit; font-family:inherit;
    font-weight:600; cursor:pointer; }
  .stepPctOk:hover{ background:#f6e2a8; }
  .stepPctCancel{ flex:none; padding:1px 6px; border:1px solid #d8d2c4; background:#fffdf7;
    color:#8a8579; border-radius:4px; font:10.5px/1.6 inherit; font-family:inherit; cursor:pointer; }
  /* 插入新步骤的输入行 */
  li.stepInsBox{ display:flex; align-items:center; gap:4px; margin:2px 0 4px 14px;
    padding:3px 5px; border:1px solid #d8d0bd; background:#fffefb; border-radius:5px; }
  .stepInsIn{ flex:1 1 auto; min-width:0; border:1px solid #e0dacb; border-radius:4px;
    padding:1px 5px; font:11px/1.6 inherit; font-family:inherit; background:#fff; color:var(--ink); }
  .stepInsIn:focus{ outline:none; border-color:var(--brand); }
  .stepInsOk{ flex:none; padding:1px 9px; border:1px solid var(--brand); background:#EEF2F7;
    color:var(--brand); border-radius:4px; font:10.5px/1.6 inherit; font-family:inherit; cursor:pointer; }
  .stepInsOk:hover{ background:#dde6f2; }
  .stepInsCancel{ flex:none; padding:1px 6px; border:1px solid #d8d2c4; background:#fffdf7;
    color:#8a8579; border-radius:4px; font:10.5px/1.6 inherit; font-family:inherit; cursor:pointer; }
  /* 点 🍅 后的「设时长」预备框：跟在步骤行下面 */
  li.stepPrep{ display:flex; align-items:center; gap:5px; margin:3px 0 4px 14px;
    padding:4px 6px; border:1px solid #e8d9a8; background:#fffbe9; border-radius:5px; }
  .stepPrepMin{ width:46px; box-sizing:border-box; padding:1px 4px; border:1px solid #d8caa0;
    border-radius:4px; font:11px/1.6 inherit; font-family:inherit; color:var(--ink); background:#fff; }
  .stepPrepMin:focus{ outline:none; border-color:#d9822b; }
  .stepPrepUnit{ font-size:10px; color:#7a6f5c; }
  /* 「这一步在做什么」输入框：占满中间，和主窗口的说明框一致 */
  .stepPrepNote{ flex:1 1 auto; min-width:0; box-sizing:border-box; padding:1px 5px;
    border:1px solid #e2d5b0; border-radius:4px; font:11px/1.6 inherit; font-family:inherit;
    background:#fffefb; color:var(--ink); }
  .stepPrepNote:focus{ outline:none; border-color:#d9822b; }
  .stepPrepGo{ flex:none; padding:1px 10px; border:1px solid #d9a015; background:#fbeec4;
    color:#8a6d2f; border-radius:4px; font:11px/1.6 inherit; font-family:inherit;
    font-weight:600; cursor:pointer; }
  .stepPrepGo:hover{ background:#f6e2a8; }
  .stepPrepCancel{ flex:none; padding:1px 6px; border:1px solid #d8d2c4; background:#fffdf7;
    color:#8a8579; border-radius:4px; font:11px/1.6 inherit; font-family:inherit; cursor:pointer; }
  .stepPrepCancel:hover{ background:#f4f2ec; }

  /* 这一步的番茄记录，缩进挂在步骤下面（不是任务底部） */
  .subs li.stepLogs{ display:block; padding:0 0 3px 17px; cursor:default; }
  .subs li.stepLogs:hover{ background:transparent; }
  .stepLogs .logLine{ margin:2px 0; }
  /* 手动指定面板 */
  .planBox{ font-size:11.5px; }
  .planTitle{ font-weight:700; color:var(--ink); margin-bottom:6px; }
  .planSub{ font-weight:400; color:#4a453d; font-size:10px; margin-left:6px; }
  .planRow{ display:flex; align-items:center; gap:3px; margin-bottom:4px; }
  .planIdx{ flex:none; width:14px; color:#4a453d; font-size:10px; text-align:right; }
  .planName{ flex:1 1 auto; min-width:0; padding:1px 5px; border:1px solid var(--line);
    border-radius:5px; background:rgba(255,255,255,.22); font:11.5px/1.6 inherit; font-family:inherit; }
  .planPj{ flex:none; width:76px; padding:0 2px; border:1px solid var(--line); border-radius:5px;
    background:rgba(255,255,255,.22); font:10px/1.6 inherit; font-family:inherit; color:var(--sub); }
  .planMin{ flex:none; width:42px; padding:0 3px; border:1px solid var(--line); border-radius:5px;
    background:rgba(255,255,255,.22); font:11px/1.6 inherit; text-align:center; }
  .planUp, .planDn, .planDel{ flex:none; width:16px; border:0; background:transparent;
    color:#4a453d; cursor:pointer; font-size:10px; padding:0; font-family:inherit; }
  .planUp:hover, .planDn:hover{ color:var(--brand); }
  .planDel:hover{ color:#c0392b; }
  .planActions{ display:flex; gap:6px; margin-top:8px; }
  .planAdd{ flex:1 1 auto; border:1px dashed #d8d0bd; background:rgba(255,255,255,.22); color:var(--brand);
    border-radius:6px; font-size:11px; padding:3px 0; cursor:pointer; font-family:inherit; }
  .planApply{ flex:none; border:1px solid var(--brand); background:var(--brand); color:#fff;
    border-radius:6px; font-size:11px; padding:3px 12px; cursor:pointer; font-family:inherit; }
  .planCancel{ flex:none; border:1px solid var(--line); background:rgba(255,255,255,.22); color:var(--sub);
    border-radius:6px; font-size:11px; padding:3px 10px; cursor:pointer; font-family:inherit; }
  /* 项目下拉 / 删除 / 新增 */
  .pjSel{ flex:none; max-width:96px; padding:0 2px; border:1px solid var(--line); border-radius:5px;
    background:rgba(255,255,255,.22); color:var(--sub); font:10.5px/1.6 inherit; font-family:inherit; }
  .delTask{ flex:none; border:0; background:transparent; color:#c9c1ae; cursor:pointer;
    font-size:11px; padding:0 3px; font-family:inherit; }
  .delTask:hover{ color:#c0392b; }
  .addRow{ margin:6px 0 2px; }
  .addTask{ width:100%; border:1px dashed #d8d0bd; background:rgba(255,255,255,.22); color:var(--brand);
    border-radius:6px; font-size:11.5px; padding:3px 0; cursor:pointer; font-family:inherit; }
  .addTask:hover{ background:#EEF2F7; border-color:var(--brand); }
  .subEdit{ flex:none; border:0; background:transparent; color:#c9c1ae; cursor:pointer;
    font-size:10px; padding:0 3px; opacity:0; font-family:inherit; }
  .subs li:hover .subEdit{ opacity:1; }
  .subEdit:hover{ color:var(--brand); }
  .nm.edt{ cursor:text; }
  .nm.edt:hover{ border-bottom:1px dashed #c9c1ae; }
  .subs li:hover{ background:#f7f4ea; }

  /* 番茄记录 / 备注 / 操作行 */
  .task.tdone .nm{ color:#4a453d; }

  /* 项目分组标题 */
  .projHead{ display:flex; align-items:center; gap:6px; margin:10px 0 4px; padding-bottom:3px;
    border-bottom:1px solid #ece5d4; }
  .projHead:first-of-type{ margin-top:2px; }
  .pdot{ flex:none; width:7px; height:7px; border-radius:50%; }
  .pname{ flex:1 1 auto; min-width:0; font-size:11.5px; font-weight:700; letter-spacing:.02em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pcnt{ flex:none; font-size:10px; color:#4a453d; }

  /* 重要待办：左侧色条按象限来（与主界面同色） */
  .task.q-iu{ border-left:3px solid #e05252; padding-left:7px; margin-left:-2px; }
  .task.q-in{ border-left:3px solid #d9a015; padding-left:7px; margin-left:-2px; }
  .task.q-uu{ border-left:3px solid #e8863a; padding-left:7px; margin-left:-2px; }
  .task.q-un{ border-left:3px solid #4caf6e; padding-left:7px; margin-left:-2px; }
  .task.q-iu .nm, .task.q-in .nm{ color:#a93226; }
  .starBtn{ flex:none; font-size:11px; color:#cfc8b8; cursor:pointer; line-height:1.2; user-select:none; }
  .starBtn:hover{ color:#e0a800; }
  .starBtn.on{ color:#e05252; }
  .logLine{ font-size:10.5px; color:#7a5c2e; background:rgba(247,239,216,.45); border-left:2px solid #e0c98a;
    padding:2px 6px; margin:4px 0 0; border-radius:0 4px 4px 0; overflow-wrap:anywhere; line-height:1.5; }
  .noteLine{ font-size:10.5px; color:#8b4513; background:rgba(253,246,239,.45); border-left:2px solid #e3b98c;
    padding:2px 6px; margin:4px 0 0; border-radius:0 4px 4px 0; overflow-wrap:anywhere; line-height:1.5; }
  .card:hover .logLine{ background:#fbf7ec; }
  .card:hover .noteLine{ background:#fdf6ef; }
  .logLine, .noteLine{ cursor:default; display:flex; align-items:flex-start; gap:4px; }
  .edt{ flex:1 1 auto; min-width:0; cursor:text; border-bottom:1px dashed transparent; }
  .edt:hover{ border-bottom-color:#c9c1ae; }
  .edt[contenteditable="true"]{ outline:1px solid var(--brand); background:#fff; border-radius:3px; padding:0 2px; }
  .delBtn{ flex:none; border:0; background:transparent; color:#6b6458; cursor:pointer;
    font-size:10px; line-height:1.2; padding:0 2px; font-family:inherit; }
  .delBtn:hover{ color:#c0392b; }
  .actRow{ display:flex; gap:4px; align-items:center; margin:5px 0 2px; }
  .actRow .mi{ width:46px; flex:none; padding:1px 4px; border:1px solid var(--line); border-radius:5px;
    background:rgba(255,255,255,.22); font:11px/1.5 inherit; color:var(--ink); text-align:center; }
  .actRow .mt{ flex:1 1 auto; min-width:0; padding:1px 6px; border:1px solid var(--line); border-radius:5px;
    background:rgba(255,255,255,.22); font:11px/1.5 inherit; color:var(--ink); }
  .actRow .mi:focus, .actRow .mt:focus{ outline:none; border-color:var(--brand); }
  .miniAct{ flex:none; border:1px solid var(--line2); background:rgba(255,255,255,.22); border-radius:5px;
    font-size:11px; padding:0 5px; cursor:pointer; font-family:inherit; line-height:1.7; }
  .miniAct:hover{ background:#EEF2F7; }

  /* 数据库列表 */
  .dbItem{ border-top:1px dashed #e6e0d1; padding:4px 0; }
  .dbItem:first-of-type{ border-top:0; }
  .dbHead{ display:flex; align-items:baseline; gap:6px; cursor:pointer; padding:2px 0; }
  .dbToggle{ flex:none; color:#4a453d; font-size:10px; width:12px; }
  .dbName{ flex:1 1 auto; min-width:0; font-size:12px; font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dbCnt{ flex:none; font-size:10px; color:#4a453d; }
  .dbRows{ margin:2px 0 4px 12px; }
  .dbRow{ font-size:11px; padding:3px 0; border-bottom:1px dotted #efe9da; line-height:1.5;
    overflow-wrap:anywhere; word-break:break-word; }
  .dbRow .c1{ font-weight:600; color:var(--ink); }
  .dbRow .c2{ display:block; color:var(--sub); font-size:10.5px; margin-top:1px; }
  /* ---------- 番茄钟（圆形计时） ---------- */
  .pomoWrap{ display:flex; gap:10px; align-items:center; }
  .pomoRing{ position:relative; flex:none; width:104px; height:104px; }
  .pomoSvg{ width:100%; height:100%; transform:rotate(-90deg); }
  .pomoBg{ fill:none; stroke:#efe9da; stroke-width:7; }
  .pomoFg{ fill:none; stroke:#d9822b; stroke-width:7; stroke-linecap:round;
    stroke-dasharray:326.7; stroke-dashoffset:0; transition:stroke-dashoffset .4s linear, stroke .3s; }
  .pomoRing.run .pomoFg{ stroke:#b8860b; }
  .pomoRing.paused .pomoFg{ stroke:#9a948a; }
  .pomoRing.done .pomoFg{ stroke:#2f7a4f; }
  .pomoFace{ position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1px; pointer-events:none; }
  .pomoTime{ font:600 20px/1 ui-monospace,Consolas,monospace; color:var(--ink); letter-spacing:.5px; }
  .pomoState{ font-size:9.5px; color:#4a453d; }
  .pomoSide{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:5px; }
  .pomoNoteIn{ width:100%; box-sizing:border-box; padding:2px 6px; border:1px solid var(--line);
    border-radius:5px; background:rgba(255,255,255,.22); font:11.5px/1.6 inherit; font-family:inherit; color:var(--ink); }
  .pomoNoteIn:focus{ outline:none; border-color:#d9822b; }
  .pomoBtns{ display:flex; gap:5px; }
  .pomoBtn{ flex:1 1 0; border:1px solid var(--line2); background:rgba(255,255,255,.22); color:var(--sub);
    border-radius:6px; font-size:11px; padding:3px 0; cursor:pointer; font-family:inherit; }
  .pomoBtn:hover{ background:#EEF2F7; }
  .pomoGo{ border-color:#d9a015; color:#8a6d2f; background:rgba(255,246,220,.55); font-weight:600; }
  .pomoGo:hover{ background:#fbeec4; }
  .pomoBtn:disabled{ opacity:.45; cursor:default; }
  .pomoPickWrap{ min-width:0; }
  /* 当前瞄准的步骤（取代原来的下拉框）。
     内容一行，超长省略；悬停看完整任务名+步骤名。 */
  .pomoCur{ width:100%; box-sizing:border-box; padding:5px 8px; border:1px solid var(--line);
    border-radius:5px; background:rgba(255,255,255,.22);
    font:11px/1.4 inherit; font-family:inherit; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pomoCur.noneState{ color:var(--sub); font-style:italic; }
  .pomoCur.locked{ background:rgba(217,160,21,.16); border-color:rgba(217,160,21,.45); color:#8a6a10; }
  /* 每日完成情况 */
  .capBlock{ margin-top:10px; border-top:1px dashed #e6e0d1; padding-top:8px; }
  .capHead{ font-size:11px; font-weight:700; color:var(--ink); margin-bottom:4px; }
  .capHead span{ font-weight:400; color:#4a453d; font-size:10px; margin-left:4px; }

  /* 段位 */
  .capRank{ display:flex; align-items:center; gap:7px; margin-bottom:5px; }
  .capRankIcon{ flex:none; width:24px; height:24px; border-radius:50%; display:flex;
    align-items:center; justify-content:center; font-size:13px;
    border:1.5px solid currentColor; background:rgba(255,255,255,.35); }
  .capRankBody{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .capRankBody b{ font-size:12px; line-height:1.2; }
  .capRankBody i{ font-style:normal; font-size:9.5px; color:#4a453d; }
  .capRankBar{ height:4px; background:#efe9da; border-radius:3px; overflow:hidden; margin-bottom:7px; }
  .capRankBar i{ display:block; height:100%; border-radius:3px; }

  /* 七天明细：小方格 */
  .capDays{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .capDay{ display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:4px 1px 3px; border-radius:5px; background:rgba(255,255,255,.28);
    border:1px solid #ece5d4; }
  .capDay.mute{ opacity:.42; }
  .capDay.today{ border-color:var(--brand); background:rgba(27,54,93,.07); }
  .capDayDow{ font-size:9px; color:var(--sub); }
  .capDayEff{ font-size:11.5px; font-weight:700; color:var(--brand); line-height:1.15; }
  .capDay.mute .capDayEff{ color:#b9b3a6; font-weight:400; }
  .capDayPct{ font-size:8.5px; color:#8a7a54; }

  .capRow{ display:flex; align-items:center; gap:6px; font-size:10.5px; padding:1px 0; }
  .capDate{ flex:none; width:34px; color:var(--sub); }
  .capBar{ flex:1 1 auto; height:5px; background:#efe9da; border-radius:3px; overflow:hidden; }
  .capBar i{ display:block; height:100%; }
  .capBar i.g{ background:#4caf6e; }
  .capBar i.m{ background:#d9a015; }
  .capBar i.b{ background:#e05252; }
  .capNum{ flex:none; width:32px; text-align:right; color:var(--sub); }
  .capMin{ flex:none; width:42px; text-align:right; color:#4a453d; }
  .capFoot{ font-size:10px; color:#4a453d; margin-top:6px; line-height:1.5; }
  .capFoot b{ color:var(--brand); }
  .capEmpty{ font-size:10.5px; color:#4a453d; }
  .empty2{ font-size:11px; color:#4a453d; padding:2px 0; }

  /* 卡片标题里的按钮、搜索框 */
  .hdBtn{ margin-left:4px; border:1px solid var(--line2); background:rgba(255,255,255,.22); color:var(--brand);
    white-space:nowrap; padding:1px 6px;
    border-radius:6px; font-size:10.5px; padding:1px 8px; cursor:pointer; font-family:inherit; font-weight:600; }
  .hdBtn:hover{ background:#EEF2F7; }
  .hdBtn:disabled{ opacity:.55; cursor:default; }
  .hint{ font-size:10.5px; color:#8b4513; margin-top:5px; min-height:0; }
  /* 删除步骤后的「撤销」浮条：贴在底部，6 秒后自己消失。
     独立于 #todoHint —— 那个每次都被 textContent 重写，挂按钮会被清掉。 */
  #undoStepBar{ position:fixed; left:10px; right:10px; bottom:44px; z-index:9999;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:6px 10px; border-radius:8px; background:#fffbe9; border:1px solid #e8d9a8;
    color:#8a6d2f; font:10.5px/1.5 inherit; font-family:inherit;
    box-shadow:0 3px 12px rgba(90,70,20,.16); word-break:break-all; }
  #undoStepBar button{ flex:none; border:1px solid #d9a015; background:#fbeec4; color:#8a6d2f;
    border-radius:5px; padding:1px 9px; font:10.5px/1.7 inherit; font-family:inherit;
    font-weight:600; cursor:pointer; }
  #undoStepBar button:hover{ background:#f6e2a8; }
  .searchBox{ width:100%; box-sizing:border-box; margin-bottom:8px; padding:4px 8px;
    border:1px solid var(--line); border-radius:7px; background:rgba(255,255,255,.22); color:var(--ink);
    font:11.5px/1.5 inherit; font-family:inherit; outline:none; }
  .searchBox:focus{ border-color:var(--brand); }

  /* 笔记本分组 */
  .nbGroup{ margin-bottom:6px; }
  .nbHead{ display:flex; align-items:center; gap:6px; cursor:pointer; padding:4px 6px;
    border-radius:6px; background:transparent; transition:background .15s; }
  .nbHead:hover{ background:rgba(240,234,217,.75); }
  .card:hover .nbHead{ background:#f7f4ea; }
  .card:hover .nbHead:hover{ background:#f0ead9; }
  .nbDot{ flex:none; width:7px; height:7px; border-radius:50%; }
  .nbName{ flex:1 1 auto; min-width:0; font-size:12px; font-weight:700; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nbCnt{ flex:none; font-size:10px; color:#4a453d; }
  .nbBody{ margin:3px 0 4px 10px; border-left:2px solid #ece5d4; padding-left:8px; }
  .dbBrief{ font-size:10px; color:#4a453d; margin:0 0 2px 18px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* 周报 */
  .wkLine{ font-size:12px; color:var(--ink); margin:0 0 6px; line-height:1.65; }
  .wkStats{ display:flex; gap:14px; font-size:11px; color:var(--sub); margin-bottom:6px; }
  .wkStats b{ color:var(--brand); font-size:13px; }
  .wkSec{ font-size:11.5px; color:var(--sub); padding:1px 0; }
  .wkSec b{ color:var(--ink); font-weight:600; }
  /* 当天的 AI 总结：比周报小节更靠前、更有分量 */
  .wkToday{ font-size:11.5px; line-height:1.65; color:var(--ink); padding:5px 8px;
    border-left:2px solid var(--brand); background:rgba(255,255,255,.32);
    border-radius:0 5px 5px 0; margin-bottom:7px; }
  .wkTodayK{ display:inline-block; font-size:9.5px; font-weight:700; color:#fff;
    background:var(--brand); border-radius:3px; padding:0 5px; margin-right:6px;
    vertical-align:1px; }

  /* 今日完成情况：四个数字 */
  .wkTodayStat{ display:grid; grid-template-columns:repeat(4,1fr); gap:4px; margin:2px 0 5px; }
  .wkTodayStat span{ display:flex; flex-direction:column; align-items:center; gap:0;
    padding:5px 2px; border-radius:6px; background:rgba(255,255,255,.28);
    border:1px solid #ece5d4; line-height:1.25; }
  .wkTodayStat b{ font-size:15px; color:var(--brand); font-weight:700; white-space:nowrap; line-height:1.15; }
  .wkTodayStat b.nw{ display:block; }
  /* 分数可能长（0/110），字号压小一点，保证一格放得下不换行 */
  .wkTodayStat b.sm{ font-size:11.5px; padding-top:2px; }
  .wkTodayStat i{ font-style:normal; font-size:8.5px; color:var(--sub); margin-top:1px; white-space:nowrap; }
  .wkTodayBar{ height:4px; background:#efe9da; border-radius:3px; overflow:hidden; margin-bottom:4px; }
  .wkTodayBar i{ display:block; height:100%; border-radius:3px; transition:width .25s; }
  .wkTodaySub{ font-size:9.5px; color:#4a453d; }
  .wkTodayTips{ list-style:none; margin:7px 0 0; padding:0; }
  /* 每条 = 一行「关键结论」大字 + 一行「措施」小字。
     颜色按语义：坏=红、好=绿、持平=不变色。
     深浅按严重程度（lv1 浅 → lv3 深）：微降是浅红，大降是深红。 */
  .wkTodayTips li{ display:flex; flex-direction:column; gap:1px;
    padding:5px 0 5px 10px; border-left:2px solid #e0d8c6; margin-bottom:3px; }
  .wkTodayTips li:last-child{ margin-bottom:0; }
  .wkTipK{ font-size:11.5px; font-weight:700; color:var(--ink); line-height:1.35; }
  /* 结论里的数字：放大一号，颜色跟条目一致 */
  .wkTipK b.n{ font-size:14px; font-weight:800; color:var(--brand); padding:0 1px; }
  .wkTipD{ font-size:10px; color:#7d776b; line-height:1.5; }

  /* —— 坏（慢 / 降 / 低）：红，三档深浅 —— */
  .wkTodayTips li.bad.lv1{ border-left-color:#e8c4bd; }
  .wkTodayTips li.bad.lv1 .wkTipK{ color:#c06a5c; }
  .wkTodayTips li.bad.lv2{ border-left-color:#d98a7a; }
  .wkTodayTips li.bad.lv2 .wkTipK{ color:#b3453a; }
  .wkTodayTips li.bad.lv3{ border-left-color:#a93226; background:rgba(192,57,43,.045); }
  .wkTodayTips li.bad.lv3 .wkTipK{ color:#95261a; }
  .wkTodayTips li.bad .wkTipK b.n{ color:inherit; }

  /* —— 好（快 / 升 / 高）：绿，三档深浅 —— */
  .wkTodayTips li.good.lv1{ border-left-color:#bcdcc3; }
  .wkTodayTips li.good.lv1 .wkTipK{ color:#4f9169; }
  .wkTodayTips li.good.lv2{ border-left-color:#78b78c; }
  .wkTodayTips li.good.lv2 .wkTipK{ color:#2f7a4f; }
  .wkTodayTips li.good.lv3{ border-left-color:#2f7a4f; background:rgba(47,122,79,.045); }
  .wkTodayTips li.good.lv3 .wkTipK{ color:#1f5c39; }
  .wkTodayTips li.good .wkTipK b.n{ color:inherit; }

  /* —— 持平：不变色 —— */
  .wkTodayTips li.flat .wkTipK{ color:var(--ink); }

  /* 数字格子 / 标签 / 列表（知识图谱、数据库汇总） */
  .grid4, .grid2{ display:grid; gap:6px; margin-bottom:8px; }
  .grid4{ grid-template-columns:repeat(4,1fr); }
  .grid2{ grid-template-columns:repeat(2,1fr); }
  .grid4 > div, .grid2 > div{ text-align:center; background:transparent; border:1px solid rgba(221,213,196,.55);
    border-radius:8px; padding:6px 2px; }
  .grid4 b, .grid2 b{ display:block; font-size:16px; color:var(--brand); font-family:Georgia,serif; line-height:1.2; }
  .grid4 span, .grid2 span{ font-size:10px; color:#4a453d; }
  .chips{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; overflow:hidden; }
  .chip{ font-size:10.5px; color:var(--sub); background:transparent; border:1px solid rgba(221,213,196,.55);
    border-radius:20px; padding:0 8px; max-width:150px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  /* 悬停整张卡片时，这些统计块才补上底色 */
  .card:hover .grid4 > div, .card:hover .grid2 > div{ background:#f7f4ea; border-color:var(--line); }
  .card:hover .chip{ background:#f7f4ea; border-color:var(--line); }
  .chip i{ font-style:normal; color:var(--brand); margin-left:4px; font-size:10px; }
  .recent{ font-size:11.5px; color:var(--sub); }
  .rline{ display:flex; gap:6px; align-items:baseline; padding:1px 0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rline .num{ margin-left:auto; color:var(--brand); font-size:10.5px; }
  .subTitle{ font-size:10.5px; color:#4a453d; margin:6px 0 2px; }

  .empty{ font-size:12px; color:#4a453d; line-height:1.8; }
  .empty code{ background:#f3f0e5; border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:11px; }
  .foot{ flex:none; border-top:1px solid var(--line); padding:6px 12px; font-size:10.5px; color:#4a453d; }
</style>
</head>
<body>

<div class="hd" data-tauri-drag-region title="按住这里拖动，松手自动吸附到最近的屏幕边缘">
  <span class="ttl" data-tauri-drag-region>工作台</span>
  <span class="sp" data-tauri-drag-region></span>
  <button id="btnRefresh" title="刷新">↻</button>
  <button id="btnOpenMain" class="hdOpen" title="显示 / 隐藏工作台主界面">⤢ 工作台</button>
  <button id="btnHide" title="收起侧边栏（Esc）">✕</button>
</div>

<div class="scroll" id="scroll">
  <div class="card" id="cardPomo">
    <h3>番茄钟 <span class="mini" id="pomoTask"></span></h3>
    <div class="pomoWrap">
      <div class="pomoRing" id="pomoRing">
        <svg viewBox="0 0 120 120" class="pomoSvg">
          <circle class="pomoBg" cx="60" cy="60" r="52"></circle>
          <circle class="pomoFg" id="pomoFg" cx="60" cy="60" r="52"></circle>
        </svg>
        <div class="pomoFace">
          <span class="pomoTime" id="pomoTime">25:00</span>
          <span class="pomoState" id="pomoState">未开始</span>
        </div>
      </div>
      <div class="pomoSide">
        <input class="pomoNoteIn" id="pomoNoteIn" placeholder="这一步在做什么…">
        <div class="pomoBtns">
          <button class="pomoBtn pomoGo" id="pomoStart">开始</button>
          <button class="pomoBtn" id="pomoPause" disabled>⏸ 暂停</button>
          <button class="pomoBtn" id="pomoStop">结束</button>
        </div>
        <!-- 不再有下拉框：计时对象直接来自待办里点的那一步 🍅。
             这里只显示「当前瞄准哪一步」，没选就提示去哪里点。 -->
        <div class="pomoPickWrap">
          <div class="pomoPick pomoCur" id="pomoCur">点下面待办里的 🍅 选一步开始</div>
        </div>
      </div>
    </div>
  </div>

  <div class="card" id="cardTodo">
    <h3>今日待办 <span class="mini" id="todoAt"></span>
      <button id="btnPull" class="hdBtn" title="从服务器拉取云端数据">↓</button>
      <button id="btnPush" class="hdBtn" title="把本地待办推送到服务器">↑</button>
      <button id="btnMore" class="hdBtn" title="在主界面打开：指定任务 / AI 生成 / AI 评分">⋯</button>
    </h3>
    <div id="todoBody" class="empty">读取中…</div>
    <div id="todoHint" class="hint"></div>
  </div>

  <div class="card" id="cardWeek">
    <h3>今日执行力 <span class="mini" id="weekAt"></span></h3>
    <div id="weekBody" class="empty">读取中…</div>
    <!-- 本周每日执行力：段位 + 周一到周日，口径与主窗口周报一致 -->
    <div id="capBlock" class="capBlock"></div>
  </div>

  <div class="card" id="cardGraph">
    <h3>文档检索 <span class="mini" id="graphAt"></span></h3>
    <div id="graphBody" class="empty">读取中…</div>
  </div>

  <div class="card" id="cardDb">
    <h3>数据库汇总 <span class="mini" id="dbAt"></span></h3>
    <!-- 搜索框已移到悬停浮层里：卡片只留数据总量。
         元素保留（逻辑要用），只是不显示。 -->
    <input id="dbQ" class="searchBox" placeholder="搜索数据库 / 笔记本 / 列名…" style="display:none" />
    <div id="dbBody" class="empty">读取中…</div>
  </div>

  <!-- 剪藏助手：默认隐藏（抓取服务依赖 Python + scrapling，不随包分发）。
       需要时把 hidden 去掉即可恢复。 -->
  <div class="card" id="cardClip" hidden>
    <h3>剪藏助手 <span class="mini">嵌入简化版</span></h3>
    <!-- allowtransparency + 透明底：让 iframe 内部也透出背后的桌面。
         iframe 里是独立文档，那边的 html/body 也要设成 transparent。 -->
    <iframe id="clipFrame" src="siyuan-assistant.html" allowtransparency="true" class="clipFrame"></iframe>
  </div>
</div>

<div class="foot"><span id="footHk">Ctrl+Alt+Space</span> 收起 · 数据只在本机</div>

<script>
(function(){
  "use strict";
  var TODOS_KEY = "dsh.worktable.todos.v1";
  /* 侧边栏不再读 3918 的周报，改成全部算本地快照（见 renderWeek） */

  function $(id){ return document.getElementById(id); }
  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }
  function p2(n){ return (n < 10 ? "0" : "") + n; }
  function hhmm(ts){
    var d = new Date(ts);
    return p2(d.getMonth()+1) + "-" + p2(d.getDate()) + " " + p2(d.getHours()) + ":" + p2(d.getMinutes());
  }

  /* ---------- 快照改写的唯一入口 ----------
     侧边栏有三个长期跑的后台任务（本地轮询 5s、推送回写、云端同步），
     它们和用户的点击都会「读快照 → 改 → 整份写回」。
     如果读和写之间隔了网络往返（几百毫秒到几秒），
     用户在这期间点下的勾选就会被这几秒前的旧副本整份覆盖 ——
     表现就是「点一下，框闪一下就弹回去了」「时好时坏」。
     所以所有写回都走这里：
       1) 真正写之前重新读一次最新快照做底；
       2) 只把 mutate 明确改动过的任务/步骤合并进去，
          其余任务一律以最新快照为准（绝不回退）；
       3) 同一时刻只允许一次改写，避免两次改写互相覆盖。 */
  var writeChain = Promise.resolve();
  var wpSeq = 0;
  function writeSnapshotSafe(mutate, opts){
    wpSeq++;
    var mySeq = wpSeq;
    var run = function(){
      var s = null;
      try { s = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(eW1){}
      if (!s || !Array.isArray(s.items)) return null;
      try { mutate(s); } catch(eW2){}
      s.wp = Math.max(Number(s.wp) || 0, mySeq);
      try { localStorage.setItem(TODOS_KEY, JSON.stringify(s)); } catch(eW3){}
      return s;
    };
    var p = writeChain.then(run, run);
    writeChain = p.catch(function(){});
    if (opts && opts.then) return p.then(opts.then);
    return p;
  }
  /* 按任务名 + 步骤文字（缺文字时退回下标）定位，把勾选状态写进最新快照。
     strictDone 默认 true：只允许「未勾 → 已勾」，不允许把已勾改回未勾。 */
  function writeStepState(name, stepText, stepIdx, done, doneAt, strictDone){
    return writeSnapshotSafe(function(s){
      var t = null;
      for (var i = 0; i < s.items.length; i++) {
        if (s.items[i] && String(s.items[i].name || "").trim() === String(name || "").trim()) { t = s.items[i]; break; }
      }
      if (!t || !Array.isArray(t.subs)) return;
      var k = -1;
      var txt = String(stepText || "").trim();
      if (txt) {
        for (var j = 0; j < t.subs.length; j++) {
          if (t.subs[j] && String(t.subs[j].text || "").trim() === txt) { k = j; break; }
        }
      }
      if (k < 0 && typeof stepIdx === "number") k = stepIdx;
      var sb = t.subs[k];
      if (!sb) return;
      if (strictDone !== false && sb.done && !done) return;   /* 不回退 */
      sb.done = !!done;
      if (done) { sb.doneAt = doneAt || sb.doneAt || todayStr(); }
      else { delete sb.doneAt; }
    });
  }

  /* ---------- 评分：与主窗口同一条公式（难度加权完成度） ---------- */
  /* 番茄记录只按「今天的」计时：昨天的记录不能算进今天，
     否则「实际」会一直挂着昨天的工时。 */
  function logDateOf(l){
    var m = /^(\d{4}-\d{2}-\d{2})/.exec(String((l && l.start) || "").trim());
    return m ? m[1] : "";
  }
  /* 一条步骤在「某一天」实际新增的完成比例（0~1）。
     依据 pctHist 逐日推进记录：11-16 到 60%、11-17 到 80%，
     则 11-17 的增量是 20%，不是 80%。
     没有 pctHist 的老数据：勾完记在完成日，否则全记在计划首日。 */
  function capStepProgress(x){
    var out = {};
    if (!x) return out;
    var hist = Array.isArray(x.pctHist) ? x.pctHist.filter(function(h){ return h && h.date; }) : [];
    if (hist.length) {
      var days = [];
      hist.forEach(function(h){
        var d = String(h.date).slice(0, 10);
        var p = Number(h.pct);
        if (!isFinite(p)) return;
        p = Math.max(0, Math.min(100, p));
        var hit = null;
        for (var i = 0; i < days.length; i++) { if (days[i].date === d) { hit = days[i]; break; } }
        if (hit) hit.pct = Math.max(hit.pct, p);
        else days.push({ date: d, pct: p });
      });
      days.sort(function(a, b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
      var prev = 0;
      days.forEach(function(day){
        var inc = Math.max(0, day.pct - prev);
        if (inc > 0) out[day.date] = (out[day.date] || 0) + inc / 100;
        prev = Math.max(prev, day.pct);
      });
      if (x.done) {
        var rest = 100 - prev;
        if (rest > 0) {
          var dd = String(x.doneAt || (days.length ? days[days.length-1].date : "") || "").slice(0, 10);
          if (dd) out[dd] = (out[dd] || 0) + rest / 100;
        }
      }
      return out;
    }
    var plan = Array.isArray(x.dates) && x.dates.length
      ? x.dates.map(function(v){ return String(v).slice(0, 10); })
      : (x.date ? [String(x.date).slice(0, 10)] : []);
    if (x.done) {
      var day = String(x.doneAt || plan[0] || "").slice(0, 10);
      if (day) out[day] = 1;
      return out;
    }
    var p = Number(x.pct);
    if (isFinite(p) && p > 0 && plan.length) out[plan[0]] = Math.min(1, p / 100);
    return out;
  }
  function stepIncOn(s, day){
    var m = capStepProgress(s);
    return m[day] || 0;
  }

  /* 一条步骤在「每一天」实际拿到的步骤分（按剩余额度记账）。
     步骤总分 = 任务预估工时 ÷ 步骤数，优先用 pctHist 里钉住的 pts，
     这样中途任务 mins 被改也不会把历史账重新算一遍。
     每天推进 inc，就从剩余的分里拿 inc × 总分，但不超过剩余额度。 */
  function capStepPointsByDay(x, perStepNow){
    var out = {};
    if (!x) return out;
    var prog = capStepProgress(x);
    var days = Object.keys(prog).sort();
    if (!days.length) return out;
    var total = 0;
    (Array.isArray(x.pctHist) ? x.pctHist : []).forEach(function(h){
      if (h && isFinite(Number(h.pts)) && Number(h.pts) > 0) total = Math.max(total, Number(h.pts));
    });
    if (!total) total = Number(perStepNow) || 0;
    var remain = total;
    days.forEach(function(d){
      var inc = Math.max(0, Math.min(1, prog[d] || 0));
      if (inc <= 0) return;
      var take = Math.min(remain, total * inc);
      out[d] = take;
      remain = Math.max(0, remain - take);
    });
    return out;
  }

  /* 一步「做完了多少」的系数 0~1。
     done=true 记 1；否则看 pct（0~100）—— 难步骤可能只推进一部分。
     放在 scoreOf 外面，因为 capBuildWeek（周执行力的效率计算）也要用。 */
  function stepFrac(s){
    if (!s) return 0;
    if (s.done) return 1;
    var p = Number(s.pct);
    if (!isFinite(p) || p <= 0) return 0;
    return Math.min(1, p / 100);
  }
  function scoreOf(items){
    var tk = todayStr();
    /* 跨天：日期变了，调用方传进来的 items 可能还是昨天的内存数据。
       这里只按今天的规则过滤，不依赖调用方是否重建过。 */
    /* 只统计「今天有自己步骤」的任务 —— 规则必须和主窗口完全一致：
       · 今天做完的步骤                    → 计入
       · 今天该做 / 没排日期、还没做完的   → 计入（欠账算在今天）
       · 计划在过去、今天也没做完的         → 属于过去的账，不计入今天
       · 未来日期                           → 排除 */
    items = (items || []).filter(function(t){
      if (!t) return false;
      var subs = t.subs || [];
      return subs.some(function(s){
        if (!s) return false;
        var pd = [];
        if (s.dates && s.dates.length) {
          s.dates.forEach(function(v){ pd.push(String(v).slice(0,10)); });
        } else if (s.date) {
          pd.push(String(s.date).slice(0,10));
        }
        if (!pd.length) {
          if (!s.done) return true;
          return s.doneAt ? s.doneAt === tk : true;
        }
        if (s.done && s.doneAt === tk) return true;
        if (!s.done && pd.indexOf(tk) >= 0) return true;
        return false;
      });
    });
    var wSum = 0, got = 0, totalMins = 0, doneMins = 0, doneCnt = 0, subsAll = 0, subsDone = 0, lvSum = 0;
    var minSum = 0, minGot = 0;
    var actedMins = 0;
    /* 只数今天完成的步骤：前几天勾的用 doneAt 排除掉；
       没有 doneAt 的老数据（或同步丢过日期），任务本身是今天/无日期的就算今天。
       必须和主窗口 stepDoneToday 完全一致，否则两处分数对不上。 */
    function stepToday(s, taskDate){
      if (!s || !s.done) return false;
      if (s.doneAt) return s.doneAt === tk;
      if (!taskDate) return true;
      return taskDate === tk;
    }
    items.forEach(function(t){
      var w = Math.min(5, Math.max(1, Number(t.level) || 3));
      var subs = t.subs || [], tot = subs.length;
      var dn = subs.filter(function(s){ return stepToday(s, t.date); }).length;
      /* ⚠ 必须和主窗口用同一套算法，否则两边分数对不上。
         步骤分 = 任务预估工时 ÷ 步骤数（工时按步均摊）。
         实际耗时（番茄记录）不参与打分。 */
      var minsRaw = Number(t.mins);
      var mins = (isFinite(minsRaw) && minsRaw > 0) ? minsRaw : (tot > 0 ? tot * 15 : 0);
      wSum += w; lvSum += w; got += w * (tot ? dn / tot : 0);

      /* 今天该做的部分 —— 和主窗口逐步骤一致：
         · 今天做完的            → 计入分子分母
         · 今天该做/没排日期未做 → 计入分母（欠账）
         · 计划在过去且没做完    → 属于过去的账，不进今天分母 */
      var isEarlier = function(x){ return !!(x && x.done && x.doneAt && x.doneAt !== tk); };
      var perStep = tot ? mins / tot : 0;
      var todayPts = 0, donePts = 0;
      subs.forEach(function(x){
        if (!x || isEarlier(x)) return;
        var pd = [];
        if (x.dates && x.dates.length) {
          x.dates.forEach(function(v){ pd.push(String(v).slice(0,10)); });
        } else if (x.date) {
          pd.push(String(x.date).slice(0,10));
        }
        if (stepToday(x, t.date)) {
          todayPts += perStep; donePts += perStep;
        } else if (!pd.length) {
          todayPts += perStep;
          /* 只算「今天新增」的进度。用总进度的话，
             11-16 的 60% 到了 11-17 会被再算一次。 */
          donePts += perStep * stepIncOn(x, tk);
        } else if (pd.indexOf(tk) >= 0) {
          todayPts += perStep;
          donePts += perStep * stepIncOn(x, tk);
        }
      });
      minSum += todayPts;
      minGot += donePts;

      totalMins += mins;
      subsAll += tot; subsDone += dn;
      if (tot && dn === tot) { doneCnt++; doneMins += mins; }
      (t.logs || []).forEach(function(l){
        var d = logDateOf(l);
        if (d && d !== tk) return;
        actedMins += Number(l.min) || 0;
      });
    });
    var total = items.length;
    /* 与主窗口一致：分数 = 今天勾掉的步骤 ÷ 今天该做的步骤（满分 100） */
    var score = minSum ? Math.round(minGot / minSum * 100) : 0;
    var pct = score;
    var grade = pct >= 95 ? "S" : pct >= 85 ? "A" : pct >= 70 ? "B" : pct >= 40 ? "C" : "D";
    var avgLv = total ? Math.round(lvSum / total * 10) / 10 : 0;
    return {total:total,doneCnt:doneCnt,score:score,pct:pct,grade:grade,avgLv:avgLv,
            totalMins:totalMins,doneMins:doneMins,subsDone:subsDone,subsAll:subsAll,
            planMins:totalMins,actedMins:actedMins};
  }

  /* ---------- 待办 ---------- */
  /* ---------- 项目（顶层文档）与重要性 ---------- */
  var PROJ_COLORS = ["#1B365D","#8C4A3C","#3E6B4F","#7A5C2E","#5A4A7A","#2E6E7E","#8A5A2B","#6B4E71"];
  var topDocs = [];
  function loadTopDocs(){
    return sql("SELECT content, hpath FROM blocks WHERE type='d' AND box!='' LIMIT 2000")
      .then(function(rows){
        topDocs = (rows || []).filter(function(r){
          var hp = String(r.hpath || "");
          return hp && hp.split("/").filter(Boolean).length === 1;
        }).map(function(r){ return { name: String(r.content || "").trim(), hpath: r.hpath }; })
          .filter(function(d){ return !!d.name; });
      }).catch(function(){ topDocs = []; });
  }
  function bigrams(s){
    var out = {}, str = String(s || "").replace(/[^\u4e00-\u9fa5a-zA-Z0-9]/g, "").toLowerCase();
    for (var i = 0; i < str.length - 1; i++) out[str.substr(i, 2)] = 1;
    return out;
  }
  /* 用二元字组匹配顶层文档名，猜这条待办属于哪个项目 */
  function inferProject(name){
    if (!topDocs.length) return "";
    var nb = bigrams(name), best = "", bestScore = 0;
    topDocs.forEach(function(d){
      var db = bigrams(d.name), keys = Object.keys(db);
      if (!keys.length) return;
      var hit = 0;
      keys.forEach(function(k){ if (nb[k]) hit++; });
      if (hit < 2) return;
      var score = hit / keys.length + hit * 0.05;
      if (score > bestScore) { bestScore = score; best = d.name; }
    });
    return best;
  }
  /* 与主界面完全一致的四象限。
     mark 是写进文档行的状态标记：
       重要·紧急   → 🔥   （火烧眉毛，立即做）
       重要·不紧急 → 🌱   （长期耕耘，排期做）
       紧急·不重要 → 🍃   （随风飘过，少做/委派）
       不重要·不紧急 → 空（不留标记，界面上也不需要） */
  var QUADS = {
    iu: { short: "重要·紧急",     color: "#e05252", important: true,  hint: "立即做",   mark: "🔥" },
    in: { short: "重要·不紧急",   color: "#d9a015", important: true,  hint: "排期做",   mark: "🌱" },
    uu: { short: "紧急·不重要",   color: "#e8863a", important: false, hint: "少做/委派", mark: "🍃" },
    un: { short: "不重要·不紧急", color: "#4caf6e", important: false, hint: "延后/删",   mark: "" }
  };
  function quadOf(t){
    var q = t && t.q;
    if (q && QUADS[q]) return QUADS[q];
    if (t && t.important) return QUADS.iu;
    return null;
  }
  /* 任务该写哪个状态标记。没有明确象限时退回旧规则：名字里带交付类关键词的算重要紧急。 */
  function quadMark(t){
    var qd = quadOf(t);
    if (qd) return qd.mark;
    if (/(交付|截止|评审|汇报|答辩|发布|提交|deadline)/i.test(t.name || "")) return QUADS.iu.mark;
    return "";
  }
  function isImportant(t){
    var qd = quadOf(t);

  }
  /* 项目下拉选项（顶层文档 + 当前项目） */

  var projCache = null;
  function projOptions(cur){
    var list = (projCache || topDocs.map(function(d){ return d.name; }))
      .filter(function(n){ return n && n !== "未归类"; });
    var cur0 = String(cur || "").trim();
    var html = '<option value=""' + (!cur0 ? " selected" : "") + '>未归类</option>';
    list.forEach(function(n){

    });

  }
  /* 一条番茄记录的显示行。stepIdx 为 null 表示挂在任务本身（没有步骤的任务） */
  function logLineHtml(l, ti, li, stepIdx){
    var siAttr = (stepIdx === null || stepIdx === undefined) ? "" : String(stepIdx);

         + '" title="双击修改说明">' + esc(l.text || "（无说明）") + '</span>'
         + '<button class="delBtn" data-del="log:' + ti + ':' + li + '" title="删除这条记录">✕</button></div>';
  }


  /* 正在「设时长 + 写说明」的那一步（{ ti, si, min, note } | null）。

  function taskHtml(t, ti, di){

    var byStep = {}, loose = [];

      + '<button class="delTask" data-deltask="' + di + '" title="删除这条待办">✕</button></div>'
      + '<ul class="subs">'

          var minSum = mine.reduce(function(a, o){ return a + (Number(o.l.min) || 0); }, 0);

    var _prepHtml = '';
    if (pomoPrepSide && pomoPrepSide.ti === di && pomoPrepSide.si === si) {

      var _n0 = Math.max(1, (t.subs || []).length);
      /* 默认时长 = 任务时长 ÷ 步骤数，按 5 分钟取整，夹在 5~90 之间。
         ⚠ 以前没有上限：任务 100 分钟 / 1 步 = 100 分钟，
         一个番茄 100 分钟太长了，用户想改还得手动输入。 */

         而它只在初始化时写过一次 —— 用户在输入框里改的值
         一旦遇到重绘就被 _def0 冲掉，表现就是「改不了时间」。 */
      var _cur0 = (pomoPrepSide.min != null && Number(pomoPrepSide.min) > 0)
        ? Number(pomoPrepSide.min) : _def0;
      /* 顺序：时长（左）→ 说明（中间，占满）→ 开始/取消（右）。
         说明框默认带上「这一步的标题」，可以直接改写成做了什么。 */
      var _note0 = (pomoPrepSide.note != null)
        ? pomoPrepSide.note
        : String(x.text || "");
      _prepHtml = '<li class="stepPrep" data-prep-ti="' + di + '" data-prep-si="' + si + '"'
        + ' data-prep-min="' + _cur0 + '">'
        + '<input class="stepPrepMin" type="number" min="1" max="600" step="1" value="' + _cur0 + '" title="分钟数">'
        + '<span class="stepPrepUnit">分</span>'
        + '<input class="stepPrepNote" placeholder="这一步在做什么…" value="' + esc(_note0) + '" title="记录这一步具体做了什么">'
        + '<button class="stepPrepGo" title="开始倒计时（回车也可以）">开始</button>'
        + '<button class="stepPrepCancel" title="取消">✕</button>'
        + '</li>';
    }
    /* 进度：步骤可以只推进一部分（难的步骤一次做不完）。
       pct = 0~100；done=true 视为 100%。
       显示规则：0 不显示徽标（保持清爽），1~99 显示百分比，100 由勾选表示。 */
    var _pct = (x.done ? 100 : (Number(x.pct) || 0));
    if (_pct >= 100) _pct = 100;
    var pctCls = _pct >= 100 ? 'full' : (_pct >= 60 ? 'high' : (_pct >= 30 ? 'mid' : 'low'));
    var pctBadge = (_pct > 0 && !x.done)
      ? '<button class="stepPct ' + pctCls + '" data-step-pct="' + di + ':' + si + '"'
        + ' title="这一步已完成 ' + _pct + '%，点一下调整">' + _pct + '%</button>'
      : '<button class="stepPct none" data-step-pct="' + di + ':' + si + '"'
        + ' title="标记这一步做了多少（用于部分计分）">%</button>';

    return '<li class="' + (x.done ? "done" : "") + '" data-ti="' + di + '" data-si="' + si + '" title="点击标记完成">'
               + '<span class="bx"></span><span class="subTxt" data-edit-sub="' + di + ':' + si + '" title="双击修改这个步骤">' + esc(x.text) + '</span>'
               + badge
               + pctBadge
               + '<button class="stepPomo" data-act="steplog" data-ti="' + di + '" data-si="' + si + '" title="给这一步记一个番茄">🍅</button>'
               + '<button class="stepIns" data-step-ins="' + di + ':' + si + '" title="在这一步后面插入新步骤">＋</button>'
               + '<button class="stepDel" data-step-del="' + di + ':' + si + '" title="删除这一步">✕</button>'
               + '</li>'
               /* 进度调节条（点百分比后出现） */
               + (stepPctFor === (di + ':' + si)
                   ? '<li class="stepPctBox" data-pct-ti="' + di + '" data-pct-si="' + si + '">'
                     + '<span class="stepPctLbl">已完成</span>'
                     + '<input class="stepPctRange" type="range" min="0" max="100" step="5" value="' + _pct + '">'
                     + '<span class="stepPctVal">' + _pct + '%</span>'
                     + '<button class="stepPctOk" data-pct-ok="' + di + ':' + si + '">定</button>'
                     + '<button class="stepPctCancel" data-pct-cancel="1">✕</button>'
                     + '</li>'
                   : '')
               /* 插入新步骤的输入框（插在这一行后面） */
               + (stepInsFor === (di + ':' + si)
                   ? '<li class="stepInsBox" data-ins-ti="' + di + '" data-ins-si="' + si + '">'
                     + '<input class="stepInsIn" placeholder="新步骤内容，回车添加…">'
                     + '<button class="stepInsOk" data-ins-ok="' + di + ':' + si + '">加</button>'
                     + '<button class="stepInsCancel" data-ins-cancel="1">✕</button>'
                     + '</li>'
                   : '')
               /* 设时长的预备框（如果这一行正在设） */
               + _prepHtml
               /* 这一步自己的番茄记录，紧贴在这一步下面 */
               + (mine.length ? '<li class="stepLogs">' + mine.map(function(o){ return logLineHtml(o.l, di, o.li, si); }).join("") + '</li>' : '');
        }).join("")
      + '</ul>'
      + (loose.length ? loose.map(function(o){ return logLineHtml(o.l, di, o.li, null); }).join("") : "")
      + notes.map(function(n, ni){
          return '<div class="noteLine">⏳ <span class="edt" contenteditable="false" data-edit="note:' + di + ':' + ni
               + '" title="双击修改备注">' + esc(n.text) + '</span>'
               + '<button class="delBtn" data-del="note:' + di + ':' + ni + '" title="删除这条备注">✕</button></div>';
        }).join("")
      + '</div>';
  }

  /* 重绘前把「用户正在输入的内容」存下来，画完再填回去。
     ⚠ renderTodos 是整块 innerHTML 重建，而本地轮询每 5 秒就会调它一次。
     不保护的话，用户刚在「＋ 插入步骤」「进度滑块」「设时长」这几个框里
     打了一半的内容会被清空、焦点也丢，看起来像「输入后过两秒自动刷新了」。 */
  function snapshotInputs(){
    var act = document.activeElement;
    var out = { focusClass: null, focusSel: null, vals: {}, editSpec: null, editText: null };
    if (act && act.classList) {
      ["stepInsIn", "stepPctRange", "stepPrepMin", "stepPrepNote"].forEach(function(c){
        if (act.classList.contains(c)) {
          out.focusClass = c;
          try { out.focusSel = [act.selectionStart, act.selectionEnd]; } catch(e){}
        }
      });
    }
    ["stepInsIn", "stepPctRange", "stepPrepMin", "stepPrepNote"].forEach(function(c){
      var el = document.querySelector("." + c);
      if (el) out.vals[c] = el.value;
    });
    /* ⚠ 把预备框里改过的「分钟数 / 说明」写回 pomoPrepSide。
       准备工作面板是靠 renderTodos 重画的，模板里用的值来自 pomoPrepSide。
       不在重绘前同步的话，用户改完 45 分、任何一次重绘都会把它冲回默认值，
       表现就是「时间改不了」。 */
    if (pomoPrepSide) {
      var mi2 = document.querySelector(".stepPrepMin");
      var nt2 = document.querySelector(".stepPrepNote");
      if (mi2) {
        var mv = Math.round(Number(mi2.value) || 0);
        if (mv > 0) pomoPrepSide.min = mv;
      }
      if (nt2) pomoPrepSide.note = String(nt2.value || "");
    }
    /* 正在双击编辑的文字块也记下来 */
    var ce = document.querySelector('[contenteditable="true"]');
    if (ce) {
      out.editSpec = ce.getAttribute("data-edit-sub") || ce.getAttribute("data-edit") || null;
      out.editText = String(ce.textContent || "");
      out.focusClass = "ce";
    }
    return out;
  }
  function restoreInputs(snap){
    if (!snap) return;
    Object.keys(snap.vals || {}).forEach(function(c){
      var el = document.querySelector("." + c);
      if (el && el.value !== snap.vals[c]) el.value = snap.vals[c];
    });
    /* 进度滑块的百分比标签是跟着 input 事件更新的，
       重绘后要按当前值重算一遍，否则会停在模板里的 0%。 */
    var rng = document.querySelector(".stepPctRange");
    if (rng) {
      var lv = rng.closest(".stepPctBox");
      var lab = lv ? lv.querySelector(".stepPctVal") : null;
      if (lab) lab.textContent = (Number(rng.value) || 0) + "%";
    }
    /* 恢复正在编辑的文字块（如果重绘发生在编辑期间） */
    if (snap.editText != null && snap.editSpec) {
      var esc2 = (window.CSS && CSS.escape) ? CSS.escape(snap.editSpec) : snap.editSpec.replace(/"/g, '\\"');
      var target = document.querySelector('[data-edit-sub="' + esc2 + '"]')
                || document.querySelector('[data-edit="' + esc2 + '"]');
      if (target) {
        target.textContent = snap.editText;
        target.setAttribute("contenteditable", "true");
        try { target.focus(); } catch(e){}
      }
    }
    if (snap.focusClass && snap.focusClass !== "ce") {
      var f = document.querySelector("." + snap.focusClass);
      if (f && document.activeElement !== f) {
        try {
          f.focus();
          if (snap.focusSel && snap.focusSel[0] != null) f.setSelectionRange(snap.focusSel[0], snap.focusSel[1]);
        } catch(e){}
      }
    }
  }

  /* 内容签名：用来判断「数据到底有没有变」。
     没变就不重绘 —— 否则后台每 5 秒轮询一次，卡片一直在闪。 */
  var _todoSig = "";
  function todoSig(raw){
    try {
      var s = JSON.stringify(raw, function(k, v){
        /* 易变字段不参与比较：它们每次写回都会变，但界面看起来一样 */
        if (k === "at" || k === "__oi" || k === "__pv" || k === "syncedAt") return undefined;
        return v;
      });
      return s || "";
    } catch(e) { return ""; }
  }

  function renderTodos(force){
    /* 正在编辑（双击改文字）时不要重建 DOM —— 重建会销毁编辑中的元素，
       触发 blur 把用户打的字提交成旧值。改动会在 finish() 之后自己刷。 */
    if (editGuard) return;
    var _inpSnap = snapshotInputs();
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(e){}

    /* 数据没变就不重绘（force=true 时强制） */
    if (!force) {
      var sig = todoSig(raw);
      if (sig && sig === _todoSig) return;
      _todoSig = sig;
    } else {
      _todoSig = todoSig(raw);
    }
    /* 只显示今天要做的：今天 / 无日期 / 更早但还没做完的。
       历史（更早日期的已完成任务）只用于两端存档，不在这里显示。
       ⚠ 过滤后下标就变了，而点击/编辑回写用的是**快照里的真实下标**。
       以前直接把过滤后的位置写进 data-ti，于是「侧边栏勾选」改到的是
       另一条任务（或越界什么都不改）—— 表现就是「勾了没反应 / 勾错条」。
       这里给每条任务挂上它在快照里的原始位置 __oi，渲染时用它当 data-ti。 */
    if (raw && Array.isArray(raw.items)) {
      var _today = todayStr();
      var _all = raw.items;
      raw = Object.assign({}, raw, {
        items: _all.filter(function(t, oi){
          if (!t) return false;
          t.__oi = oi;                              /* 快照里的真实下标 */
          if (t.hist) return false;                 /* 明确标了历史的就跳过 */
          if (!t.date) return true;                 /* 无日期：显示 */
          if (t.date === _today) return true;       /* 今天：显示 */
          if (t.date < _today) {
            /* 更早：还有未完成步骤 → 显示；
               全做完但「今天才做完最后一步」的也要显示，
               否则一勾它就消失，正好和你刚做的动作对着。 */
            var subs = t.subs || [];
            if (!subs.length) return false;         /* 没步骤的旧任务不显示 */
            if (subs.some(function(s){ return s && !s.done; })) return true;
            return subs.some(function(s){
              if (!s || !s.done) return false;
              return s.doneAt ? s.doneAt === _today : false;
            });
          }
          return false;                             /* 未来日期：不显示 */
        })
      });
    }
    var body = $("todoBody");
    if (!raw || !raw.items || !raw.items.length) {
      body.className = "empty";
      body.innerHTML = '还没有今日待办。<br>在主窗口「待办」页点「AI 生成今日待办」后，这里会自动同步。';
      $("todoAt").textContent = "";
      try { restoreInputs(_inpSnap); } catch(eRI0){}
      return;
    }
    var s = scoreOf(raw.items);
    var h = "";
    h += '<div class="score"><b>' + s.score + '</b><span class="u">分</span>'
       + '<span class="g" data-g="' + s.grade + '">' + s.grade + '</span>'
       + '<span class="u" style="margin-left:auto">完成 ' + s.doneCnt + '/' + s.total + ' 项</span></div>';
    h += '<div class="bar"><i style="width:' + s.pct + '%"></i></div>';
    h += '<div class="meta">'
       + '<span>子项 <b>' + s.subsDone + '/' + s.subsAll + '</b></span>'
       + '<span>实际 <b>' + (s.actedMins/60).toFixed(1) + '</b> 小时</span>'
       + '<span>预计 <b>' + (s.planMins/60).toFixed(1) + '</b> 小时</span>'
       + '<span>平均难度 <b>' + s.avgLv + '</b></span>'
       + '</div>';
    h += '<div class="addRow"><button class="addTask" title="新增一条待办">＋ 新增待办</button></div>';

    /* 按项目（顶层文档）分组。
       idx 存的是过滤后数组里的位置（取数据用），
       data-ti 用任务上记录的 __oi（快照里的真实下标，回写用）。 */
    var groups = [], gmap = {};
    raw.items.forEach(function(t, ti){
      var pj = String(t.project || "").trim() || inferProject(t.name) || "未归类";
      if (!gmap[pj]) {
        gmap[pj] = { name: pj, idx: [], color: PROJ_COLORS[groups.length % PROJ_COLORS.length] };
        groups.push(gmap[pj]);
      }
      gmap[pj].idx.push(ti);
    });
    groups.forEach(function(g){
      var doneN = g.idx.filter(function(ti){ return taskDone(raw.items[ti]); }).length;
      h += '<div class="projHead">'
         + '<span class="pdot" style="background:' + g.color + '"></span>'
         + '<span class="pname" style="color:' + g.color + '">' + esc(g.name) + '</span>'
         + '<span class="pcnt">' + doneN + '/' + g.idx.length + '</span>'
         + '</div>';
      g.idx.forEach(function(ti){
        var t = raw.items[ti];
        var realIdx = (t && typeof t.__oi === "number") ? t.__oi : ti;
        h += taskHtml(t, ti, realIdx);
      });
    });

    body.className = "";
    body.innerHTML = h;

    /* ---- 精简视图 ----
       卡片里只保留「分数栏 + 所有待办名 + 当前在做的步骤」，
       完整明细（项目分组、番茄记录、百分比按钮…）收进 detail 里，
       只在悬停浮层中显示 —— 浮层抓取的是 detail 的内容。 */
    (function(){
      var detail = document.createElement("div");
      detail.className = "todoDetail";
      /* 把刚渲染的内容整体挪进 detail */
      while (body.firstChild) detail.appendChild(body.firstChild);

      var brief = document.createElement("div");
      brief.className = "todoBrief";

      /* 分数栏：**复制**一份给精简卡，原件留在 detail 里。
         ⚠ 以前用 appendChild 搬 —— 搬走后完整卡就没有评分了。 */
      var scoreEl = detail.querySelector(".score");
      var barEl = detail.querySelector(".bar");
      var metaEl = detail.querySelector(".meta");
      [scoreEl, barEl, metaEl].forEach(function(el){
        if (el) brief.appendChild(el.cloneNode(true));
      });

      /* 精简卡：只列**未完成**的待办。
         每条 = 第一行「彩色优先级点 + 待办名」，
                第二行「当前在做的步骤」（换行显示）。
         只显示 1 条 —— 多的留给展开态和悬停浮层。 */
      var tasks = detail.querySelectorAll(".task");
      var list = document.createElement("div");
      list.className = "briefList";

      var pending = [];
      Array.prototype.forEach.call(tasks, function(tk){
        if (tk.classList.contains("tdone")) return;   /* 完成的不列 */
        var nm = tk.querySelector(".nm");
        var name = nm ? (nm.textContent || "").trim() : "";
        if (!name) return;
        pending.push({ el: tk, name: name });
      });

      /* 优先级颜色：从任务的象限类名判断
           q-iu 重要·紧急   红
           q-in 重要·不紧急  橙
           q-un 不重要·不紧急 绿 */
      function prioOf(tk){
        if (tk.classList.contains("q-iu")) return { cls: "p1", label: "重要·紧急" };
        if (tk.classList.contains("q-in")) return { cls: "p2", label: "重要·不紧急" };
        if (tk.classList.contains("q-uu")) return { cls: "p3", label: "紧急·不重要" };
        if (tk.classList.contains("q-un")) return { cls: "p4", label: "不重要·不紧急" };
        return { cls: "p2", label: "" };
      }

      /* 先按优先级排序，再只取第一条 */
      var ORDER = { p1: 0, p2: 1, p3: 2, p4: 3 };
      pending.forEach(function(p){ p.prio = prioOf(p.el); });
      pending.sort(function(a2, b2){ return ORDER[a2.prio.cls] - ORDER[b2.prio.cls]; });

      var show = pending.slice(0, 1);
      if (!show.length) {
        var empty = document.createElement("div");
        empty.className = "briefEmpty";
        empty.textContent = "待办都完成了";
        list.appendChild(empty);
      }

      show.forEach(function(p){
        var tk = p.el;
        var row = document.createElement("div");
        row.className = "briefRow " + p.prio.cls;

        /* 第一行：优先级点 + 名字 */
        var line1 = document.createElement("div");
        line1.className = "briefLine1";

        var dot = document.createElement("span");
        dot.className = "briefDot";
        dot.title = p.prio.label;
        line1.appendChild(dot);

        var nmEl = document.createElement("span");
        nmEl.className = "briefName";
        nmEl.textContent = p.name;
        line1.appendChild(nmEl);

        row.appendChild(line1);

        /* 第二行：当前在做的步骤 */
        var cur = null;
        var subs = tk.querySelectorAll(".subs > li");
        Array.prototype.forEach.call(subs, function(li){
          if (cur) return;
          if (!li.classList.contains("done")) cur = li;
        });
        /* 当前步骤：取不到文字就**不显示这一行** ——
           以前会留一个空的「▸」，看着像渲染坏了。 */
        var curTxt = "";
        if (cur) {
          var txt = cur.querySelector(".subTxt");
          curTxt = txt ? (txt.textContent || "").trim() : "";
        }
        if (curTxt) {
          var curEl = document.createElement("div");
          curEl.className = "briefCur";
          curEl.textContent = curTxt;
          row.appendChild(curEl);
        } else if (!cur) {
          /* 没有未完成步骤：说明步骤都做完了但任务没勾 */
          var doneEl = document.createElement("div");
          doneEl.className = "briefCur curDone";
          doneEl.textContent = "步骤已全部完成，可以勾掉这条了";
          row.appendChild(doneEl);
        }

        list.appendChild(row);
      });

      /* 剩下的未完成项：直接列出名字（比「还有 N 条」有用） */
      if (pending.length > 1) {
        var rest = document.createElement("div");
