        rest.className = "briefRest";

        var head = document.createElement("div");
        head.className = "briefRestHead";
        head.textContent = "其余 " + (pending.length - 1) + " 条未完成";
        rest.appendChild(head);

        pending.slice(1).forEach(function(p){
          var it = document.createElement("div");
          it.className = "briefRestItem " + p.prio.cls;
          it.title = p.name;

          var d2 = document.createElement("span");
          d2.className = "briefDot sm";
          it.appendChild(d2);

          var n2 = document.createElement("span");
          n2.className = "briefRestName";
          n2.textContent = p.name;
          it.appendChild(n2);

          rest.appendChild(it);
        });

        list.appendChild(rest);
      }

      brief.appendChild(list);

      body.appendChild(brief);
      body.appendChild(detail);
    })();

    $("todoAt").textContent = raw.at ? hhmm(raw.at) : "";
    /* 把重绘前用户正在输入的内容填回去（见 snapshotInputs 的说明） */
    try { restoreInputs(_inpSnap); } catch(eRI){}
    /* 番茄钟的步骤下拉跟着待办一起刷新 */
    try { ptBuildPick(); } catch(eP){}
    /* 每日执行力跟着待办一起刷新：勾一下马上能看到完成率变 */
    try { refreshCapacity(); } catch(eC){}
  }


  /* ---------- 本周每日执行力（今日执行力卡片的下半部分） ----------
     口径和主窗口「周报总结 → 每日执行力」完全一致：
       · 单步分值 = 任务预估工时 ÷ 步骤数（mins 缺失按每步 15 分钟）
       · 完成率   = 当天拿下的步骤分 ÷ 当天该做的步骤分
       · 效率     = Σ(当天拿到的步骤分 ÷ 该步当天耗时小时)
                    步骤分按剩余额度记账：老步骤在剩余部分里继续拿，新步骤完成多少拿多少
     记账规则：
       · 今天做完的步骤           → 记今天
       · 今天该做 / 没排日期未做  → 记今天（欠账）
       · 计划在过去且没做完       → 记在那天，不搬过来
     数据源是本地快照，不依赖云端接口。 */
  var CAP_KEY = "dsh.worktable.capacity.v1";

  function capPad2(n){ return (n < 10 ? "0" : "") + n; }
  function capYmd(d){ return d.getFullYear() + "-" + capPad2(d.getMonth()+1) + "-" + capPad2(d.getDate()); }
  function capAddDays(d, n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
  function capMondayOf(d){
    var x = new Date(d.getTime()); x.setHours(0,0,0,0);
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  function capParseYmd(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ""));
    return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
  }
  /* 把计划日期展开成逐日 */
  function capExpandDates(dates, single){
    var out = [];
    (dates || []).forEach(function(v){
      var s = String(v || "").trim();
      var m = /^(\d{4})-(\d{2})-(\d{2})\s*[~～-]\s*(\d{2})-(\d{2})$/.exec(s);
      if (m) {
        var a = new Date(+m[1], +m[2]-1, +m[3]);
        var b = new Date(+m[1], +m[4]-1, +m[5]);
        for (var t = 0; t < 400 && a <= b; t++) { out.push(capYmd(a)); a = capAddDays(a, 1); }
      } else if (capParseYmd(s)) out.push(s);
    });
    if (!out.length && single) out.push(single);
    return out;
  }

  /* 按天汇总本周数据 */
  function capBuildWeek(snap, mon){
    var from = capYmd(mon), to = capYmd(capAddDays(mon, 6));
    var todayStr0 = capYmd(new Date());
    var inThisWeek = (todayStr0 >= from && todayStr0 <= to);
    var optsToday = inThisWeek ? todayStr0 : null;

    var byDate = {};
    function bucket(k){
      if (!k || k < from || k > to) return null;
      return byDate[k] || (byDate[k] = {
        date: k, subsDone: 0, subsAll: 0, mins: 0,
        ptsAll: 0, ptsGot: 0, eff: 0, timedSubs: 0, rate: 0, hrs: 0, empty: false
      });
    }

    ((snap && snap.items) || []).forEach(function(it){
      if (!it) return;
      var subs = it.subs || [];
      var raw = Number(it.mins);
      var taskMins = (isFinite(raw) && raw > 0) ? raw : (subs.length ? subs.length * 15 : 0);
      var perStep = subs.length ? (taskMins / subs.length) : 0;

      /* 番茄记录按 [日][步] 归堆 */
      var minsByDay = {};
      (it.logs || []).forEach(function(l){
        var dd = String((l && l.start) || "").slice(0, 10);
        if (!capParseYmd(dd)) return;
        var si = (typeof l.si === "number") ? l.si : -1;
        if (!minsByDay[dd]) minsByDay[dd] = {};
        minsByDay[dd][si] = (minsByDay[dd][si] || 0) + (Number(l.min) || 0);
      });

      subs.forEach(function(s, si){
        if (!s) return;
        var plan = capExpandDates(s.dates, s.date);
        var doneDay = s.done ? (s.doneAt || plan[0] || it.date) : null;

        /* 逐日增量：哪天推进了多少就只记多少 */
        var progMap = capStepProgress(s);
        var progDays = Object.keys(progMap);

        /* 分母：涉及这条步骤的每一天 */
        var involve = {};
        progDays.forEach(function(dd){ involve[dd] = 1; });
        if (doneDay) involve[doneDay] = 1;
        plan.forEach(function(dd){ involve[dd] = 1; });
        if (!Object.keys(involve).length && optsToday) involve[optsToday] = 1;

        Object.keys(involve).forEach(function(dd){
          var bb = bucket(dd);
          if (!bb) return;
          bb.subsAll++;
          bb.ptsAll += perStep;
          if (s.done && dd === doneDay) bb.subsDone++;
        });

        /* 分子：只加当天的增量 */
        progDays.forEach(function(dd){
          var bb = bucket(dd);
          if (!bb) return;
          bb.ptsGot += perStep * (progMap[dd] || 0);
        });

        /* 效率：只看有番茄记录的步骤，且只算「当天的步骤分」。
           ⚠ 用 capStepPointsByDay 而不是 perStep × 增量 ——
           老步骤的分数要按「剩余额度」记账，不能每天都按整步分值重算。 */
        var effPtsByDay = capStepPointsByDay(s, perStep);
        var effDays = Object.keys(effPtsByDay);
        if (!effDays.length) effDays = progDays.length ? progDays
          : ((s.done && doneDay) ? [doneDay] : (plan.length ? plan : []));
        effDays.forEach(function(dd){
          var bb = bucket(dd);
          if (!bb) return;
          var mm = (minsByDay[dd] && typeof minsByDay[dd][si] === "number") ? minsByDay[dd][si] : 0;
          if (mm <= 0) return;
          var got = effPtsByDay[dd] || 0;
          if (got <= 0) return;
          bb.eff += got / (mm / 60);
          bb.timedSubs++;
        });
      });

      (it.logs || []).forEach(function(l){
        var dd = String((l && l.start) || "").slice(0, 10);
        if (!capParseYmd(dd)) return;
        var b = bucket(dd);
        if (b) b.mins += Number(l.min) || 0;
      });
    });

    var days = [];
    for (var k = 0; k < 7; k++) {
      var key = capYmd(capAddDays(mon, k));
      var rec = byDate[key];
      if (!rec) {
        days.push({ date: key, subsDone: 0, subsAll: 0, mins: 0, ptsAll: 0, ptsGot: 0, eff: 0, timedSubs: 0, rate: 0, hrs: 0, empty: true });
        continue;
      }
      rec.rate = rec.ptsAll ? Math.round(rec.ptsGot / rec.ptsAll * 100) : 0;
      rec.eff = rec.timedSubs ? Math.round(rec.eff) : 0;
      rec.hrs = Math.round((rec.mins / 60) * 10) / 10;
      rec.empty = (rec.ptsAll === 0 && rec.mins === 0);
      days.push(rec);
    }
    return days;
  }

  /* 段位：与主窗口同一套 */
  var CAP_RANKS = [
    { min:  0, name: "青铜", icon: "🥉", color: "#a06a3a" },
    { min: 25, name: "白银", icon: "🥈", color: "#8a94a0" },
    { min: 45, name: "黄金", icon: "🥇", color: "#c9a227" },
    { min: 62, name: "铂金", icon: "💎", color: "#4a9e9a" },
    { min: 78, name: "钻石", icon: "💠", color: "#4a7fb5" },
    { min: 90, name: "星耀", icon: "⭐", color: "#8a6fc0" },
    { min: 97, name: "王者", icon: "👑", color: "#c0392b" }
  ];
  function capRankOf(pts){
    var r = CAP_RANKS[0];
    CAP_RANKS.forEach(function(x){ if (pts >= x.min) r = x; });
    return r;
  }

  function refreshCapacity(){
    var snap = null;
    try { snap = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(e){}
    var mon = capMondayOf(new Date());
    var days = capBuildWeek(snap, mon);
    var lastDays = capBuildWeek(snap, capAddDays(mon, -7));

    var active = days.filter(function(d){ return !d.empty; });
    var timed = days.filter(function(d){ return !d.empty && d.timedSubs > 0; });

    /* 执行力点数：效率 × 完成率，按当天步骤分加权 */
    var pts = 0;
    if (timed.length) {
      var wSum = 0, acc = 0;
      timed.forEach(function(d){
        var w = Math.max(1, d.ptsAll);
        acc += Math.min(100, d.eff) * (d.rate / 100) * w;
        wSum += w;
      });
      pts = Math.round(acc / wSum);
    }

    /* 本周汇总完成率（按步骤分总账） */
    var allP = 0, gotP = 0;
    active.forEach(function(d){ allP += d.ptsAll; gotP += d.ptsGot; });
    var avgRate = allP ? Math.round(gotP / allP * 100) : 0;

    var cap = { days: days, lastDays: lastDays, pts: pts, avgRate: avgRate, at: Date.now() };
    try { localStorage.setItem(CAP_KEY, JSON.stringify(cap)); } catch(e){}

    renderCapacity(cap);
    /* 上下两块要一起刷：上半「今日执行力」（含建议）和下半「本周趋势」
       都是从同一份快照算的，只刷一块会出现「数字变了、建议没变」。
       以前这里漏了 renderWeek，导致勾选后建议文案停在旧值。 */
    try { renderWeek(); } catch(eW){}
    return Promise.resolve(cap);
  }

  function renderCapacity(cap){
    var box = $("capBlock");
    if (!box) return;
    if (!cap || !cap.days) {
      box.innerHTML = '<div class="capEmpty">暂无数据</div>';
      return;
    }
    var dows = ["一", "二", "三", "四", "五", "六", "日"];
    var today = todayStr();
    var rank = capRankOf(cap.pts || 0);
    var nextRank = null;
    CAP_RANKS.forEach(function(x, i){ if (x.min > (cap.pts||0) && !nextRank) nextRank = CAP_RANKS[i]; });
    var prog = nextRank ? Math.round(((cap.pts||0) - rank.min) / (nextRank.min - rank.min) * 100) : 100;

    var h = '';

    /* 段位 */
    h += '<div class="capRank" style="color:' + rank.color + '">'
       +   '<span class="capRankIcon">' + rank.icon + '</span>'
       +   '<span class="capRankBody">'
       +     '<b style="color:' + rank.color + '">' + rank.name + '</b>'
       +     '<i>执行力 ' + (cap.pts || 0) + ' / 100 · 本周完成率 ' + (cap.avgRate || 0) + '%</i>'
       +   '</span>'
       + '</div>'
       + '<div class="capRankBar"><i style="width:' + prog + '%;background:' + rank.color + '"></i></div>';

    /* 七天明细 */
    h += '<div class="capDays">';
    cap.days.forEach(function(d, i){
      var isToday = d.date === today;
      var cls = "capDay" + (d.empty ? " mute" : "") + (isToday ? " today" : "");
      var effTxt = d.empty ? "—" : d.eff;
      h += '<div class="' + cls + '">'
         +   '<span class="capDayDow">' + dows[i] + '</span>'
         +   '<span class="capDayEff">' + effTxt + '</span>'
         +   '<span class="capDayPct">' + (d.empty ? "" : d.rate + "%") + '</span>'
         + '</div>';
    });
    h += '</div>';

    /* 最后一行小字：最近有数据那天的分数 */
    var last = null;
    for (var n = cap.days.length - 1; n >= 0; n--) { if (!cap.days[n].empty) { last = cap.days[n]; break; } }
    if (last) {
      h += '<div class="capFoot">' + last.date.slice(5) + '：'
         + '<b>' + Math.round(last.ptsGot) + '/' + Math.round(last.ptsAll) + '</b> 分 · '
         + '完成率 <b>' + last.rate + '%</b>'
         + (last.timedSubs ? (' · 效率 <b>' + last.eff + '</b> 分/时') : ' · 未计时')
         + '</div>';
    } else {
      h += '<div class="capFoot">本周还没有记录</div>';
    }

    box.innerHTML = h;
  }

  /* ---------- 今日执行力 ----------
     这块原来显示「本周周报」（3918 渲染的周度总结）。改成今日视角：
       · 今日 AI 总结：AI 针对今天这批待办写的那句话
       · 今日完成情况：步骤分 / 完成率 / 效率 / 用时
       · 今日建议：按完成率和效率给一两句
     数据全部来自本地快照，不依赖周报服务。 */
  /* ---------- 七档分级 + 三档深浅 ----------
     每个指标先分七档（非常慢/慢/偏慢/正常/偏快/快/非常快），
     再给一个 level 表示「偏离程度」，用来控制颜色的深浅：
        tone  = bad(红) / good(绿) / flat(不变色) / none(中性灰)
        level = 1 轻度（浅）/ 2 中度 / 3 重度（深）
     所以「比上周微降 6 个点」是浅红，「大降 77 个点」是深红。
     注意「慢」是坏的、「快」是好的，别按数值高低理解反。 */

  /* 完成率：越低越慢 */
  function rateLabel(r){
    if (r < 20)  return { word: '今天非常慢', tip: '先把最小的一步做掉，别一次想太多', tone: 'bad', level: 3 };
    if (r < 40)  return { word: '今天偏慢',   tip: '收窄范围：今天只盯最关键的那一两步', tone: 'bad', level: 2 };
    if (r < 55)  return { word: '今天略慢',   tip: '把没做完的顺延，别让它变成明天的负担', tone: 'bad', level: 1 };
    if (r < 75)  return { word: '今天正常',   tip: '保持当前强度', tone: 'flat', level: 0 };
    if (r < 90)  return { word: '今天偏快',   tip: '快收尾了，把剩下的勾完', tone: 'good', level: 1 };
    if (r < 100) return { word: '今天很快',   tip: '只剩一点了，一口气做完', tone: 'good', level: 2 };
    return         { word: '今天全部完成',    tip: '可以收工，或提前排明天', tone: 'good', level: 3 };
  }

  /* 效率：步骤分/小时（当天拿到的步骤分 ÷ 耗时），越低越慢 */
  function effLabel(e){
    if (e < 8)   return { word: '效率非常慢', tip: '一小时拿不到 8 分：先检查是不是在做无效的事，一个番茄只锁定一个子步骤', tone: 'bad', level: 3 };
    if (e < 15)  return { word: '效率偏慢',   tip: '任务颗粒度可能太粗，拆成更小的步骤再计时', tone: 'bad', level: 2 };
    if (e < 25)  return { word: '效率略慢',   tip: '中途尽量不切任务，一个番茄做一件事', tone: 'bad', level: 1 };
    if (e < 60)  return { word: '效率正常',   tip: '保持当前节奏', tone: 'flat', level: 0 };
    if (e < 100) return { word: '效率偏快',   tip: '时间利用率不错，可以接更长的任务', tone: 'good', level: 1 };
    if (e < 160) return { word: '效率很快',   tip: '连续时间用起来，减少打断', tone: 'good', level: 2 };
    return         { word: '效率非常快',      tip: '留点余量给难的那条，别把自己排太满', tone: 'good', level: 3 };
  }

  /* 环比涨跌：正数=升（好，绿），负数=降（坏，红）
     |d|<5 视为持平，不上色。 */
  function trendLabel(d){
    var a = Math.abs(d);
    if (a < 5) return { word: '与上周持平', tip: '挑一天专门做最卡手的那件事', tone: 'flat', level: 0 };
    if (d > 0) {
      if (d >= 25) return { word: '比上周大升 ' + d + ' 个点', tip: '顺势加难度：最难的那条前置到上午', tone: 'good', level: 3 };
      if (d >= 12) return { word: '比上周上升 ' + d + ' 个点', tip: '可以给每天加一条稍难的任务', tone: 'good', level: 2 };
      return               { word: '比上周微升 ' + d + ' 个点', tip: '保持住，别急着加量', tone: 'good', level: 1 };
    }
    if (a >= 25) return { word: '比上周大降 ' + a + ' 个点', tip: '先别加任务：固定作息，早上先安排一条 20 分钟的热身任务', tone: 'bad', level: 3 };
    if (a >= 12) return { word: '比上周下降 ' + a + ' 个点', tip: '检查作息和第一条待办的难度', tone: 'bad', level: 2 };
    return              { word: '比上周微降 ' + a + ' 个点', tip: '留意别把小下滑拖成习惯', tone: 'bad', level: 1 };
  }

  /* tone + level → 行元素 class
     例：bad + 3 → "bad lv3"（深红），bad + 1 → "bad lv1"（浅红） */
  function toneCls(t, lv){
    var base = (t === 'bad' || t === 'good') ? t : (t === 'flat' ? 'flat' : '');
    if (!base) return '';
    var n = Number(lv) || 0;
    return base + (n > 0 ? ' lv' + Math.min(3, n) : '');
  }

  function renderWeek(){
    var body = $("weekBody");
    if (!body) return;

    var snap = null;
    try { snap = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(e){}
    var today = todayStr();

    /* —— 今日 AI 总结 —— */
    var sum = (snap && snap.summary) || "";

    /* 今日统计：复用 capBuildWeek，取今天那一格 */
    var mon = capMondayOf(new Date());
    var days = capBuildWeek(snap, mon);
    var lastDays = capBuildWeek(snap, capAddDays(mon, -7));
    var todayRec = null;
    for (var i0 = 0; i0 < days.length; i0++) {
      if (days[i0].date === today) { todayRec = days[i0]; break; }
    }

    var ptsAll = todayRec ? Math.round(todayRec.ptsAll) : 0;
    var ptsGot = todayRec ? Math.round(todayRec.ptsGot) : 0;
    var rate   = todayRec ? todayRec.rate : 0;
    var eff    = todayRec ? todayRec.eff : 0;
    var hrs    = todayRec ? todayRec.hrs : 0;
    var timed  = todayRec ? todayRec.timedSubs > 0 : false;
    var subsAll = todayRec ? todayRec.subsAll : 0;
    var subsDone = todayRec ? todayRec.subsDone : 0;

    var h = "";

    /* 今日 AI 总结 */
    if (sum) {
      h += '<div class="wkToday"><span class="wkTodayK">今日</span>' + esc(sum) + '</div>';
    }

    /* 今日完成情况：四个数字。
       主数字尽量短（0%、0/110 这类不换行），说明文字放第二行。 */
    h += '<div class="wkTodayStat">'
       +   '<span><b class="nw">' + rate + '%</b><i>完成率</i></span>'
       +   '<span><b class="nw sm">' + ptsGot + '/' + ptsAll + '</b><i>步骤分</i></span>'
       +   '<span><b class="nw">' + (timed ? eff : "—") + '</b><i>效率</i></span>'
       +   '<span><b class="nw">' + (timed ? hrs + "h" : "—") + '</b><i>用时</i></span>'
       + '</div>';

    /* 进度条 */
    h += '<div class="wkTodayBar"><i style="width:' + Math.max(0, Math.min(100, rate)) + '%;'
       + 'background:' + (rate >= 70 ? "#4caf6e" : rate >= 40 ? "#d9a015" : "#e05252") + '"></i></div>';

    /* 小字：步数 */
    if (subsAll) {
      h += '<div class="wkTodaySub">今日步骤 <b>' + subsDone + '/' + subsAll + '</b>'
         + (timed ? '' : ' · 还没有番茄记录，效率算不出来')
         + '</div>';
    }

    /* 今日建议 + 本周分析
       规则引擎算出结论（每条 = 一句结论 + 一句措施 + 一个色档 tone），
       再交给 AI 润色措辞。AI 不可用时直接用规则结论，不会空白。

       色档（tone）只表达「好坏方向」，不表达「严重程度」：
         bad  → 红（偏慢 / 下降 / 偏低）
         good → 绿（偏快 / 上升 / 偏高）
         flat → 不变色（持平）
         none → 不上色（中性提示） */
    var tips = [];

    /* —— ① 今日完成率：七档 —— */
    if (!ptsAll) {
      tips.push({ k: '今天还没有排待办', d: '点上方「⋯」→「生成今日待办」', tone: 'none' });
    } else {
      var rl = rateLabel(rate);
      tips.push({ k: rl.word + ' · 完成率 ' + rate + '%', d: rl.tip, tone: rl.tone, level: rl.level });

      /* 效率：同样七档（只在有计时时评） */
      if (timed) {
        var el = effLabel(eff);
        tips.push({ k: el.word + ' · ' + eff + ' 分/时', d: el.tip, tone: el.tone, level: el.level });
      } else if (ptsGot > 0) {
        tips.push({ k: '今天做了 ' + ptsGot + ' 分却没计时', d: '下次用步骤右边的 🍅 计时，效率才有数', tone: 'none' });
      }
    }

    /* —— ② 本周 vs 上周：涨跌七档 —— */
    var activeDays = days.filter(function(d){ return !d.empty; });
    var wAll = 0, wGot = 0;
    activeDays.forEach(function(d){ wAll += (d.ptsAll || 0); wGot += (d.ptsGot || 0); });
    var weekRate = wAll ? Math.round(wGot / wAll * 100) : 0;

    var pActive = lastDays.filter(function(d){ return !d.empty; });
    if (pActive.length >= 2) {
      var pAll = 0, pGot = 0;
      pActive.forEach(function(d){ pAll += (d.ptsAll || 0); pGot += (d.ptsGot || 0); });
      var pRate = pAll ? Math.round(pGot / pAll * 100) : 0;
      var tl = trendLabel(weekRate - pRate);
      /* weekCmp: 和上周的增减比较，精简卡里不显示 */
      tips.push({ k: tl.word, d: tl.tip, tone: tl.tone, level: tl.level, weekCmp: true });
    } else if (pActive.length) {
      tips.push({ k: '上周只有 ' + pActive.length + ' 天有记录', d: '攒够两周数据后才看得出趋势', tone: 'none', weekCmp: true });
    }

    /* —— ③ 本周平均效率：七档 —— */
    var timedDays = activeDays.filter(function(d){ return d.timedSubs > 0; });
    if (!timedDays.length) {
      if (wGot > 0) {
        tips.push({ k: '本周还没有计过时', d: '点步骤右边的 🍅 计时，效率才有数', tone: 'none' });
      }
    } else {
      var effSum = 0;
      timedDays.forEach(function(d){ effSum += d.eff; });
      var avgEff = Math.round(effSum / timedDays.length);
      var al = effLabel(avgEff);
      tips.push({ k: al.word + ' · 平均 ' + avgEff + ' 分/时', d: al.tip, tone: al.tone, level: al.level });

      var untimed = activeDays.filter(function(d){ return !(d.timedSubs > 0) && d.subsDone > 0; });
      if (untimed.length) {
        tips.push({ k: untimed.length + ' 天有产出但没计时', d: '补记这几天的番茄，效率曲线才准', tone: 'none' });
      }
    }

    /* —— ④ 连续下滑 / 回暖 —— */
    var segs = [], cur = [];
    days.forEach(function(d){
      if (d.empty) { if (cur.length) { segs.push(cur); cur = []; } return; }
      cur.push(d.rate);
    });
    if (cur.length) segs.push(cur);
    var drops = 0, ups = 0;
    segs.forEach(function(seg){
      var dn = 0, up = 0;
      for (var si = 1; si < seg.length; si++) {
        if (seg[si] < seg[si-1]) { dn++; up = 0; }
        else if (seg[si] > seg[si-1]) { up++; dn = 0; }
        else { dn = 0; up = 0; }
        if (dn > drops) drops = dn;
        if (up > ups) ups = up;
      }
    });
    if (drops >= 2) {
      tips.push({ k: '完成率连续 ' + (drops + 1) + ' 天下滑', d: '典型疲劳信号：固定作息，每天先做最想推进的那件事', tone: 'bad' });
    }
    if (ups >= 2) {
      tips.push({ k: '完成率连续 ' + (ups + 1) + ' 天上升', d: '状态在回暖，可以给每天加一条更难的', tone: 'good' });
    }

    /* 渲染成「关键数据大字 + 措施小字」
       视觉重心放在结论（.wkTipK），措施缩成第二行小字（.wkTipD）。
       结论里的数字再单独放大；颜色由 tone 决定：
         bad=红（慢/降/低） good=绿（快/升/高） flat=不变色 none=中性灰。 */
    h += '<ul class="wkTodayTips">' + tips.map(function(x){
      return '<li class="' + toneCls(x.tone, x.level) + (x.weekCmp ? ' weekCmp' : '') + '">'
        +   '<span class="wkTipK">' + hlNum(x.k) + '</span>'
        +   '<span class="wkTipD">' + esc(x.d) + '</span>'
        + '</li>';
    }).join("") + '</ul>';

    body.className = "";
    body.innerHTML = h;
    $("weekAt").textContent = "实时";

    /* 交给 AI 润色：规则已经给出结论，这里只是让措辞更自然。
       AI 挂了/没配 key 也不影响，上面那份规则结论已经显示出来了。 */
    try { aiPolishTips(tips, { rate: rate, ptsGot: ptsGot, ptsAll: ptsAll, eff: eff, timed: timed, weekRate: weekRate }); } catch(eAi){}
  }

  /* ---------- AI 润色：把规则结论改写成更好读的话 ----------
     几条约定（会原样送进 prompt，AI 必须照做）：
       · 只改说法，不改数字。数字必须与给它的完全一致。
       · 每条结论不超过 18 字，措施不超过 32 字。
       · 不要客套、不要总结、不要加新建议。
       · 返回条数必须与输入一致，顺序不变。 */
  var AI_POLISH_KEY = "dsh.worktable.tipsai.v1";
  var aiPolishBusy = false;
  var aiPolishStamp = "";

  function aiPolishTips(tips, metrics){
    if (!tips || !tips.length || aiPolishBusy) return;
    var c = {};
    /* 直接写 key 字面量：CFG_KEY 在文件后面才赋值，
       虽然运行时已经就绪，但这样更稳，不受顺序影响。 */
    try { c = JSON.parse(localStorage.getItem("dsh.worktable.learninggraph.v1") || "{}") || {}; } catch(e){}
    if (!c.aiKey || !c.aiBase || !c.aiModel) return;

    /* 同样的数据 + 同样的结论不重复请求（勾选一次会触发多轮渲染） */
    var stamp = JSON.stringify(tips) + JSON.stringify(metrics);
    if (stamp === aiPolishStamp) return;
    aiPolishStamp = stamp;
    aiPolishBusy = true;

    var sys = "你是工作台的文字润色助手。用户会给你一组「结论+措施」，它们是从当日/本周数据自动算出来的。"
      + "请只做措辞优化，严格遵守："
      + "① 数字必须原样保留，一个字都不许改；"
      + "② 每条结论(k)不超过 18 字，措施(d)不超过 32 字；"
      + "③ 不要客套话、不要总结、不要新增建议、不要合并或拆分条目；"
      + "④ 条数和顺序必须与输入完全一致。"
      + '只返回 JSON：{"items":[{"k":"结论","d":"措施"}]}。不要输出 JSON 以外的任何内容。';

    var user = "当前指标：" + JSON.stringify(metrics) + "\n\n待润色条目：\n"
      + tips.map(function(x, i){ return (i+1) + ". k=" + x.k + " | d=" + x.d; }).join("\n");

    fetch(c.aiBase, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + c.aiKey },
      body: JSON.stringify({
        model: c.aiModel,
        messages: [{ role: "system", content: sys }, { role: "user", content: user }],
        temperature: 0.3
      })
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(j){
      var txt = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "").trim();
      txt = txt.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
      var obj = null;
      try { obj = JSON.parse(txt); } catch(e) {
        var m = txt.match(/\{[\s\S]*\}/);
        if (m) try { obj = JSON.parse(m[0]); } catch(e2){}
      }
      if (!obj || !Array.isArray(obj.items) || obj.items.length !== tips.length) return;

      /* 数字校验：AI 改过数字就整条丢弃，用原文，绝不显示错的数 */
      var merged = tips.map(function(orig, i){
        var it = obj.items[i] || {};
        var k = String(it.k || "").trim();
        var d = String(it.d || "").trim();
        if (!k || !d) return orig;
        var numsOrig = (orig.k + orig.d).match(/\d+/g) || [];
        var numsNew = (k + d).match(/\d+/g) || [];
        if (numsOrig.join(",") !== numsNew.join(",")) return orig;
        if (k.length > 20 || d.length > 36) return orig;
        /* tone / level 必须从原条目继承 —— AI 只改措辞，
           不该改变「这是好是坏、有多严重」的判断。 */
        return { k: k, d: d, tone: orig.tone, level: orig.level };
      });
      aiPolishStamp = JSON.stringify(merged) + JSON.stringify(metrics);
      paintTips(merged);
    }).catch(function(){
      /* 失败就保持规则结论，不做任何提示 —— 用户不需要知道润色失败 */
    }).then(function(){ aiPolishBusy = false; });
  }

  /* 只替换建议列表，不动其它部分 */
  function paintTips(tips){
    var ul = document.querySelector('.wkTodayTips');
    if (!ul) return;
    ul.innerHTML = tips.map(function(x){
      return '<li class="' + toneCls(x.tone, x.level) + '">'
        +   '<span class="wkTipK">' + hlNum(x.k) + '</span>'
        +   '<span class="wkTipD">' + esc(x.d) + '</span>'
        + '</li>';
    }).join("");
  }

  /* 把结论里的数字包成 .n，让关键数据在视觉上跳出来。
     先整串转义，再在转义后的文本上匹配数字 —— 避免把标签本身当数字处理。 */
  function hlNum(s){
    return esc(String(s == null ? "" : s))
      .replace(/(\d+(?:\.\d+)?%?)/g, '<b class="n">$1</b>');
  }

  /* 勾选子项：改本地快照写回，主窗口会通过 storage 事件同步 */
  function toggleSub(ti, si){
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(e){}
    if (!raw || !raw.items) return;
    /* ti 用的是快照里的真实下标；万一越界（老 DOM 还没重绘），
       就退回按 data-si + 步骤文字定位，绝不改错条目。 */
    var task = raw.items[ti];
    if (!task) return;
    var sub0 = (task.subs || [])[si];
    if (!sub0) return;
    var want = !sub0.done;
    var txt = String(sub0.text || "").trim();
    var nm = String(task.name || "").trim();

    /* ⚠ 在改动**之前**把项目基准记下来，否则推送时算不出「哪个项目变了」，
       会退回全量推送（六个文档全部重写，本地要等十几秒）。
       同时把「本轮要推的项目」直接钉死，pollPush 和 storage 两个触发点
       都取这一份，谁也不会把对方领走。 */
    var myProj = String(task.project || "").trim();
    try {
      if (typeof refreshProjBaseline === "function") refreshProjBaseline();
      if (typeof setPendingProjects === "function") setPendingProjects([myProj]);
    } catch(eB){}

    /* 立即写一次（保证界面马上响应），使用的是同一个合并入口 */
    var writeNow = function(){
      return writeSnapshotSafe(function(s){
        var t = null;
        for (var i = 0; i < s.items.length; i++) {
          if (s.items[i] && String(s.items[i].name || "").trim() === nm) { t = s.items[i]; break; }
        }
        if (!t || !Array.isArray(t.subs)) return;
        var k = -1;
        for (var j = 0; j < t.subs.length; j++) {
          if (t.subs[j] && String(t.subs[j].text || "").trim() === txt) { k = j; break; }
        }
        if (k < 0) k = si;
        var sb = t.subs[k];
        if (!sb) return;
        sb.done = want;
        /* 记下勾选日期，计分时据此区分今天勾的和前几天勾的 */
        if (want) { sb.doneAt = todayStr(); } else { delete sb.doneAt; }
        /* 标记为待推送：让云端跟着更新，但不立刻拉取（拉取会把刚勾的覆盖回去） */
        s.dirty = 0;
        s.forcePush = Date.now();
        s.at = Date.now();
      });
    };

    /* 先在本地把「用户想要的状态」记下来。
       后台的本地轮询/推送回写看到这个意图后，不会用几秒前的文档状态把它盖回去。 */
    try {
      localStorage.setItem("dsh.worktable.todos.intent.v1", JSON.stringify({
        at: Date.now(), name: nm, text: txt, done: want
      }));
    } catch(eI){}
    recordDelta(nm, si, want);

    writeNow().then(function(){
      try { renderTodos(); } catch(e){}
    }).catch(function(){
      try { renderTodos(); } catch(e){}
    });
    /* 不再 scheduleSync()：它会 1.5 秒后拉云端，状态刚勾就被覆盖 */
  }
  /* ---- 三种记录方式：🍅 只记时 / ✅ 完成并记时 / ⏳ 只加备注 ---- */
  function readActInputs(ti){
    var mi = document.querySelector('input[data-mi="' + ti + '"]');
    var mt = document.querySelector('input[data-mt="' + ti + '"]');
    var min = mi ? Math.round(Number(mi.value)) : 25;
    if (!isFinite(min) || min <= 0) min = 25;
    return { min: min, text: mt ? String(mt.value || "").trim() : "" };
  }
  function doTaskAction(ti, act, si){
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(e){}
    if (!raw || !raw.items || !raw.items[ti]) return;
    var t = raw.items[ti];
    t.logs = t.logs || [];
    t.notes = t.notes || [];
    var inp = readActInputs(ti);
    var now = new Date();

    if (act === "log" || act === "done" || act === "steplog") {
      var start = new Date(now.getTime() - inp.min * 60000);
      var entry = {
        min: inp.min, start: fmtDT(start), end: fmtDT(now),
        text: inp.text || (act === "done" ? "完成" + t.name : ""), local: true
      };
      /* 从某一步发起的番茄 → 记下 si，显示时挂在那一步下面 */
      if (typeof si === "number") entry.si = si;
      t.logs.push(entry);
    }
    if (act === "done") {
      (t.subs || []).forEach(function(s, sj){
        if (!s.done) { s.done = true; recordDelta(t.name, sj, true); }
      });
    }
    if (act === "steplog" && typeof si === "number") {
      /* 记番茄的同时把那一步勾上（说明确实做了这一步） */
      var sb = (t.subs || [])[si];
      if (sb && !sb.done) {
        sb.done = true;
        sb.doneAt = todayStr();
        recordDelta(t.name, si, true);
      }
    }
    if (act === "note") {
      t.notes.push({ text: inp.text || "（备注）", at: Date.now(), local: true });
    }
    raw.at = Date.now();
    raw.dirty = Date.now();   /* 番茄/备注不是子项改动，单独标记需要回推 */
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
    var mt2 = document.querySelector('input[data-mt="' + ti + '"]');
    if (mt2) mt2.value = "";
    renderTodos();
    scheduleSync();
  }

  function toggleImp(ti){
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items[ti]) return;
    var t = raw.items[ti];
    var q = (t.q && QUADS[t.q]) ? t.q : "iu";
    /* 只翻转「重要/不重要」这一维，紧急程度保持不变：iu↔uu、in↔un */
    var flipped = (q.charAt(0) === "i" ? "u" : "i") + q.charAt(1);
    t.q = flipped;
    t.important = QUADS[flipped].important;
    raw.at = Date.now();
    raw.dirty = Date.now();
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
    renderTodos();
    scheduleSync();
  }

  /* 修改说明/备注：云端那条按删除记账，本地补一条 local 的新内容 */
  function commitEdit(spec, text){
    var parts = String(spec).split(":");
    var kind = parts[0], ti = +parts[1], idx = +parts[2];
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items[ti]) return;
    var t = raw.items[ti];

    /* 改任务名 */
    if (kind === "name") {
      if (!text || text === t.name) { renderTodos(); return; }
      t.name = text;
      raw.at = Date.now(); raw.dirty = Date.now();
      try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
      renderTodos(); return;   /* 编辑不自动同步，等手动推送 */
    }
    /* 改步骤文字 */
    if (kind === "sub") {
      var sb = (t.subs || [])[idx];
      if (!sb || !text || text === sb.text) { renderTodos(); return; }
      sb.text = text;
      raw.at = Date.now(); raw.dirty = Date.now();
      try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
      renderTodos(); return;   /* 编辑不自动同步，等手动推送 */
    }

    var arr = kind === "note" ? t.notes : t.logs;
    var e = arr && arr[idx];
    if (!e) { renderTodos(); return; }
    if (text === "" ) text = kind === "note" ? "（备注）" : "";
    if (text === (e.text || "")) { renderTodos(); return; }

    if (kind === "note") {
      raw.delNotes = raw.delNotes || [];
      raw.delNotes.push({ name: t.name, text: e.text });
      arr[idx] = { text: text, at: Date.now(), local: true };
    } else {
      raw.delLogs = raw.delLogs || [];
      raw.delLogs.push({ name: t.name, min: e.min, start: e.start });
      arr[idx] = { min: e.min, start: e.start, end: e.end, text: text, local: true };
    }
    raw.at = Date.now();
    raw.dirty = Date.now();
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e2){}
    renderTodos();
    scheduleSync();
  }

  /* 正在编辑（contenteditable）时的状态。
     ⚠ 本地轮询每 5 秒会重建整个 todoBody，正在编辑的那个元素会被销毁：
       销毁瞬间浏览器触发 blur → finish(true) → commitEdit 拿到的是
       「新画出来的、还没编辑过的元素」的 textContent，于是你刚打的内容
       被原文案顶掉。表现就是「编辑到一半突然被刷新吞掉」。
     解决：编辑期间挂起重绘（editGuard），并把编辑中的文本实时记在 editDraft，
     真要重绘时用它填回去。 */
  var editGuard = false;
  var editDraft = null;      /* { spec, text, sel } */

  function bindEdit(el, spec){
    el.setAttribute("contenteditable", "true");
    el.focus();
    editGuard = true;
    editDraft = { spec: String(spec), text: String(el.textContent || ""), sel: null };
    try {
      var r = document.createRange();
      r.selectNodeContents(el);
      var sel = window.getSelection();
      sel.removeAllRanges(); sel.addRange(r);
    } catch(e){}
    function finish(save){
      if (el._editDone) return;      /* Enter 之后可能还会来一次 blur，只处理一次 */
      el._editDone = true;
      el.removeEventListener("blur", onBlur);
      el.removeEventListener("keydown", onKey);
      el.removeEventListener("input", onInput);
      el.setAttribute("contenteditable", "false");
      /* 以「最后一次记录的草稿」为准，而不是 el.textContent ——
         元素可能已经被重绘换掉了，那时它的 textContent 是旧值。 */
      var finalText = editDraft ? String(editDraft.text || "").trim()
                                : String(el.textContent || "").trim();
      editGuard = false;
      editDraft = null;
      if (save) commitEdit(spec, finalText);
      else renderTodos();
    }
    function onBlur(){ finish(true); }
    function onInput(){
      /* 实时记下当前输入，重绘时用它恢复 */
      if (!editDraft) return;
      editDraft.text = String(el.textContent || "");
      try {
        var s2 = window.getSelection();
        if (s2 && s2.rangeCount) editDraft.sel = s2.getRangeAt(0).cloneRange();
      } catch(e){}
    }
    function onKey(ev){
      /* Enter / Esc 直接走 finish，不依赖 blur ——
         el.blur() 在元素本来就没焦点时不会触发 blur 事件，
         那样 finish 永远不执行，编辑的内容既没保存也没还原。 */
      if (ev.key === "Enter") { ev.preventDefault(); finish(true); }
      else if (ev.key === "Escape") { ev.preventDefault(); finish(false); }
    }
    el.addEventListener("blur", onBlur);
    el.addEventListener("keydown", onKey);
    el.addEventListener("input", onInput);
  }

  /* 删除一条备注 / 番茄记录：本地删掉并记账，下次同步会从云端一并删除 */
  function delEntry(kind, ti, idx){
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items[ti]) return;
    var t = raw.items[ti];
    if (kind === "note") {
      var n = (t.notes || [])[idx];
      if (!n) return;
      raw.delNotes = raw.delNotes || [];
      raw.delNotes.push({ name: t.name, text: n.text });
      t.notes.splice(idx, 1);
    } else {
      var l = (t.logs || [])[idx];
      if (!l) return;
      raw.delLogs = raw.delLogs || [];
      raw.delLogs.push({ name: t.name, min: l.min, start: l.start });
      t.logs.splice(idx, 1);
    }
    raw.at = Date.now();
    raw.dirty = Date.now();
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
    renderTodos();
    scheduleSync();
  }

  /* ---- 项目归类 / 新增 / 删除（这些是结构改动，立即同步云端） ---- */
  function setProject(ti, name){
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items[ti]) return;
    raw.items[ti].project = name === "未归类" ? "" : name;
    raw.at = Date.now(); raw.dirty = Date.now();
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
    renderTodos();
    pushTodos(true);
  }

  function deleteTask(ti){
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items[ti]) return;
    var it = raw.items[ti];
    var nm = it.name;
    /* 记录墓碑：云端对应任务需要一起消失 */
    raw.delTodos = raw.delTodos || [];
    raw.delTodos.push({
      name: nm,
      project: it.project || "",
      date: it.date || todayStr(),
      at: Date.now()
    });
    raw.items.splice(ti, 1);
    raw.at = Date.now();
    raw.dirty = 0;
    raw.forcePush = Date.now();
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
    renderTodos();
    todoHint("已删除「" + nm + "」，正在同步云端…", "#8b4513");
    pushTodos(true);
  }

  function addTask(){
    var raw = readSnapshot();
    if (!raw) raw = { items: [] };
    if (!Array.isArray(raw.items)) raw.items = [];
    raw.items.unshift({
      name: "新待办", why: "", how: "", phase: "今日待办",
      project: "", date: todayStr(), mins: 30, level: 2,
      q: "iu", important: false, logs: [], notes: [], subs: []
    });
    raw.at = Date.now(); raw.dirty = Date.now();
    try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
    renderTodos();
    pushTodos(true);
  }

  /* ---------- 步骤级增删 ----------
     都走 writeSnapshotSafe（侧边栏唯一写入口）：
     它每次读最新原始快照、按任务名定位，不会因为同名去重把下标搞错。
     写的是同一份 TODOS_KEY，所以主界面和番茄钟立刻就同步。 */

  function _projOfName(name){
    try {
      var rs = readSnapshot();
      var tx = (rs.items || []).filter(function(x){ return x && x.name === name; })[0];
      if (tx) return String(tx.project || "").trim() || inferProject(tx.name) || "未归类";
    } catch(e){}
    return "未归类";
  }

  /* 在指定步骤后面插入一个新步骤 */
  function commitInsertStep(ti, si, text){
    var t0 = String(text || "").trim();
    if (!t0) {
      var ii = document.querySelector('.stepInsIn');
      if (ii) { try { ii.focus(); } catch(e){} }
      return;
    }
    var name = "";
    try {
      var rs = readSnapshot();
      if (rs && rs.items && rs.items[ti]) name = String(rs.items[ti].name || "");
    } catch(e){}
    if (!name) return;

    var today0 = todayStr();
    writeSnapshotSafe(function(s){
      var task = null;
      for (var i = 0; i < s.items.length; i++) {
        if (s.items[i] && String(s.items[i].name || "") === name) { task = s.items[i]; break; }
      }
      if (!task) return;
      if (!Array.isArray(task.subs)) task.subs = [];
      var at = (si >= 0 && si < task.subs.length) ? si + 1 : task.subs.length;
      task.subs.splice(at, 0, {
        text: t0,
        done: false,
        doneAt: null,
        date: task.date || today0,
        dates: null
      });
      s.at = Date.now();
      s.dirty = Date.now();
      s.forcePush = Date.now();
    }).then(function(){
      stepInsFor = null;
      renderTodos();
      try { pushTodos(true, [_projOfName(name)]); } catch(e){}
      todoHint("已插入步骤：" + t0, "#2f7a4f");
    });
  }

  /* 删除某一步：点一下就删，但保留一份「撤销」资料。
     以前是「再点一次确认」—— 第一次点击只改了提示文案，
     而紧接着的推送会把这个提示盖掉（"已推送 N 个项目…"），
     用户看到的完全是「没反应」，所以判定成按钮坏了。
     现在改成一次点击就删 + 6 秒内可撤销，既即时又不至于误删。 */
  var _lastDelStep = null;    /* { name, step, at, idx } */

  function deleteStep(ti, si){
    var name = "", stepText = "", stepObj = null, stepIdx = -1;
    try {
      var rs = readSnapshot();
      var task = rs && rs.items && rs.items[ti];
      if (task) {
        name = String(task.name || "");
        var sb = (task.subs || [])[si];
        if (sb) { stepText = String(sb.text || ""); stepObj = sb; stepIdx = si; }
      }
    } catch(e){}
    if (!name || !stepText) return;

    /* 留好撤销用的信息（连同完成状态、日期一起，撤销回来才不丢） */
    _lastDelStep = {
      name: name,
      text: stepText,
      idx: stepIdx,
      at: Date.now(),
      sub: stepObj ? JSON.parse(JSON.stringify(stepObj)) : { text: stepText, done: false, doneAt: null }
    };

    writeSnapshotSafe(function(s){
      var task = null;
      for (var i = 0; i < s.items.length; i++) {
        if (s.items[i] && String(s.items[i].name || "") === name) { task = s.items[i]; break; }
      }
      if (!task || !Array.isArray(task.subs)) return;
      for (var j = 0; j < task.subs.length; j++) {
        if (task.subs[j] && String(task.subs[j].text || "") === stepText) {
          task.subs.splice(j, 1);
          break;
        }
      }
      s.at = Date.now();
      s.dirty = Date.now();
      s.forcePush = Date.now();
    }).then(function(){
      renderTodos();
      /* 提示放在推送之后，否则会被「已推送…」盖掉 */
      try { pushTodos(true, [_projOfName(name)]); } catch(e){}
      todoHint("已删除步骤「" + stepText + "」", "#8b4513");
      paintUndoStep();
      setTimeout(clearUndoStep, 6000);
    });
  }

  /* 撤销提示用独立浮条，不挂在 #todoHint 上 ——
     todoHint() 是 textContent = msg，会把里面的按钮整个清掉，
     而且推送完成时它还会被「已推送…」覆盖。 */
  function paintUndoStep(){
    clearUndoStep();
    if (!_lastDelStep) return;
    var bar = document.createElement("div");
    bar.id = "undoStepBar";
    bar.textContent = "已删除「" + _lastDelStep.text + "」";
    var b = document.createElement("button");
    b.textContent = "↩ 撤销";
    bar.appendChild(b);
    document.body.appendChild(bar);
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      undoDeleteStep();
    });
  }
  function clearUndoStep(){
    var bar = document.getElementById("undoStepBar");
    if (bar && bar.parentNode) bar.parentNode.removeChild(bar);
  }
  function undoDeleteStep(){
    var d = _lastDelStep;
    if (!d) return;
    _lastDelStep = null;
    clearUndoStep();
    writeSnapshotSafe(function(s){
      var task = null;
      for (var i = 0; i < s.items.length; i++) {
        if (s.items[i] && String(s.items[i].name || "") === d.name) { task = s.items[i]; break; }
      }
      if (!task) return;
      if (!Array.isArray(task.subs)) task.subs = [];
      /* 原位插回；找不到位置就追加到末尾 */
      var at = (d.idx >= 0 && d.idx <= task.subs.length) ? d.idx : task.subs.length;
      task.subs.splice(at, 0, d.sub);
      s.at = Date.now();
      s.dirty = Date.now();
      s.forcePush = Date.now();
    }).then(function(){
      renderTodos();
      try { pushTodos(true, [_projOfName(d.name)]); } catch(e){}
      todoHint("已撤销，步骤「" + d.text + "」已恢复", "#2f7a4f");
    });
  }

  /* 设置某一步的完成进度（0~100）。
     有些步骤很难、一次做不完，用进度来折算分数，而不是只有 0 / 100。
     进度会连同「哪天推进了多少」一起记进 pctHist，方便回溯。 */
  function commitStepPct(ti, si, pct){
    var name = "", stepText = "", oldPct = 0;
    try {
      var rs = readSnapshot();
      var task = rs && rs.items && rs.items[ti];
      if (task) {
        name = String(task.name || "");
        var sb = (task.subs || [])[si];
        if (sb) { stepText = String(sb.text || ""); oldPct = sb.done ? 100 : (Number(sb.pct) || 0); }
      }
    } catch(e){}
    if (!name || !stepText) return;

    var p = Math.max(0, Math.min(100, Math.round(Number(pct) || 0)));
    var today0 = todayStr();

    writeSnapshotSafe(function(s){
      var task = null;
      for (var i = 0; i < s.items.length; i++) {
        if (s.items[i] && String(s.items[i].name || "") === name) { task = s.items[i]; break; }
      }
      if (!task || !Array.isArray(task.subs)) return;
      for (var j = 0; j < task.subs.length; j++) {
        var sb2 = task.subs[j];
        if (!sb2 || String(sb2.text || "") !== stepText) continue;
        sb2.pct = p;
        if (p >= 100) { sb2.done = true; sb2.doneAt = sb2.doneAt || today0; }
        else { sb2.done = false; delete sb2.doneAt; }
        /* 记录推进历史：只留最近 40 条。
           同一天多次调整 → 保留当天的较大值（进度不该倒退）。
           同时把「这一步的分值」钉进 pts 字段：
           以后任务 mins 被 AI 改动，历史记账也不会被追改。 */
        if (!Array.isArray(sb2.pctHist)) sb2.pctHist = [];
        var _nSubs = Math.max(1, (task.subs || []).length);
        var _tMins = Number(task.mins) > 0 ? Number(task.mins) : _nSubs * 15;
        var _perStep = Math.round((_tMins / _nSubs) * 100) / 100;
        var hitDay = null;
        for (var h = sb2.pctHist.length - 1; h >= 0; h--) {
          if (sb2.pctHist[h] && String(sb2.pctHist[h].date).slice(0,10) === today0) { hitDay = sb2.pctHist[h]; break; }
        }
        if (hitDay) {
          hitDay.pct = Math.max(Number(hitDay.pct) || 0, p);
          if (!(Number(hitDay.pts) > 0)) hitDay.pts = _perStep;
        } else if (p !== oldPct) {
          sb2.pctHist.push({ date: today0, pct: p, pts: _perStep });
        }
        /* 历史里一条 pts 都没有的（老数据），补上当前分值 */
        if (!sb2.pctHist.some(function(e){ return e && Number(e.pts) > 0; })) {
          sb2.pctHist.forEach(function(e){ if (e) e.pts = _perStep; });
        }
        if (sb2.pctHist.length > 40) sb2.pctHist = sb2.pctHist.slice(-40);
        break;
      }
      s.at = Date.now();
      s.dirty = Date.now();
      s.forcePush = Date.now();
    }).then(function(){
      stepPctFor = null;
      renderTodos();
      try { pushTodos(true, [_projOfName(name)]); } catch(e){}
      todoHint("「" + stepText + "」进度设为 " + p + "%", "#2f7a4f");
    });
  }

  /* 进度滑块拖动时实时更新旁边的百分比 */
  document.addEventListener("input", function(e){
    var t0 = e.target;
    if (!t0 || !t0.classList) return;
    if (t0.classList.contains("stepPctRange")) {
      var box = t0.closest(".stepPctBox");
      var val = box ? box.querySelector(".stepPctVal") : null;
      if (val) val.textContent = (Number(t0.value) || 0) + "%";
      return;
    }
    /* 预备框：用户一改就把值存进 pomoPrepSide，
       这样即使中途发生重绘，改过的时长/说明也不会被默认值冲掉。 */
    if (pomoPrepSide && (t0.classList.contains("stepPrepMin") || t0.classList.contains("stepPrepNote"))) {
      if (t0.classList.contains("stepPrepMin")) {
        var mv = Math.round(Number(t0.value) || 0);
        if (mv > 0) pomoPrepSide.min = mv;
      } else {
        pomoPrepSide.note = String(t0.value || "");
      }
    }
  }, true);

  var clickTimer = null;

  /* 双击编辑：任务名 / 步骤 / 番茄说明 / 备注 */
  $("todoBody").addEventListener("dblclick", function(ev){
    var el = ev.target;
    if (!el || !el.closest) return;
    if (el.getAttribute && el.getAttribute("contenteditable") === "true") return;
    /* 双击优先：取消还没执行的勾选 */
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; }
    var sub = el.closest("[data-edit-sub]");
    if (sub) {
      ev.stopPropagation();
      var p = sub.getAttribute("data-edit-sub").split(":");
      bindEdit(sub, "sub:" + p[0] + ":" + p[1]);
      return;
    }
    var edt = el.closest(".edt");
    if (edt) {
      ev.stopPropagation();
      bindEdit(edt, edt.getAttribute("data-edit"));
    }
  });

  $("todoBody").addEventListener("click", function(ev){
    var el0 = ev.target;
    if (el0 && el0.closest) {
      var dt2 = el0.closest("[data-deltask]");
      if (dt2) { deleteTask(+dt2.getAttribute("data-deltask")); return; }
      if (el0.closest(".addTask")) { addTask(); return; }

      /* —— 步骤级：插入 / 删除 —— */
      var insBtn = el0.closest("[data-step-ins]");
      if (insBtn) {
        ev.stopPropagation();
        stepInsFor = String(insBtn.getAttribute("data-step-ins"));
        renderTodos();
        var ii = document.querySelector('.stepInsIn');
        if (ii) { try { ii.focus(); } catch(e){} }
        return;
      }
      if (el0.closest("[data-ins-cancel]")) {
        ev.stopPropagation();
        stepInsFor = null;
        renderTodos();
        return;
      }
      var insOk = el0.closest("[data-ins-ok]");
      if (insOk) {
        ev.stopPropagation();
        var ibox = insOk.closest('.stepInsBox');
        var iin = ibox ? ibox.querySelector('.stepInsIn') : null;
        var spec = String(insOk.getAttribute("data-ins-ok")).split(":");
        commitInsertStep(+spec[0], +spec[1], iin ? iin.value : "");
        return;
      }
      var delStep = el0.closest("[data-step-del]");
      if (delStep) {
        ev.stopPropagation();
        var dspec = String(delStep.getAttribute("data-step-del")).split(":");
        deleteStep(+dspec[0], +dspec[1]);
        return;
      }

      /* —— 步骤进度 —— */
      var pctBtn = el0.closest("[data-step-pct]");
      if (pctBtn) {
        ev.stopPropagation();
        var pspec = String(pctBtn.getAttribute("data-step-pct"));
        stepPctFor = (stepPctFor === pspec) ? null : pspec;
        renderTodos();
        var rng = document.querySelector('.stepPctRange');
        if (rng && stepPctFor) { try { rng.focus(); } catch(e){} }
        return;
      }
      if (el0.closest("[data-pct-cancel]")) {
        ev.stopPropagation();
        stepPctFor = null;
        renderTodos();
        return;
      }
      var pctOk = el0.closest("[data-pct-ok]");
      if (pctOk) {
        ev.stopPropagation();
        var pbox = pctOk.closest('.stepPctBox');
        var prng = pbox ? pbox.querySelector('.stepPctRange') : null;
        var spec2 = String(pctOk.getAttribute("data-pct-ok")).split(":");
        commitStepPct(+spec2[0], +spec2[1], prng ? Number(prng.value) : 0);
        return;
      }
    }
    var el = ev.target;
    if (!el || !el.closest) return;

    /* —— 设时长的预备框：先处理，别让它冒泡成「标记完成」 —— */
    var prepBox = el.closest('.stepPrep');
    if (prepBox) {
      ev.stopPropagation();
      var pti = +prepBox.getAttribute('data-prep-ti');
      var psi = +prepBox.getAttribute('data-prep-si');
      if (el.closest('.stepPrepCancel')) { ptClosePrep(); return; }
      if (el.closest('.stepPrepGo') || el.classList.contains('stepPrepMin')) {
        if (!el.closest('.stepPrepGo')) return;   /* 点输入框本身：只聚焦，不开始 */
        var mi = prepBox.querySelector('.stepPrepMin');
        var m0 = Math.round(Number(mi ? mi.value : 0) || 0);
        if (!(m0 > 0)) { if (mi) { try { mi.focus(); mi.select(); } catch(e){} } return; }
        /* 说明框里写的内容带进计时，结束时作为这条番茄记录的文案 */
        var nt0 = prepBox.querySelector('.stepPrepNote');
        var note0 = nt0 ? String(nt0.value || "").trim() : "";
        pomoPrepSide = null;
        try { renderTodos(); } catch(e){}
        ptStartNow(pti, psi, m0, note0);
        return;
      }
      return;   /* 点框的空白处：什么都不做 */
    }

    /* 正在编辑时不要触发勾选等动作 */
    if (el.closest('[contenteditable="true"]')) return;
    var star = el.closest(".starBtn");
    if (star) { toggleImp(+star.getAttribute("data-star")); return; }
    var delBtn = el.closest(".delBtn");
    if (delBtn) {
      var ds = delBtn.getAttribute("data-del").split(":");
      delEntry(ds[0], +ds[1], +ds[2]);
      return;
    }

    var actEl = el.closest(".miniAct");
    if (actEl) { doTaskAction(+actEl.getAttribute("data-ti"), actEl.getAttribute("data-act")); return; }
    /* 步骤上的 🍅 按钮：直接开番茄钟（圆形计时器），不再直接写记录 */
    var stepPomo = el.closest(".stepPomo");
    if (stepPomo) {
      ptStartForStep(+stepPomo.getAttribute("data-ti"), +stepPomo.getAttribute("data-si"));
      return;
    }
    var li = el.closest("li[data-ti]");
    if (!li) return;
    /* 延迟一点再勾选：如果紧接着来了双击，就取消勾选改为编辑 */
    var ti0 = +li.getAttribute("data-ti"), si0 = +li.getAttribute("data-si");
    if (clickTimer) clearTimeout(clickTimer);
    clickTimer = setTimeout(function(){ clickTimer = null; toggleSub(ti0, si0); }, 220);
  });

  /* ---------- 思源 API（与主窗口共用同一份 localStorage 配置） ---------- */
  var CFG_KEY = "dsh.worktable.learninggraph.v1";
  function cfg(){
    try { return JSON.parse(localStorage.getItem(CFG_KEY)) || {}; } catch(e){ return {}; }
  }
  function syPost(path, body){
    var c = cfg();
    if (!c.token) { return Promise.reject(new Error("未配置思源令牌")); }
    var base = String(c.base || "http://127.0.0.1:6806").replace(/\/+$/, "");
    return fetch(base + path, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Token " + c.token },
      body: JSON.stringify(body || {})
    }).then(function(r){
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(j){
      if (j && j.code !== 0) throw new Error(j.msg || ("code " + j.code));
      return j.data;
    });
  }
  function sql(stmt){ return syPost("/api/query/sql", { stmt: stmt }); }
  function stamp(d){ /* 思源 updated 是 YYYYMMDDHHMMSS */
    function p(n){ return (n<10?"0":"")+n; }
    return "" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate());
  }
  function fail(box, at, e){
    box.className = "empty";
    box.innerHTML = '思源未连接：' + esc((e && e.message) || e) + '<br>请在主窗口「设置」里检查令牌。';
    if (at) at.textContent = "离线";
  }

  /* ---------- 知识图谱：结构概览 ---------- */
  function renderGraph(){
    var body = $("graphBody"), at = $("graphAt");
    var d0 = new Date();
    d0.setHours(0,0,0,0);
    var todayStamp = stamp(d0);

    Promise.all([
      /* 总文档数 */
      sql("SELECT count(*) AS n FROM blocks WHERE type='d' AND box!=''"),
      /* 今天编辑过的文档 */
      sql("SELECT id, content, updated, box FROM blocks WHERE type='d' AND box!='' AND updated >= '" + todayStamp + "' ORDER BY updated DESC LIMIT 20")
    ]).then(function(r){
      var docs = (r[0] && r[0][0] && r[0][0].n) || 0;
      /* ⚠ 上面 Promise.all 只有 2 项：r[0] 是总数、r[1] 是文档列表。
         之前写成 r[2]，取到 undefined，「今日编辑」永远是 0 篇。 */
      var edited = r[1] || [];

      /* ⚠ length(content) 统计的是**标题字数**（content 列存的就是文档标题），
         不是正文。正文要单独查 —— 用同一个 SQL 查不到。
         这里对今天的文档逐个查它子块的字数之和。 */
      var sumP = edited.map(function(d){
        return sql("SELECT sum(length(content)) AS wc FROM blocks WHERE root_id='" + d.id + "' AND type IN ('p','h','l','i','t','c')")
          .then(function(x){ return (x && x[0] && x[0].wc) || 0; })
          .catch(function(){ return 0; });
      });

      /* 全库总字数：按 root_id 聚合所有文档正文块。
         一次查完再按文档分组，比逐个查快得多。 */
      var totalP = sql("SELECT root_id, sum(length(content)) AS wc FROM blocks WHERE type IN ('p','h','l','i','t','c') AND box!='' GROUP BY root_id")
        .then(function(rows){
          var t = 0;
          (rows || []).forEach(function(x){ t += Number(x.wc) || 0; });
          return t;
        })
        .catch(function(){ return 0; });

      return Promise.all([Promise.all(sumP), totalP]).then(function(rs){
        var wcs = rs[0], totalWc = rs[1];

        /* 把正文长度挂到每篇文档上 */
        edited.forEach(function(d, i){ d.wc = wcs[i] || 0; });

        /* 按字数从多到少，只留最大的那篇 */
        var sorted = edited.slice().sort(function(a2, b2){ return (b2.wc || 0) - (a2.wc || 0); });
        var top = sorted[0];
        var todayWc = 0;
        edited.forEach(function(d){ todayWc += d.wc || 0; });

        var h = '<div class="grid2">'
          + '<div><b>' + fmtNum(docs) + '</b><span>总文档</span></div>'
          + '<div><b>' + fmtWc(totalWc) + '</b><span>总字数</span></div>'
          + '</div>';

        h += '<div class="docToday">';
        if (top) {
          var name = String(top.content || "").replace(/<[^>]+>/g, "").trim() || "（无标题）";
          h += '<div class="docTop">'
            + '<div class="docTopHead">今天写得最多</div>'
            + '<div class="docTopRow">'
            + '<span class="docTopNm" title="' + esc(name) + '">' + esc(name) + '</span>'
            + '<span class="docTopWc">' + fmtWc(top.wc) + ' 字</span>'
            + '</div></div>';
        } else {
          h += '<div class="docEmpty">今天还没有编辑文档</div>';
        }
        h += '</div>';

        /* 完整版：文档名加粗、字数右对齐、带上编辑时间 */
        var detail = '<div class="docDetail">';
        detail += '<div class="docDetailHead">今天编辑 ' + edited.length + ' 篇 · 共 ' + fmtWc(todayWc) + ' 字</div>';
        if (sorted.length) {
          detail += '<div class="docList">' + sorted.map(function(d){
            var n = String(d.content || "").replace(/<[^>]+>/g, "").trim() || "（无标题）";
            var t = fmtClock(d.updated);
            return '<div class="docItem" title="' + esc(n) + '">'
              + '<span class="docItemNm">' + esc(n) + '</span>'
              + '<span class="docItemTime">' + esc(t) + '</span>'
              + '<span class="docItemWc">' + fmtWc(d.wc) + ' 字</span>'
              + '</div>';
          }).join("") + '</div>';
        }
        detail += '</div>';

        body.className = "";
        body.innerHTML = h + detail;
        if (at) at.textContent = "实时";
      });
    }).catch(function(e){ fail(body, at, e); });
  }

  /* 思源 updated 是 YYYYMMDDHHMMSS，转成 HH:MM */
  function fmtClock(s){
    s = String(s || "");
    if (s.length < 12) return "";
    return s.slice(8, 10) + ":" + s.slice(10, 12);
  }

  /* 数字格式化：1080 → 1,080；233800 → 23.4 万 */
  function fmtNum(n){
    n = Number(n) || 0;
    return n.toLocaleString("zh-CN");
  }
  function fmtWc(n){
    n = Number(n) || 0;
    if (n >= 100000000) return (n / 100000000).toFixed(1) + " 亿";
    if (n >= 10000) return (n / 10000).toFixed(1) + " 万";
    return n.toLocaleString("zh-CN");
  }

  /* ---------- 数据库汇总：笔记本 → 数据库简介 → 明细 ---------- */
  var NB_COLORS = ["#1B365D","#8C4A3C","#3E6B4F","#7A5C2E","#5A4A7A","#2E6E7E","#8A5A2B","#6B4E71"];
  var dbData = [], dbQuery = "", nbOpen = {}, dbOpen = {};

  function pool(items, limit, fn){
    var i = 0, out = new Array(items.length);
    function next(){
      if (i >= items.length) return Promise.resolve(out);
      var idx = i++;
      return Promise.resolve(fn(items[idx], idx)).then(function(v){
        out[idx] = v;
        return next();
      });
    }
    var runners = [];
    for (var k = 0; k < Math.min(limit, items.length); k++) runners.push(next());
    return Promise.all(runners).then(function(){ return out; });
  }

  /* 从 av 结构组装行：行隐含在各列的 values 里，用 blockID 对齐 */
  function avRows(av){
    var map = {}, seen = {}, order = [];
    (av.keyValues || []).forEach(function(col){
      var kid = col.key && col.key.id;
      if (!kid) return;
      (col.values || []).forEach(function(c){
        var rid = c.blockID || c.id;
        if (!rid) return;
        if (!map[rid]) map[rid] = {};
        if (!map[rid][kid]) map[rid][kid] = c;
      });
    });
    var first = (av.keyValues || []).filter(function(c){ return c.key && (c.values || []).length; })[0];
    if (first) {
      (first.values || []).forEach(function(c){
        var rid = c.blockID || c.id;
        if (rid && !seen[rid]) { seen[rid] = 1; order.push(rid); }
      });
    }
    Object.keys(map).forEach(function(rid){ if (!seen[rid]) { seen[rid] = 1; order.push(rid); } });
    return order.map(function(rid){ return { id: rid, cells: map[rid] || {} }; });
  }

  function cellText(type, cell){
    if (!cell) return "";
    var t = cell.type || type || "";
    if (t === "block") return (cell.block && cell.block.content) || "";
    if (t === "text") return (cell.text && cell.text.content) || "";
    if (t === "number") return (cell.number && cell.number.content != null && cell.number.content !== "") ? String(cell.number.content) : "";
    if (t === "select" || t === "mSelect") return (cell.mSelect || []).map(function(x){ return x.content; }).join(", ");
    if (t === "checkbox") return (cell.checkbox && cell.checkbox.checked) ? "✓" : "";
    if (t === "url") return (cell.url && cell.url.content) || "";
    if (t === "phone") return (cell.phone && cell.phone.content) || "";
    if (t === "email") return (cell.email && cell.email.content) || "";
    if (t === "date") {
      var v = cell.date && cell.date.content;
      if (!v) return "";
      var d = new Date(Number(v));
      return d.getFullYear() + "-" + ("0"+(d.getMonth()+1)).slice(-2) + "-" + ("0"+d.getDate()).slice(-2);
    }
    if (t === "template") return (cell.template && cell.template.content) || "";
    if (t === "created" || t === "updated") {
      var ts = cell[t];
      return ts ? new Date(Number(ts)).toLocaleDateString("zh-CN") : "";
    }
    if (t === "mAsset" || t === "asset") return ((cell.mAsset && cell.mAsset[0] && cell.mAsset[0].content) || (cell.asset && cell.asset.content) || "");
    return "";
  }

  function dbRowsHtml(d){
    var rows = d.rows || [], cols = d.cols || [];
    if (!rows.length) return '<div class="empty2">（无数据行）</div>';
    var cap = 60, h = "";
    rows.slice(0, cap).forEach(function(r){
      var cells = cols.map(function(c){ return cellText(c.type, r.cells[c.id]); });
      var first = cells[0] || "(空)";
      var rest = cells.slice(1).filter(Boolean).join(" · ");
      h += '<div class="dbRow"><span class="c1">' + esc(first) + '</span>'
         + (rest ? '<span class="c2">' + esc(rest) + '</span>' : '') + '</div>';
    });
    if (rows.length > cap) h += '<div class="empty2">…还有 ' + (rows.length - cap) + ' 行</div>';
    return h;
  }

  function dbMatches(d, q){
    if (!q) return true;
    var hay = (d.name + " " + d.nb + " " + (d.cols || []).map(function(c){ return c.name || ""; }).join(" ")).toLowerCase();
    return hay.indexOf(q) >= 0;
  }

  function paintDb(){
    var body = $("dbBody");
    var q = dbQuery.trim().toLowerCase();
    var list = dbData.filter(function(d){ return dbMatches(d, q); });
    var groups = [], gmap = {};
    list.forEach(function(d){
      var key = d.nb || "未分类";
      if (!gmap[key]) {
        gmap[key] = { name: key, items: [], color: NB_COLORS[groups.length % NB_COLORS.length] };
        groups.push(gmap[key]);
      }
      gmap[key].items.push(d);
    });
    var totalRows = list.reduce(function(s, d){ return s + (d.rows || []).length; }, 0);

    var h = '<div class="grid2"><div><b>' + list.length + '</b><span>数据库</span></div>'
          + '<div><b>' + totalRows + '</b><span>数据行</span></div></div>';
    if (!groups.length) h += '<div class="empty2">没有匹配的数据库。</div>';

    groups.forEach(function(g){
      var open = !!nbOpen[g.name] || q !== "";
      var gRows = g.items.reduce(function(s, x){ return s + (x.rows || []).length; }, 0);
      h += '<div class="nbGroup">'
         + '<div class="nbHead" data-nb="' + esc(g.name) + '">'
         + '<span class="nbDot" style="background:' + g.color + '"></span>'
         + '<span class="nbName" style="color:' + g.color + '">' + esc(g.name) + '</span>'
         + '<span class="nbCnt">' + g.items.length + ' 库 · ' + gRows + ' 行</span>'
         + '<span class="dbToggle">' + (open ? "▾" : "▸") + '</span>'
         + '</div>';
      if (open) {
        h += '<div class="nbBody" style="border-left-color:' + g.color + '">';
        g.items.forEach(function(d){
          var key = d.avId;
          var dOpen = !!dbOpen[key];
          var colNames = (d.cols || []).map(function(c){ return c.name; }).filter(Boolean).slice(0, 5).join(" · ");
          h += '<div class="dbItem">'
             + '<div class="dbHead" data-av="' + esc(key) + '">'
             + '<span class="dbToggle">' + (dOpen ? "▾" : "▸") + '</span>'
             + '<span class="dbName">' + esc(d.name) + '</span>'
             + '<span class="dbCnt">' + (d.rows || []).length + '行 · ' + (d.cols || []).length + '列</span>'
             + '</div>'
             + '<div class="dbBrief" title="' + esc(colNames) + '">' + (colNames ? esc(colNames) : "（无列）") + '</div>'
             + '<div class="dbRows" style="display:' + (dOpen ? "block" : "none") + '">' + dbRowsHtml(d) + '</div>'
             + '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
    });

    body.className = "";

    /* ---- 数据库：折叠看总量+标签，展开看完整 ----
       需求：卡片里只留「总数据量」和「标签」，
       搜索框和明细都收进展开态 / 悬停浮层。 */
    (function(){
      var detail = document.createElement("div");
      detail.className = "dbDetail";

      /* 浮层里的搜索框：显示在详情顶部。
         输入时同步到主搜索框并触发过滤，结果实时反映下面的列表。 */
      var searchWrap = document.createElement("div");
      searchWrap.className = "dbSearchWrap";
      var si = document.createElement("input");
      si.type = "text";
      si.className = "searchBox pvDbSearch";
      si.placeholder = "搜索数据库 / 笔记本 / 列名…";
      si.value = dbQuery || "";
      si.addEventListener("input", function(){
        dbQuery = si.value;
        var q = $("dbQ");
        if (q) q.value = si.value;
        paintDb();
        /* 重绘后搜索框会被重建，把焦点和光标位置还回来 */
        setTimeout(function(){
          var again = document.querySelector("#cardDb .pvDbSearch");
          if (again && document.activeElement !== again) {
            again.focus();
            try { again.setSelectionRange(again.value.length, again.value.length); } catch(e){}
          }
        }, 30);
      });
      searchWrap.appendChild(si);
      detail.appendChild(searchWrap);
      detail.insertAdjacentHTML("beforeend", h);

      var brief = document.createElement("div");
      brief.className = "dbBrief";

      /* 总量：数据库数 + 数据行数
         ⚠ d.rows 是**数组**（每行一个对象），不是数字 */
      var total = 0;
      list.forEach(function(d){ total += (d.rows || []).length; });
      brief.innerHTML = '<div class="grid2">'
        + '<div><b>' + fmtNum(list.length) + '</b><span>数据库</span></div>'
        + '<div><b>' + fmtNum(total) + '</b><span>数据行</span></div>'
        + '</div>';

      /* 标签（每个笔记本的彩色 chip）已按需求全部去掉 ——
         精简卡和详情卡里都不再显示，只保留数据总量和分组列表。 */

      body.innerHTML = "";
      body.appendChild(brief);
      body.appendChild(detail);
    })();
    if ($("dbAt")) $("dbAt").textContent = "实时";
  }

  function renderDb(){
    var body = $("dbBody"), at = $("dbAt");
    body.className = "empty";
    body.innerHTML = "读取数据库列表…";
    Promise.all([
      sql("SELECT id, hpath, box FROM blocks WHERE type='av' ORDER BY updated DESC"),
      syPost("/api/notebook/lsNotebooks", {})
    ]).then(function(r){
      var blocks = r[0] || [], nbMap = {};
      ((r[1] && r[1].notebooks) || []).forEach(function(n){ if (n && n.id) nbMap[n.id] = (n.name || "").trim() || "未命名"; });
      if (!blocks.length) { dbData = []; paintDb(); return; }

      body.innerHTML = "解析 " + blocks.length + " 个数据库块…";
      var seen = {};
      return pool(blocks, 5, function(b){
        return syPost("/api/block/getBlockKramdown", { id: b.id }).then(function(d){
          var m = /data-av-id="([^"]+)"/.exec(String((d && d.kramdown) || ""));
          if (!m || seen[m[1]]) return null;
          seen[m[1]] = 1;
          var parts = String(b.hpath || "").split("/").filter(Boolean);
          return { avId: m[1], name: parts.length ? parts[parts.length - 1] : "未命名", nb: nbMap[b.box] || "未分类" };
        }).catch(function(){ return null; });
      }).then(function(items){
        var valid = items.filter(Boolean);
        body.innerHTML = "读取 " + valid.length + " 个数据库的内容…";
        return pool(valid, 4, function(it){
          return syPost("/api/av/getAttributeView", { id: it.avId }).then(function(x){
            var av = x && x.av;
            if (!av) return null;
            it.name = (av.name || "").trim() || it.name;
            it.cols = (av.keyValues || []).map(function(c){ return c.key; }).filter(Boolean);
            it.rows = avRows(av);
            return it;
          }).catch(function(){ return null; });
        });
      }).then(function(list){
        dbData = list.filter(Boolean);
        paintDb();
      });
    }).catch(function(e){ fail(body, at, e); });
  }

  /* 笔记本 / 数据库 两级点击展开 */
  $("dbBody").addEventListener("click", function(ev){
    var t = ev.target;
    if (!t || !t.closest) return;
    var nb = t.closest(".nbHead");
    if (nb) { nbOpen[nb.getAttribute("data-nb")] = !nbOpen[nb.getAttribute("data-nb")]; paintDb(); return; }
    var dh = t.closest(".dbHead");
    if (dh) { dbOpen[dh.getAttribute("data-av")] = !dbOpen[dh.getAttribute("data-av")]; paintDb(); }
  });

  /* 搜索框（只过滤，不重建输入框） */

  /* ---------- AI 生成今日待办（与主窗口同一套规则） ---------- */
  function todoHint(msg, color){
    var el = $("todoHint");
    if (!el) return;
    /* ⚠ 刚点了「开始」时，后台推送完成会紧跟着弹「已推送 N 个项目」，
       把「开始：45 分钟 · xxx」这条更重要的提示盖掉 ——
       用户看到的就是「点了开始没反应」。
       这里给「开始」类提示留 6 秒的保护期，期间推送类提示不抢位。 */
    try {
      var now = Date.now();
      if (window.__hintGuardUntil && now < window.__hintGuardUntil
          && /已推送|已拉取|已合并/.test(String(msg || ""))) {
        return;
      }
      if (/^开始/.test(String(msg || ""))) {
        window.__hintGuardUntil = now + 6000;
      }
    } catch(e){}
    el.textContent = msg || "";
    el.style.color = color || "#8b4513";
    /* 回写主界面状态栏，两边看到同一个结果 */
    try {
      localStorage.setItem("dsh.worktable.syncResult.v1", JSON.stringify({
        msg: msg || "", at: Date.now(),
        reload: /已推送|已拉取|已按云端|已合并|写入/.test(msg || "")
      }));
    } catch(e){}
  }
  function genTodos(){
    var c = cfg();
    if (!c.aiKey) { todoHint("先在主窗口「设置」→「AI 待办引擎」填 API Key"); return; }
    var btn = $("btnGen");
    if (btn.disabled) return;
    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = "生成中…";
    /* 未完成的旧待办：原样保留，新任务追加在后 */
    var raw0 = readSnapshot();
    var carried = [];
    if (raw0 && Array.isArray(raw0.items)) {
      raw0.items.forEach(function(t){
        var subs = t.subs || [];
        var done = subs.length ? subs.every(function(s){ return s.done; }) : !!t.done;
        if (done) return;
        carried.push(t);   /* 原样保留：不改日期、不丢历史 */
      });
    }
    todoHint(carried.length ? ("保留 " + carried.length + " 项未完成，正在追加新任务…") : "读取周报…");

    fetch("http://127.0.0.1:3918/weekly", { cache: "no-store" })
      .then(function(r){ return r.ok ? r.text() : ""; })
      .catch(function(){ return ""; })
      .then(function(html){
        var wk = "";
        if (html) {
          var doc = new DOMParser().parseFromString(html, "text/html");
          var head = ((doc.querySelector(".sub") || {}).textContent || "").trim();
          var parts = [];
          [].slice.call(doc.querySelectorAll(".panel")).forEach(function(p){
            var t = ((p.querySelector("h3") || {}).textContent || "").trim();
            var li = [].slice.call(p.querySelectorAll("li")).map(function(x){
              return x.textContent.replace(/^[·\s]+/, "").trim();
            }).filter(Boolean);
            if (t && li.length) parts.push(t + "：" + li.join("；"));
          });
          wk = (head ? "本周主线：" + head + "\n" : "") + parts.join("\n");
        }
        if (!wk) wk = "（周报暂时取不到，请根据笔记标题谨慎推断）";
        todoHint("AI 生成中…");
        /* 用近期真实执行力约束今天的量 */
        var cap = null;
        try { cap = JSON.parse(localStorage.getItem("dsh.worktable.capacity.v1") || "null"); } catch(e){}
        var capLine = (cap && cap.days && cap.days.length)
          ? "6) 参考近期执行力：最近 " + cap.days.length + " 天平均每天完成 " + cap.avgTasks
            + " 项、投入 " + cap.avgMins + " 分钟、完成率 " + cap.avgScore
            + "%，今天请按这个强度安排，宁可少而做完，不要超量；"
          : "6) 保持和平时相当的工作量，宁可少而做完；";        /* 取材范围：主界面「指定取材范围」选中的文档 */
        var scopeNames = [];
        try { scopeNames = JSON.parse(localStorage.getItem("dsh.worktable.scope.v1") || "[]") || []; } catch(e){}
        if (scopeNames.length) todoHint("读取指定文档…");
        return (scopeNames.length ? loadScopeDocs(scopeNames) : Promise.resolve("")).then(function(scopeText){
        var projNames = topDocs.map(function(d){ return d.name; }).slice(0, 40).join("、");
        var sys = "你是任务拆解助手。根据用户这一周的周报总结，拆出「今天一天就能做完」的待办。"
          + "硬规则：1) 只给 3~5 条，每条 30~120 分钟能做完；"
          + "2) 用大白话说清「做什么 + 做到什么程度」，禁用「学习/掌握/梳理/提升」这类空词；"
          + "3) 每条给 1~3 个能立刻动手的动作；"
          + "4) 每条给量化：mins=预计分钟（10~120，取 5 的倍数）、level=难度 1~5；"
          + capLine
          + (carried.length
              ? ("7) 今天已有 " + carried.length + " 项没做完的任务顺延过来："
                 + carried.map(function(t){ return t.name; }).join("；")
                 + "。请只补 " + Math.max(1, 4 - carried.length) + " 项【新的】，不要和上面重复；")
              : "")
          + "5) 每条给 project=它属于哪个项目，必须从这份顶层文档名单里原样挑一个（一字不差），挑不出来就填空字符串："
          + (projNames || "（暂无）") + "；"
          + (scopeNames.length
              ? ("★ 本次已限定取材范围：只允许从这几篇笔记文档的内容里拆任务，禁止跳出这些文档：" + scopeNames.join("、") + "；")
              : "")
          + '只返回 JSON：{"summary":"一句话说清今天先干什么","phases":[{"name":"今日待办","color":"#4f8ef7","items":[{"name":"标题(大白话，≤20字)","why":"为什么今天做","how":"怎么做","project":"顶层文档名或空字符串","mins":45,"level":3,"steps":["动作1","动作2"]}]}]}。不要输出 JSON 以外的内容。';
        return fetch(c.aiBase, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + c.aiKey },
          body: JSON.stringify({
            model: c.aiModel,
            messages: [{ role: "system", content: sys }, { role: "user", content: "本周周报：\n" + wk + (scopeText ? ("\n\n【指定取材的文档原文】\n" + scopeText) : "") }],

      })
      .then(function(r){
        if (!r.ok) {
          return r.text().then(function(t){ throw new Error("AI HTTP " + r.status + "（" + String(t).slice(0, 100) + "）"); });
        }
        return r.json();
      })
      .then(function(j){
        var txt = ((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "").trim();
        txt = txt.replace(/^```(?:json)?/i, "").replace(/```$/, "").trim();
        var obj = null;
        try { obj = JSON.parse(txt); } catch(e) {
          var m = txt.match(/\{[\s\S]*\}/);
          if (m) try { obj = JSON.parse(m[0]); } catch(e2){}
        }
        if (!obj || !obj.phases) throw new Error("AI 未返回有效待办");
        var items = [];
        (obj.phases || []).forEach(function(p){
          (p.items || []).forEach(function(it){
            items.push({
              name: it.name, why: it.why || "", how: it.how || "", phase: p.name || "今日待办", date: todayStr(),
              project: it.project || "",
              mins: (it.mins != null && !isNaN(it.mins)) ? Math.max(5, Math.round(+it.mins)) : null,
              level: (it.level != null && !isNaN(it.level)) ? Math.min(5, Math.max(1, Math.round(+it.level))) : null,
              subs: (it.steps || []).map(function(s){ return { text: String(s), done: false }; })

        if (!items.length && !carried.length) throw new Error("AI 返回的待办为空");
        /* 顺延的排前面，新增的按名字去重后追加 */
        var seen = {};
        carried.forEach(function(t){ seen[t.name] = 1; });

        localStorage.setItem(TODOS_KEY, JSON.stringify({

        }));

        pushTodos(true).then(function(){
          todoHint("已顺延 " + carried.length + " 项、新增 " + fresh.length + " 项", "#2f7a4f");
        });
      })
      .catch(function(e){ todoHint("生成失败：" + ((e && e.message) || e)); })
      .then(function(){ btn.disabled = false; btn.textContent = old; });
  }
  /* ---------- 手动指定今日待办（不走 AI，顺序自己定） ---------- */

  /* ---------- 推送到服务器端的思源笔记 ---------- */
  /* ⚠ 不再硬编码服务器地址（仓库是公开的）。远端思源在「设置 → 周报数据源」
     里填一次，存进 wsBase；留空就只用本地思源。 */
  var REMOTE_NB_NAME = "每日待办";

  function remoteCfg(){
    var c = cfg();
    return {
      base: String(c.wsBase || "").trim().replace(/\/+$/, ""),
      token: String(c.wsToken || "").trim()
    };
  }
  /* 本地思源：写到「个人 / 日常记录 / 待办」下 */
  var LOCAL_NB_NAME = "个人";
  var LOCAL_ROOT = "/日常记录/待办";
  function localCfg(){
    var c = cfg();
    return {
      base: String(c.base || "http://127.0.0.1:6806").trim().replace(/\/+$/, ""),
      token: String(c.token || "").trim(),
      nbName: LOCAL_NB_NAME,     /* 指定笔记本 */
      rootPath: LOCAL_ROOT       /* 文档根路径 */
    };
  }
  /* 全局并发闸门：同一时刻最多 3 个远端请求，避免把服务器打挂 */
  var RP_MAX = 3, rpActive = 0, rpQueue = [];
  function rpAcquire(){
    if (rpActive < RP_MAX) {
      rpActive++;
      return Promise.resolve();
    }
    return new Promise(function(res){ rpQueue.push(res); });
  }
  function rpRelease(){
    rpActive--;
    var next = rpQueue.shift();
    if (next) { rpActive++; next(); }
  }

  function rPost(rc, path, body){
    if (!rc.token) return Promise.reject(new Error("远端服务器令牌未配置（设置 → 周报数据源）"));
    return rpAcquire().then(function(){
      return rPostRaw(rc, path, body);
    }).then(function(v){ rpRelease(); return v; },
            function(e){ rpRelease(); throw e; });
  }

  function rPostRaw(rc, path, body){
    /* 15 秒超时，避免远端不稳时永久卡住 */
    var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
    var timer = null;
    var opts = {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Token " + rc.token },
      body: JSON.stringify(body || {})
    };
    if (ctrl) {
      opts.signal = ctrl.signal;
      timer = setTimeout(function(){ try { ctrl.abort(); } catch(e){} }, 15000);
    }
    function clear(){ if (timer) { clearTimeout(timer); timer = null; } }
    return fetch(rc.base + path, opts).then(function(r){
      clear();
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function(j){
      if (j && j.code !== 0) throw new Error(j.msg || ("code " + j.code));
      return j.data;
    }).catch(function(e){
      clear();
      if (e && e.name === "AbortError") throw new Error("请求超时（15 秒）");
      throw e;
    });
  }
  function todayStr(){
    var d = new Date();
    function p(n){ return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  function pad2(n){ return (n < 10 ? "0" : "") + n; }
  function fmtDT(d){
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " "
      + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) + ":" + pad2(d.getSeconds());
  }
  /* 番茄行的结束时间只保留「时:分:秒」。
     同一天的番茄没必要重复写日期：
       🍅60,2026-09-15 10:13:10~11:13:10   ← 想要的样子
       🍅60,2026-09-15 10:13:10~2026-09-15 11:13:10  ← 老格式（解析端仍兼容） */
  function pomoEndShort(e){
    var s = String(e || "").trim();
    var m = /^\d{4}-\d{2}-\d{2}\s+(\d{1,2}:\d{2}(?::\d{2})?)$/.exec(s);
    return m ? m[1] : s;
  }
  /* 把 📅 后面那一串解析成完整日期数组：
       2026-09-08                      → ["2026-09-08"]
       2026-09-08, 2026-09-11~09-13    → ["2026-09-08","2026-09-11","2026-09-12","2026-09-13"]
     区间会被展开成逐个日期，方便统一处理；写回时再压缩成区间。 */
  function parseDateExpr(expr){
    var out = [];
    String(expr || "").split(/\s*,\s*/).forEach(function(seg){
      seg = seg.trim();
      if (!seg) return;
      var m = /^(\d{4})-(\d{2})-(\d{2})(?:\s*~\s*(\d{2})-(\d{2}))?/.exec(seg);
      if (!m) return;
      var y = +m[1], mo = +m[2], d = +m[3];
      var q = function(n){ return (n < 10 ? "0" : "") + n; };
      if (!m[4]) { out.push(m[1] + "-" + m[2] + "-" + m[3]); return; }
      /* 有区间：从起日逐日推到止日 */
      var endY = y, endM = +m[4], endD = +m[5];
      if (endM < mo) endY = y + 1;          /* 跨年：11-28~01-03 这种 */
      var cur = Date.UTC(y, mo - 1, d), end = Date.UTC(endY, endM - 1, endD);
      var guard = 0;
      while (cur <= end && guard++ < 400) {
        var dt = new Date(cur);
        out.push(dt.getUTCFullYear() + "-" + q(dt.getUTCMonth()+1) + "-" + q(dt.getUTCDate()));
        cur += 86400000;
      }
    });
    return out;
  }
  /* 把日期数组格式化成 📅 后面那一串：
       2026-09-08                      单日
       2026-09-08, 2026-09-11~09-13    多个日期 / 区间
     规则：
       · 先去重、按时间排序
       · 连续三天及以上的合并成区间，第二段起省略年份和月份（~09-13）
       · 不连续的日期用「, 」分隔，每段都带完整年份 */
  function formatDateList(dates){
    var arr = (dates || []).filter(function(d){ return /^\d{4}-\d{2}-\d{2}$/.test(d); });
    if (!arr.length) return "";
    arr = arr.slice().sort();
    /* 去重 */
    arr = arr.filter(function(d, i){ return i === 0 || d !== arr[i-1]; });
    /* 把连续日期分组 */
    function toT(d){ var p = d.split("-"); return Date.UTC(+p[0], +p[1]-1, +p[2]); }
    function fromT(t){
      var x = new Date(t), q = function(n){ return (n < 10 ? "0" : "") + n; };
      return x.getUTCFullYear() + "-" + q(x.getUTCMonth()+1) + "-" + q(x.getUTCDate());
    }
    var DAY = 86400000, groups = [], cur = [arr[0]];
    for (var i = 1; i < arr.length; i++) {
      if (toT(arr[i]) - toT(arr[i-1]) === DAY) cur.push(arr[i]);
      else { groups.push(cur); cur = [arr[i]]; }
    }
    groups.push(cur);
    return groups.map(function(g){
      if (g.length === 1) return g[0];
      if (g.length === 2) return g[0] + ", " + g[1];     /* 两天不压缩，直接列 */
      /* 三天及以上 → 区间，第二段省略年份和月份 */
      return g[0] + "~" + g[g.length-1].slice(5);
    }).join(", ");
  }
  function taskDone(t){
    var subs = t.subs || [];
    if (subs.length) return subs.every(function(x){ return x.done; });
    return !!t.done;
  }
  /* ---------- 按 bullet-journal 规范生成项目任务（不含项目标题行） ----------
     任务行：名称 📋 @L1 ⏱分钟数   （任务不挂日期；⏱ 是 AI 预估工时）
     事项行：名称 📅日期 [🔥] [✅]  （事项必须带日期）
     番茄行：🍅N,开始~结束 说明     （独立块，紧跟事项）

     ⚠ 工时必须写进文档：之前只存在快照里，快照一旦重建就全丢，
       评分公式的「预计总工时」变成 0 → 分数永远是 0。 */
  function buildProjectBody(project, items, date, prevDoneAt, delLogs){
    var lines = [];
    /* 已删除的番茄（delLogs 墓碑）不再写进正文 */
    function isDead(it, l){
      return (delLogs || []).some(function(d){
        return d.name === it.name &&
               Number(d.min) === Number(l.min) &&
               String(d.start || "").trim() === String(l.start || "").trim();
      });
    }
    var isDeadFn = isDead;
    items.forEach(function(t){
      /* 过滤掉墓碑里的番茄 */
      var logs = (t.logs || []).filter(function(l){ return !isDeadFn(t, l); });
      var notes = t.notes || [];
      /* 未完成的任务一律挂今天的日期：它今天还要做，不是昨天的遗留。
         已完成的保留原日期，这样历史记录不会被改到明天。 */
      var d1 = date;
      if (taskDone(t) && t.date && t.date <= date) d1 = t.date;
      /* 状态标记按象限写：🔥 重要紧急 / 🌱 重要不紧急 / 🍃 紧急不重要 / 空 */
      var _mk = quadMark(t);
      var imp = _mk ? (" " + _mk) : "";
      /* 任务头（不带日期），把预估工时也带上，文档即备份 */
      var minsTag = Number(t.mins) > 0 ? (" ⏱" + Math.round(Number(t.mins))) : "";
      lines.push(t.name + " 📋 @L1" + minsTag);
      lines.push("");
      /* 番茄按 step 归属分组：logs[i].si 指向第几个步骤 */
      var byStep = {}, loose = [];
      logs.forEach(function(l){
        if (l && typeof l.si === "number" && (t.subs || [])[l.si]) (byStep[l.si] = byStep[l.si] || []).push(l);
        else loose.push(l);
      });
      function pomoLine(l){
        /* 番茄行：🍅60,2026-09-15 10:13:10~11:13:10 说明
           结束时间只写「时:分:秒」——同一天，前面的日期是冗余的。
           （老文档里存的是完整日期，解析端两种格式都认。） */
        return "🍅" + l.min + "," + l.start + "\\~" + pomoEndShort(l.end) + (l.text ? " " + l.text : "");
      }
      /* 每个步骤一行勾选框，番茄紧跟其后缩进一级。
         ⚠ 日期必须**按步骤**取，且要能跨多天：
         写法形如  📅2026-09-08, 2026-09-11~09-13
         意思是这一步在 9-08 做过、9-11 到 9-13 也在做。
         每一步各自保留自己的日期列表，不能被任务的单一日期覆盖。 */
      /* ⚠ 写入前先去重：同名步骤只写一次。
         历史数据里同一个任务下可能残留两行一样的步骤，
         原样写回去会让重复不断累积，而解析时又分不清哪条是真的，
         表现出来就是「改了又变回去」。 */
      var subsRaw = (t.subs && t.subs.length) ? t.subs : [{ text: t.name, done: taskDone(t) }];
      var _seenSub = {}, subs = [];
      subsRaw.forEach(function(s){
        var k = String((s && s.text) || "").trim();
        if (!k) return;
        if (_seenSub[k] !== undefined) {
          /* 已存在：合并 —— 任一完成即完成，日期取较晚，dates 取并集 */
          var prev = subs[_seenSub[k]];
          if (s.done) prev.done = true;
          if (s.doneAt && (!prev.doneAt || s.doneAt > prev.doneAt)) prev.doneAt = s.doneAt;
          var m2 = (prev.dates || []).slice();
          (s.dates || []).forEach(function(x){ if (m2.indexOf(x) < 0) m2.push(x); });
          m2.sort();
          if (m2.length) prev.dates = m2;
          return;
        }
        _seenSub[k] = subs.length;
        subs.push(s);
      });
      if (!subs.length) subs = subsRaw;
      subs.forEach(function(s, si){
        /* 这一步的日期表达式，优先级从高到低：
