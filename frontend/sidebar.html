           ① 步骤自己的 dates（多日期数组，最完整）
           ② 步骤自己的 date（单日，老数据）
           ③ 已完成 → doneAt（真实完成那天）
           ④ 文档里上一版写的完成日
           ⑤ 任务原始日期
           ⑥ 兜底今天
         关键：**取消勾选不会改变日期**。取消只去掉 ✅/[x]，
         日期列表原样保留，所以 9-08 + 9-11~9-13 这种跨度不会塌成今天。 */
        var sdates = [];
        if (Array.isArray(s.dates) && s.dates.length) sdates = s.dates.slice();
        if (!sdates.length && s.date && /^\d{4}-\d{2}-\d{2}$/.test(s.date)) sdates = [s.date];
        if (!sdates.length && s.done) {
          var at = s.doneAt;
          if (!at && prevDoneAt) at = prevDoneAt[s.text];
          if (at && /^\d{4}-\d{2}-\d{2}$/.test(at)) sdates = [at];
        }
        if (!sdates.length && t.date && /^\d{4}-\d{2}-\d{2}$/.test(t.date) && t.date <= date) sdates = [t.date];
        if (!sdates.length) sdates = [date];
        var sd = formatDateList(sdates);
        /* 已完成的行尾打 ✅（不带日期，日期已经在 📅 里） */
        var mark = s.done ? " ✅" : "";
        /* 部分进度：未完成但有 pct 时写 ◐40%。
           ⚠ 必须写进文档 —— pct 只存在快照里的话，
             任何一次「从文档重建快照」都会把进度抹掉。 */
        var pctTag = "";
        if (!s.done) {
          var pnum = Number(s.pct);
          if (isFinite(pnum) && pnum > 0 && pnum < 100) pctTag = " ◐" + Math.round(pnum) + "%";
        }
        lines.push((s.done ? "- [x] " : "- [ ] ") + s.text + " 📅" + sd + imp + pctTag + mark);
        /* 这一步的番茄：缩进的子项，紧贴在这一步正下方 */
        (byStep[si] || []).forEach(function(l){
          lines.push("    - " + pomoLine(l));
        });
      });
      /* 没有归属步骤的番茄挂在任务末尾 */
      if (loose.length) {
        lines.push("");
        loose.forEach(function(l){ lines.push(pomoLine(l)); });
      }
      /* 备注 */
      (t.notes || []).forEach(function(n){
        lines.push("⏳ " + n.text);
      });
      lines.push("");
    });
    while (lines.length && lines[lines.length - 1] === "") lines.pop();
    return lines.join("\n");
  }

  function splitBlocks(md){
    var blocks = [], cur = [];
    String(md || "").split(/\r?\n/).forEach(function(l){
      if (l.trim() === "") { if (cur.length) { blocks.push(cur); cur = []; } }
      else cur.push(l);
    });
    if (cur.length) blocks.push(cur);
    return blocks;
  }

  /* 重写子文档前，先保留其它日期的内容，丢掉今天的那部分（任务头一并丢） */
  /* 重写文档前调用：把「即将被重写的日期」那部分整段丢掉，其它日期的内容原样保留。
     关键：任务头（含 📋 的块）跟着它下面的步骤块走，不能单独留下或单独丢弃。 */
  function keepOtherDays(md, dates, killNames, liveNames, stepNames){
    var blocks = splitBlocks(md), out = [], i = 0;

    function isHead(b){
      return /📋/.test(String(b.join(" ")));
    }
    function isStep(b){
      return /^- \[[ xX]\]/.test(String(b[0] || "").trim());
    }
    function isRec(b){
      /* 顶格的 🍅/⏳，以及缩进的子项 "- 🍅…"（步骤级番茄）都算记录 */
      var t0 = String(b[0] || "").trim();
      return /^[🍅⏳]/.test(t0) || /^-\s+[🍅⏳]/.test(t0);
    }

    while (i < blocks.length) {
      var b = blocks[i];
      var first = String(b[0] || "").trim();

      /* 文档标题层级：整体丢弃（外层会重新写 ## 项目名） */
      if (/^#{1,6}\s/.test(first)) { i++; continue; }

      /* 番茄记录 / 备注：独立块，不属于任何任务段，始终保留 */
      if (isRec(b)) {
        out.push(b);
        i++;
        continue;
      }

      /* —— 任务段：从任务头开始，只收集其后的步骤块（番茄/备注不归入） —— */
      if (isHead(b)) {
        var seg = [b], j = i + 1;
        while (j < blocks.length && !isHead(blocks[j]) && !isRec(blocks[j])) {
          seg.push(blocks[j]);
          j++;
        }
        /* 该任务属于哪个日期：优先取步骤行上的 📅，没有就取块内第一个日期 */
        var segText = seg.map(function(x){ return x.join(" "); }).join(" ");
        var dm = /📅\s*(\d{4}-\d{2}-\d{2})/.exec(segText);
        var segDate = dm ? dm[1] : null;
        /* 任务名：取任务头块里 📋 之前的部分 */
        var headTxt = String(b.join(" ")).replace(/📋.*/, "").trim();
        var isDead = !!(killNames && killNames[headTxt]);
        if (isDead) {
          /* 已归档：丢掉任务头和步骤（番茄/备注已在上面独立保留） */
        } else if (liveNames && liveNames[headTxt]) {
          /* 这条任务这次正在重写 → 旧的那份（不管挂哪天）丢掉。
             番茄/备注不在这段里（上面的 while 遇到 isRec 就停了），
             它们是过去真实发生过的记录，原样留在文档里。 */
        } else if (!segDate || !dates[segDate]) {
          /* 不属于要重写的日期 → 整段原样保留 */
          seg.forEach(function(x){ out.push(x); });
        }
        /* 属于要重写的日期 → 整段丢弃（后面会用新内容补上） */
        i = j;
        continue;
      }

      /* —— 游离的步骤行：一律丢弃 ——
         走到这里说明这一行是顶格的 `- [ ] xxx`，而它前面没有任务头。
         正常情况下步骤一定挂在某个任务头（含 📋）下面，
         没有头的步骤就是历史写入留下的脏数据：
           · 任务头丢了 → 它悬空
           · 或者 buildProjectBody 已经把它重新写进任务里 → 重复
         两种都该清掉。以清掉为准 —— 保留下来只会被解析成
         一条「同名任务」，让云端永远比本地多几条。 */
      if (isStep(b)) { i++; continue; }

      /* 其余游离内容（备注等）：保留 */
      out.push(b);
      i++;
    }
    return out;
  }

  function groupByProject(items){
    var groups = [], gmap = {};
    items.forEach(function(t){
      var pj = String(t.project || "").trim() || "未归类";
      if (!gmap[pj]) { gmap[pj] = { name: pj, items: [] }; groups.push(gmap[pj]); }
      gmap[pj].items.push(t);
    });
    return groups;
  }

  function ensureNotebook(rc){
    var want = String(rc.nbName || REMOTE_NB_NAME);
    return rPost(rc, "/api/notebook/lsNotebooks", {}).then(function(d){
      var nbs = (d && d.notebooks) || [];
      var hit = nbs.filter(function(n){ return (n.name || "").trim() === want; })[0];
      if (hit) return hit.id;
      return rPost(rc, "/api/notebook/createNotebook", { name: want }).then(function(x){
        var id = x && x.notebook && x.notebook.id;
        if (!id) throw new Error("创建笔记本失败");
        return id;
      });
    });
  }

  function safeName(s){ return String(s).replace(/[\/\\]/g, "／"); }

  /* 任务写在项目文档里：<根路径>/<项目名>；云端根路径为空，本地是 /日常记录/待办 */
  function docPathFor(project, root){
    var base = String(root || "").replace(/\/+$/, "");
    return base + "/" + safeName(project);
  }

  function ensureDoc(rc, nbId, hpath, markdown){
    var esc = hpath.replace(/'/g, "''");
    return rPost(rc, "/api/query/sql", {
      stmt: "SELECT id FROM blocks WHERE type='d' AND box='" + nbId + "' AND hpath='" + esc + "'"
    }).then(function(rows){
      if (rows && rows[0] && rows[0].id) return rows[0].id;
      return rPost(rc, "/api/filetree/createDocWithMd", {
        notebook: nbId, path: hpath, markdown: markdown || ""
      }).then(function(id){
        if (!id) throw new Error("创建文档失败：" + hpath);
        return id;
      });
    });
  }

  /* 父文档就是项目文档，任务直接写在它里面 */
  function ensureProjectDoc(rc, nbId, project){
    return ensureDoc(rc, nbId, docPathFor(project, rc.rootPath), "## " + project);
  }

  /* 安全闸：写入前确认目标文档属于「待办」范围。
     凡是文档里已经有 📋 任务、或者本来就是空文档，放行；
     如果它是一篇有正文却没有任务的普通笔记，说明项目名撞上了
     用户的真实文档名（仪表盘 / DIY / 日常记录…），必须拒绝覆盖。 */
  function assertSafeTarget(rc, docId){
    return rPost(rc, "/api/export/exportMdContent", { id: docId }).then(function(x){
      var md = String((x && x.content) || "");
      var body = md.replace(/^---[\s\S]*?---\r?\n/, "").trim();
      /* 只有标题和零宽字符 → 空白容器，可以安全写入 */
      var meaningful = body
        .split(/\r?\n/)
        .filter(function(l){
          var t = l.trim();
          if (!t) return false;
          if (/^#{1,6}\s/.test(t)) return false;      /* 标题行 */
          if (/^[\u200b\u200c\u200d\ufeff\s]+$/.test(t)) return false;  /* 零宽字符 */
          /* 步骤 / 番茄 / 备注行属于待办内容，不算「真实正文」 */
          if (/^-\s*\[[ xX]\]\s*\S/.test(t)) return false;
          if (/^-\s*🍅\s*\d+/.test(t)) return false;
          if (/^⏳\s*\S/.test(t)) return false;
          return true;
        });
      if (mdHasTask(md)) return true;                 /* 本来就是待办文档 */
      if (!meaningful.length) return true;            /* 空白容器，可写 */
      return false;                                   /* 有真实正文 → 拒绝 */
    });
  }

  /* 把待办推送到指定思源：rc = {base, token, label, cleanup, onlyProjects} */
  function pushTodosTo(rc, silent, label){
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items.length) { todoHint("还没有待办可推送"); return Promise.resolve({ok:0,fail:0}); }
    /* 只推指定项目（本地轮询发现某项目变了就只推它，其余不动）。
       但如果这些项目里还有历史任务，也要一起带上，否则历史会从文档里消失。
       ⚠ 项目名的算法必须和 renderTodos / changedProjectsNow **完全一致**：
         String(t.project || "").trim() || inferProject(t.name) || "未归类"
       以前这里只写 it.project || "未归类"，而签名那边带 inferProject 兜底，
       两边算出的名字对不上 → keep 里一个都匹配不到 → items 被过滤成空，
       于是每次「只推某个项目」都变成什么都推不出去（或者退回全量）。 */
    function projOfTask(it){
      return String((it && it.project) || "").trim() || inferProject(it && it.name) || "未归类";
    }
    if (rc.onlyProjects && rc.onlyProjects.length) {
      var keep = {};
      rc.onlyProjects.forEach(function(n){ keep[n] = 1; });
      /* ⚠ 不要再「把含历史任务的项目也一起带上」：
         历史 = 更早日期且步骤全勾完的任务，几乎每个项目都有，
         于是这个兜底会把 keep 撑成全量 —— 一次勾选又把六个文档全重写。
         真正需要的是：只推指定的那几个项目文档，
         文档里本来就保留着它自己的历史（buildProjectBody 按 date 分组生成），
         不需要靠「顺带推别的项目」来保住历史。 */
      raw = Object.assign({}, raw, {
        items: (raw.items || []).filter(function(it){ return keep[projOfTask(it)]; })
      });
      if (!raw.items.length) return Promise.resolve({ ok: 0, fail: 0 });
    }

    var btn = $("btnPush");
    /* 按钮文字固定还原成 ↑，不要用「读旧值再写回」——
       如果上一次卡住没还原，old 就会是「推送中…」，
       于是每次都把「推送中…」原样写回去，永远卡着。 */
    var PUSH_ICON = "↑";
    if (btn) { btn.disabled = true; btn.textContent = "推送中…"; }
    /* 超时保护：180 秒内没结束就恢复按钮（项目多时远端较慢） */
    var doneFlag = false;
    var guard = setTimeout(function(){
      if (doneFlag) return;
      doneFlag = true;                       /* 标记已处理，避免后面又覆盖 */
      todoHint("推送仍在进行（已超过 3 分钟），可稍后查看云端", "#d9a015");
      if (btn) { btn.disabled = false; btn.textContent = PUSH_ICON; }
    }, 180000);
    if (!silent) todoHint("推送到 " + (label || rc.base) + " …");

    var date = todayStr();
    var groups = groupByProject(raw.items);
    var ok = 0, fail = 0;

    var nbIdOut = null;
    return ensureNotebook(rc).then(function(nbId){
      nbIdOut = nbId;
      return groups.reduce(function(p, g){
        return p.then(function(){
          return ensureProjectDoc(rc, nbId, g.name).then(function(id){
            /* 写入前的安全闸：目标若是真实笔记（有正文且没有📋），直接放弃，
               绝不能因为项目名撞车就把别人的笔记覆盖掉 */
            return assertSafeTarget(rc, id).then(function(safe){
              if (!safe) {
                try { console.warn("[push] 跳过「" + g.name + "」：目标是真实笔记，不是待办文档"); } catch(e){}
                return null;
              }
              return rPost(rc, "/api/export/exportMdContent", { id: id }).then(function(x){
              var oldMd = (x && x.content) || "";
              /* 去掉 YAML 头部，可能有多段残留，循环剥干净 */
              oldMd = oldMd.replace(/^\uFEFF?/, "");
              var guardHead = 0;
              while (guardHead++ < 5 && /^---\r?\n[\s\S]*?---\r?\n/.test(oldMd)) {
                oldMd = oldMd.replace(/^---\r?\n[\s\S]*?---\r?\n/, "");
              }
              /* 历史上重复推送把 YAML 头抄进了正文中间，还会留一段空的
                 `--- ... ---`。它们会被当成独立块挡在 🍅 和任务头之间，
                 导致周报把番茄记到「未命名」下、任务数算成 0。这里全局清掉。 */
              oldMd = oldMd.replace(/^---$[\s\S]*?^---$/gm, "");
              oldMd = oldMd.replace(/^(?:---\s*)$/gm, "");
              oldMd = oldMd.replace(/\n{3,}/g, "\n\n");
              /* 从文档里读出「每步哪天完成的」，写回正文时沿用，
                 否则快照里 doneAt 一旦为空就会把文档里的日期抹掉。
                 格式：- [x] 步骤文字 📅... ✅MM-DD */
              var prevDoneAt = {};
              oldMd.split(/\r?\n/).forEach(function(ln){
                var m = /^\s*-\s*\[[ xX]\]\s*(.*?)\s*📅\s*(\d{4})-(\d{2})-(\d{2})[^\n]*?✅\s*(\d{2})-(\d{2})\s*$/.exec(ln);
                if (m) prevDoneAt[m[1]] = m[2] + "-" + m[5] + "-" + m[6];
              });

              /* —— 快照里没有的番茄，从文档里补回任务 ——
                 （快照被清空过 / 换端后第一次推送时会发生）
                 不补的话，buildProjectBody 写出的正文没有番茄，
                 keepOtherDays 又把旧番茄留在原处，位置就乱了。 */
              try {
                var docLogsByTask = {};
                var dTask = null, dSubIdx = -1;
                oldMd.split(/\r?\n/).forEach(function(ln){
                  var t0 = ln.trim();
                  if (t0.indexOf("📋") >= 0) { dTask = t0.replace(/📋.*/, "").trim(); dSubIdx = -1; return; }
                  if (!dTask) return;
                  var isSubP = /^-\s+🍅/.test(t0);
                  var mP = /^(?:-\s+)?🍅\s*(\d+)\s*,\s*([^~]+?)\s*~\s*([0-9:\- ]+)\s*(.*)$/.exec(t0.replace(/\\~/g, "~"));
                  if (mP) {
                    var pS = mP[2].trim(), pE = mP[3].trim();
                    /* 结束时间可能只写「时:分:秒」，用开始时间的日期补全 */
                    if (pE && pE.indexOf("-") < 0) {
                      var sd2 = /^(\d{4}-\d{2}-\d{2})/.exec(pS);
                      if (sd2) pE = sd2[1] + " " + pE;
                    }
                    var rec = { min: Number(mP[1]), start: pS, end: pE, text: (mP[4]||"").trim() };
                    if (isSubP && dSubIdx >= 0) rec.si = dSubIdx;
                    (docLogsByTask[dTask] = docLogsByTask[dTask] || []).push(rec);
                    return;
                  }
                  if (/^- \[[ xX]\]/.test(t0)) dSubIdx++;
                });
                g.items.forEach(function(it){
                  var cur = it.logs || [];
                  var fromDoc = docLogsByTask[String(it.name||"").trim()] || [];
                  if (!fromDoc.length) return;
                  var seen2 = {};
                  cur.forEach(function(l){ seen2[l.min + "|" + l.start + "|" + l.end + "|" + (l.text||"")] = 1; });
                  fromDoc.forEach(function(l){
                    var k2 = l.min + "|" + l.start + "|" + l.end + "|" + (l.text||"");
                    /* 已被用户删除的：不要从文档补回来 */
                    var dead2 = (raw.delLogs || []).some(function(d){
                      return d.name === it.name && Number(d.min) === Number(l.min) && String(d.start||"").trim() === String(l.start||"").trim();
                    });
                    if (dead2) { seen2[k2] = 1; return; }
                    if (seen2[k2]) {
                      /* 已有这条：如果快照里没 si 而文档里有，补上 si */
                      cur.forEach(function(c){ if (c.min===l.min && c.start===l.start && typeof c.si !== "number" && typeof l.si === "number") c.si = l.si; });
                      return;
                    }
                    seen2[k2] = 1;
                    cur.push(l);
                  });
                  it.logs = cur;
                });
              } catch(eDocLog){}

              var todayBlocks = splitBlocks(buildProjectBody(g.name, g.items, date, prevDoneAt, (raw && raw.delLogs) || []));
              /* 要丢弃的日期：本次写入涉及的所有日期。
                 正在写的日期 + 任务原本挂的旧日期。
                 后者是为了清掉「昨天没做完、今天被顺延过来」的那份旧副本，
                 否则云端会同时留着 📅11-14 和 📅11-15 两份同任务。 */
              var writeDates = {};
              writeDates[date] = 1;
              g.items.forEach(function(t){
                if (t.date) writeDates[t.date] = 1;
              });
              /* 同名任务的旧副本无论挂在哪天都要清掉：
                 任务名是它的身份，日期只是哪天做的标记。
                 不清的话，日子一天天过，云端会越攒越多同名旧段。 */
              var liveNames = {};
              g.items.forEach(function(t){
                var n = String(t.name || "").trim();
                if (n) liveNames[n] = 1;
              });
              /* 已归档的任务名：云端不要再保留它们的旧版本 */
              var killNames = {};
              try {
                var ext = JSON.parse(localStorage.getItem("dsh.worktable.learninggraph.ext.v1") || "{}");
                Object.keys(ext.archived || {}).forEach(function(n){ killNames[n] = 1; });
              } catch(e){}
              /* 已归档任务也作为历史保留（只去掉「同名且未完成」的旧版本） */
              /* 本次要重写的任务，它们的番茄会由 buildProjectBody 按 si 重新放到
                 步骤下面。先记下这些番茄的规范化文本，稍后从 kept 里去掉重复的。 */
              var rebuiltPomo = {};
              g.items.forEach(function(it){
                (it.logs || []).forEach(function(l){
                  var line = "🍅" + l.min + "," + l.start + "\\~" + pomoEndShort(l.end) + (l.text ? " " + l.text : "");
                  rebuiltPomo[line.replace(/\s+/g, " ")] = 1;
                });
              });
              /* 本次要写的任务里，所有步骤的文字。用来识别文档里
                 悬空的孤儿步骤行（同一行会被重新写进任务里，
                 旧的那份必须丢掉，否则解析出重复任务）。 */
              var stepNames = {};
              g.items.forEach(function(it){
                (it.subs || []).forEach(function(x){
                  var t2 = String((x && x.text) || "").trim();
                  if (t2) stepNames[t2] = 1;
                });
              });

              var kept = keepOtherDays(oldMd, writeDates, null, liveNames, stepNames);

              /* —— 番茄的归属由 buildProjectBody 统一负责 ——
                 keepOtherDays 会把番茄当独立块保留下来，但它们脱离步骤后
                 会堆到文档末尾/顶部，位置就错了。这里把「本次要重写的
                 那些任务的番茄」从 kept 里摘掉：它们已经在 todayBlocks 里
                 按 si 正确放置，不能重复。 */
              kept = kept.filter(function(b){
                var t0 = String((b && b[0]) || "").trim().replace(/^-\s+/, "");
                if (t0.indexOf("🍅") !== 0) return true;
                if (rebuiltPomo[t0.replace(/\s+/g, " ")]) return false;
                /* 用户删掉的番茄：从 kept 里也剔除，否则会被原样保留在文档里 */
                var mM = /^🍅\s*(\d+)\s*,\s*([^~]+?)\s*~/.exec(t0.replace(/\\~/g, "~"));
                if (mM) {
                  var del = (raw.delLogs || []).some(function(d){
                    return g.items.some(function(it){ return it.name === d.name; }) &&
                           Number(d.min) === Number(mM[1]) &&
                           String(d.start || "").trim() === mM[2].trim();
                  });
                  if (del) return false;
                }
                return true;
              });

              /* —— 日志 / 备注去重合并 ——
                 文档里已有的同一条（分钟数+起始+结束+说明 完全相同）只保留一份；
                 快照里有、文档里没有的再补进去。
                 注意番茄现在可能是「嵌套在步骤下的子项」，所以要扫描块内每一行，
                 不能只看块首。 */
              var seenLog = {}, seenNote = {};
              function scanRec(lines2){
                lines2.forEach(function(ln){
                  var t0 = String(ln || "").trim().replace(/^-\s+/, "");
                  if (t0.indexOf("🍅") === 0) seenLog[t0] = 1;
                  else if (t0.indexOf("⏳") === 0) seenNote[t0] = 1;
                });
              }
              kept.forEach(function(b){ scanRec(b); });
              todayBlocks.forEach(function(b){ scanRec(b); });
              /* —— 番茄不能丢：文档里原有的番茄行，如果快照里没有对应记录，
                     也要原样保留下来（快照可能被清空过，比如手动改过数据） —— */
              var docPomoLines = [];
              oldMd.split(/\r?\n/).forEach(function(ln){
                var t0 = ln.trim().replace(/^-\s+/, "");
                if (t0.indexOf("🍅") === 0) docPomoLines.push({ indent: /^\s+-\s+🍅/.test(ln), line: ln.trim() });
              });
              var extraBlocks = [];
              g.items.forEach(function(it){
                (it.logs || []).forEach(function(l){
                  var line = "🍅" + l.min + "," + l.start + "\\~" + pomoEndShort(l.end) + (l.text ? " " + l.text : "");
                  if (seenLog[line]) return;
                  /* 已删除的不再补 */
                  var dead = (raw.delLogs || []).some(function(d){
                    return d.name === it.name && Number(d.min) === Number(l.min) && String(d.start || "").trim() === String(l.start || "").trim();
                  });
                  if (dead) { seenLog[line] = 1; return; }
                  seenLog[line] = 1;
                  extraBlocks.push([line]);
                });
                (it.notes || []).forEach(function(n){
                  var line = "⏳ " + n.text;
                  if (seenNote[line]) return;
                  seenNote[line] = 1;
                  extraBlocks.push([line]);
                });
              });
              /* 文档里有、快照和本次要写的都没有的番茄 → 补回来。
                 但**已经删除**的不能再补：delLogs 里记着墓碑，
                 否则用户在主界面点了 ✕ 之后，下一次推送又会把它写回文档。 */
              var orphanPomos = [];
              docPomoLines.forEach(function(o){
                var t0 = o.line.replace(/^-\s+/, "");
                if (seenLog[t0]) return;
                /* 这条番茄在当前项目里被标记删除过？逐任务检查 */
                var hitDel = g.items.some(function(it){
                  return (raw.delLogs || []).some(function(d){
                    if (d.name !== it.name) return false;
                    var m2 = /^🍅\s*(\d+)\s*,\s*([^~]+?)\s*~/.exec(t0.replace(/\\~/g, "~"));
                    if (!m2) return false;
                    return Number(d.min) === Number(m2[1]) && String(d.start || "").trim() === m2[2].trim();
                  });
                });
                if (hitDel) { seenLog[t0] = 1; return; }   /* 删掉的：不再补回 */
                seenLog[t0] = 1;
                orphanPomos.push([t0]);
              });

              var all = kept.concat(extraBlocks).concat(orphanPomos).concat(todayBlocks);
              var md = "## " + g.name + "\n\n"
                + all.map(function(bs){ return bs.join("\n"); }).join("\n\n");
              return rPost(rc, "/api/block/updateBlock", { id: id, dataType: "markdown", data: md });
              });   /* end exportMdContent */
            });     /* end assertSafeTarget */
          }).then(function(){ ok++; return null; })
            .catch(function(e){ fail++; return null; });
        }).catch(function(e){ fail++; return null; });
      }, Promise.resolve());
    }).then(function(){
      /* 处理删除墓碑：云端文档里同名任务要一并移除 */
      var tombs = (raw.delTodos || []).slice();
      if (!tombs.length) return null;
      var byProj = {};
      tombs.forEach(function(t){
        var pj = t.project || "未归类";
        (byProj[pj] = byProj[pj] || []).push(t);
      });
      return Object.keys(byProj).reduce(function(pp, pj){
        return pp.then(function(){
          return ensureProjectDoc(rc, nbIdOut, pj).then(function(id){
            /* 同样要过安全闸：墓碑里的项目名也可能是撞车的真实文档名 */
            return assertSafeTarget(rc, id).then(function(safe){
              if (!safe) {
                try { console.warn("[push] 墓碑跳过「" + pj + "」：目标是真实笔记"); } catch(e){}
                return null;
              }
              return rPost(rc, "/api/export/exportMdContent", { id: id }).then(function(x){
              var oldMd = (x && x.content) || "";
              oldMd = oldMd.replace(/^\uFEFF?---[\s\S]*?---\r?\n/, "");
              var killNames = {};
              byProj[pj].forEach(function(t){ killNames[String(t.name).trim()] = 1; });

              /* 先把文档按「任务段」切开：段首是含 📋 的块，后续到下一个任务前都是它的附属 */
              var blocks = splitBlocks(oldMd);
              var segments = [];   /* { head, tail[] } */
              var prefix = [];     /* 第一个任务之前的内容（标题等） */
              blocks.forEach(function(b){
                var first = String(b[0] || "").trim();
                if (/^#{1,6}\s/.test(first)) { prefix.push(b); return; }
                var joined = b.join(" ");
                if (joined.indexOf("📋") >= 0) {
                  segments.push({ head: b, tail: [] });
                } else if (segments.length) {
                  segments[segments.length - 1].tail.push(b);
                } else {
                  prefix.push(b);
                }
              });

              /* 丢掉被删任务所在的整个段 */
              var keptSegs = segments.filter(function(sg){
                var headTxt = sg.head.join(" ");
                return !Object.keys(killNames).some(function(nm){
                  return headTxt.indexOf(nm) >= 0;
                });
              });

              var out = prefix.slice();
              keptSegs.forEach(function(sg){
                out.push(sg.head);
                sg.tail.forEach(function(t){ out.push(t); });
              });

              var head = (oldMd.match(/^\s*##\s+(.+)$/m) || [])[1] || pj;
              var body = out.map(function(b){ return b.join("\n"); }).join("\n\n");
              var md = body ? ("## " + head + "\n\n" + body) : ("## " + head);
              return rPost(rc, "/api/block/updateBlock", { id: id, dataType: "markdown", data: md });
              });   /* end exportMdContent */
            });     /* end assertSafeTarget */
          }).catch(function(){ return null; });
        });
      }, Promise.resolve());
    }).then(function(){
      /* 清理移走/删除后残留的块：每个项目文档只保留该项目当前任务对应的日期 */
      var byPath = {};
      groups.forEach(function(g){
        var ds = {};
        g.items.forEach(function(t){ ds[t.date || date] = 1; });
        byPath[docPathFor(g.name, rc.rootPath)] = ds;
      });
      var touchedDates = {};
      raw.items.forEach(function(t){ touchedDates[t.date || date] = 1; });
      return rPost(rc, "/api/query/sql", {
        /* 范围必须跟 fetchSideDocs 一致：
           · 有 rootPath → 只看 rootPath 下的
           · 没 rootPath → 只看本笔记本的顶层文档
           以前这里写死了 `NOT LIKE '/%/%'`，在本地「个人」笔记本里
           等于把所有顶层文档（仪表盘/DIY/日常记录…）都拉进来清理，
           每次都整篇重写一遍。 */
        stmt: (function(){
          var root = String(rc.rootPath || "").replace(/\/+$/, "");
          var base = "SELECT id, hpath FROM blocks WHERE type='d' AND box='" + nbIdOut + "'";
          return root
            ? base + " AND hpath LIKE '" + root.replace(/'/g, "''") + "/%'"
            : base + " AND hpath NOT LIKE '/%/%'";
        })()
      }).then(function(rows){
        return Promise.all((rows || []).map(function(r){
          var keepForThisDoc = byPath[r.hpath];
          var drop = {};
          if (keepForThisDoc) {
            Object.keys(touchedDates).forEach(function(d){ if (!keepForThisDoc[d]) drop[d] = 1; });
          } else {
            drop = touchedDates;
          }
          if (!Object.keys(drop).length) return null;
          /* 不在本次项目名单里的文档，先确认它确实是待办文档再动；
             真实笔记一律跳过（哪怕查询范围出错也不碰）。 */
          var guard = keepForThisDoc ? Promise.resolve(true) : assertSafeTarget(rc, r.id);
          return guard.then(function(safe){
            if (!safe) return null;
            return rPost(rc, "/api/export/exportMdContent", { id: r.id }).then(function(x){
              var body = String((x && x.content) || "").replace(/^\uFEFF?---[\s\S]*?---\r?\n/, "");
              var head = (body.match(/^\s*##\s+(.+)$/m) || [])[1] || r.hpath.split("/").pop();
              var kept = keepOtherDays(body, drop, null);
              /* 清理后如果什么都不剩，就不要写空文档，直接跳过 */
              if (!kept.length) return null;
              var md = "## " + head + "\n\n" + kept.map(function(b){ return b.join("\n"); }).join("\n\n");
              return rPost(rc, "/api/block/updateBlock", { id: r.id, dataType: "markdown", data: md });
            }).catch(function(){});
          }).catch(function(){});
        }));
      }).catch(function(){});
    }).then(function(){
      try { localStorage.setItem(LAST_SYNC_KEY, String(Date.now())); } catch(e){}
      if (rc.cleanup) {
        /* 推送已完成，只把「待推送 / 墓碑」这些标记清掉。
           ⚠ 绝对不要在这里动 items —— items 归主窗口管，
           侧边栏拿自己那份回写会把主窗口刚写的 doneAt 覆盖掉，
           表现为「勾完后分数先有、过两秒跳回 0」。
           这里只改标记字段，items 原样保留。
           ⚠ 而且必须走 writeSnapshotSafe：它会在写之前重新读一次快照，
           只改标记、其余按最新的来；直接 JSON.stringify(latest) 整份写回，
           会把推送期间（本地+云端两轮网络往返，可能好几秒）
           用户新勾的步骤一起冲掉。 */
        return writeSnapshotSafe(function(latest){
          latest.dirty = 0;
          latest.delNotes = [];
          latest.delLogs = [];
          latest.delTodos = [];
          latest.forcePush = 0;
        }).then(function(){ return finishPush(); });
      }
      return finishPush();

      function finishPush(){
        todoHint("已推送 " + ok + " 个项目到" + (label || "") + "（" + date + "）" + (fail ? "，" + fail + " 个失败" : ""), "#2f7a4f");
        return { ok: ok, fail: fail };
      }
    }).catch(function(e){
      todoHint((label || "") + "推送失败：" + ((e && e.message) || e), "#c0392b");
      return { ok: 0, fail: 1, error: String((e && e.message) || e) };
    }).then(function(res){
      doneFlag = true;
      clearTimeout(guard);
      if (btn) { btn.disabled = false; btn.textContent = PUSH_ICON; }
      return res || { ok: ok, fail: fail };
    });
  }

  /* 推送闸门：同一时刻只允许一批推送，避免「推送→写快照→再触发推送」的风暴 */
  var pushInFlight = null;
  var localPending = undefined;   /* 本地还没轮到推的新项目；undefined=无，null=全量 */
  var lastPushDoneAt = 0;
  var PUSH_MIN_GAP = 5000;       /* 两次推送至少间隔 5 秒（防抖，不是限流） */

  /* 双写：本地思源 + 云端。
     ⚠ 两个目标**并行**，本地绝不等云端。
        以前是 jobs.reduce 串行，本地写在最前面，但整轮 promise
        要等云端（每次往返 150–900ms × 一二十次）跑完才算结束，
        于是「改个勾选，本地思源要 6~14 秒才更新」。
        本地是 127.0.0.1，几毫秒就写完，没有理由等一台远程服务器。
     onlyProjects：只推这些项目（空/未传 = 全推） */
  function pushTodos(silent, onlyProjects){
    /* 兜底：进入推送前先复位按钮。
       上一次推送如果异常退出，按钮会停在「推送中…」；
       这里顺手修掉，避免状态越积越乱。 */
    try {
      var b0 = $("btnPush");
      if (b0 && !pushInFlight && b0.textContent !== "↑") { b0.textContent = "↑"; b0.disabled = false; }
    } catch(eB){}
    /* 节流：刚推完就不要再推（除非是手动点按钮 silent=false）。
       ⚠ 但勾选是用户的明确操作，不能因为「几秒前刚推过」就丢掉，
       所以带 forcePush 的调用不走节流。 */
    var _raw0 = readSnapshot();
    var _urgent = !!(_raw0 && _raw0.forcePush);
    var startFp = Number((_raw0 && _raw0.forcePush) || 0);   /* 本轮推送开始时的标记，推完只清这个值 */

    var onlyArr = Array.isArray(onlyProjects) ? onlyProjects.slice() : null;

    /* 本地和云端各自去重。
       以前只挡 pushInFlight，而 pollPush 和 storage 事件会各触发一次，
       一次点击跑两轮完整推送，等待时间直接翻倍。
       现在：本地推送进行中又来了请求 → 排队（不丢）；云端交给队列合并。
       ⚠ 排队时不要把「没带项目」当成「要全量」：
       没带项目 = 调用方也不知道变了什么，就别追加任何东西，
       等这一轮自己跑完。以前这里写 localPending = null，
       下一轮就变成全量推送，六个文档全部重写 —— 延迟就是这么来的。 */
    if (pushInFlight) {
      if (onlyArr && onlyArr.length) {
        localPending = localPending ? localPending.concat(onlyArr) : onlyArr.slice();
      }
      return pushInFlight;
    }
    /* 紧急开关：维护数据时可以让后台推送静默（不写本地/云端文档）。
       在控制台执行 __pausePush(true) 打开，__pausePush(false) 关闭。 */
    try { if (localStorage.getItem("dsh.worktable.pausePush") === "1") return Promise.resolve(); } catch(eP){}
    if (silent && !_urgent && Date.now() - lastPushDoneAt < PUSH_MIN_GAP) return Promise.resolve();
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items.length) { todoHint("还没有待办可推送"); return Promise.resolve(); }
    var rc = remoteCfg();
    if (!rc.base || !rc.token) { todoHint("服务器思源未配置（主窗口「设置」→ 周报数据源：地址 + 令牌）"); return Promise.resolve(); }
    var lc = localCfg();
    var only = onlyArr;

    var localCfgObj = {
      base: lc.base, token: lc.token, cleanup: false,   /* 本地不负责清标记 */
      nbName: lc.nbName, rootPath: lc.rootPath,         /* 个人 / 日常记录 / 待办 */
      onlyProjects: only
    };
    var cloudCfgObj = {
      base: rc.base, token: rc.token,
      cleanup: true,                                    /* 无论全量还是部分，推完都清标记 */
      nbName: REMOTE_NB_NAME, rootPath: "",             /* 云端仍是「每日待办」根目录 */
      onlyProjects: only
    };

    /* —— 本地：先发、单独跑，返回值只代表本地 —— */
    var localJob = lc.token
      ? pushTodosTo(localCfgObj, true, "本地思源").catch(function(){ return { ok:0, fail:1 }; })
      : Promise.resolve({ ok:0, fail:0, skipped:true });

    /* —— 云端：后台并行。用一条队列，免得同一时刻起两条链互相覆盖 —— */
    enqueueCloud(cloudCfgObj, only);

    /* pushInFlight 只等本地：调用方拿到结果时就说明本地文档已经写好。
       云端继续在后台跑。 */
    pushInFlight = localJob.then(function(r){
      pushInFlight = null;
      lastPushDoneAt = Date.now();
      /* 本地写完后只清 forcePush 的「本地」意图。
         ⚠ 云端还在跑时不要清：云端队列结尾会统一收尾。 */
      return writeSnapshotSafe(function(ls){
        if (!cloudBusy() && Number(ls.forcePush || 0) === Number(startFp)) {
          ls.forcePush = 0;
          ls.dirty = 0;
        }
      }).then(function(){
        /* 本地跑的时候又攒下新的项目 → 再补一轮 */
        if (localPending !== undefined) {
          var more = localPending;
          localPending = undefined;
          setTimeout(function(){
            pushTodos(true, (more && more.length) ? more : undefined);
          }, 0);
        }
        return r;
      });
    }).catch(function(e){
      pushInFlight = null;
      lastPushDoneAt = Date.now();
      throw e;
    });

    return pushInFlight;
  }

  /* ===== 云端推送队列 =====
     目标：同一时刻只跑一条云端链；跑的期间又有新项目就攒起来，跑完补一轮。
     cloudPending 语义：
        undefined → 没有待办内容
        null      → 有一轮「全量」请求
        []        → 空，无请求
        数组      → 有这些项目要推
     cloudBusy() 供收尾逻辑判断「云端是否还有活」。 */
  var cloudRunning = false;
  var cloudPending = undefined;
  var cloudChain = Promise.resolve();

  function cloudBusy(){ return cloudRunning || cloudPending !== undefined; }

  function enqueueCloud(cfg, only){
    if (only && only.length) {
      if (cloudPending === undefined || cloudPending === null) {
        cloudPending = only.slice();
      } else {
        cloudPending = cloudPending.concat(only);
      }
    } else {
      cloudPending = null;              /* 全量请求覆盖掉之前的零碎项目 */
    }
    cloudChain = cloudChain.then(function pump(){
      if (cloudRunning || cloudPending === undefined) return null;
      if (Array.isArray(cloudPending) && !cloudPending.length) {
        cloudPending = undefined;
        return null;
      }
      var batch = cloudPending;
      /* 全量时去重成 null；指定项目时保持数组 */
      cloudPending = undefined;
      cloudRunning = true;
      var cfg2 = Object.assign({}, cfg, { onlyProjects: batch });
      return pushTodosTo(cfg2, true, "云端")
        .catch(function(){ return { ok:0, fail:1 }; })
        .then(function(res){
          cloudRunning = false;
          return pump().then(function(){ return res; });
        });
    }).catch(function(){
      cloudRunning = false;
    }).then(function(){
      if (!cloudBusy()) {
        /* 云端全部跑完：清掉本轮的 forcePush（若期间没有新的勾选） */
        return writeSnapshotSafe(function(ls){
          ls.forcePush = 0;
          ls.dirty = 0;
        });
      }
      return null;
    });
    return cloudChain;
  }
  $("btnPush").addEventListener("click", function(){ pushTodos(false); });

  /* ---------- 定时同步 ----------
     本地思源：30 秒一轮（本机进程，代价低）
     云端：1 小时一轮（避免打远程）
     每一轮都走「比修改时间 → 取较新 → 回写另一端」 */
  var SYNC_INTERVAL = 60 * 60 * 1000;          /* 云端：1 小时 */
  var LOCAL_SYNC_INTERVAL = 30 * 1000;         /* 本地：30 秒 */
  var LAST_SYNC_KEY = "dsh.worktable.todos.syncAt";
  var LAST_LOCAL_SYNC_KEY = "dsh.worktable.todos.syncLocalAt";
  function lastSyncAt(){ return Number(localStorage.getItem(LAST_SYNC_KEY) || 0); }
  function lastLocalSyncAt(){ return Number(localStorage.getItem(LAST_LOCAL_SYNC_KEY) || 0); }

  /* 找今天那篇云端文档（不存在返回 null） */
  /* 今天所有项目文档（/<日期>/<项目>） */
  function remoteDocsForDate(rc, date){
    return ensureNotebook(rc).then(function(nbId){
      return rPost(rc, "/api/query/sql", {
        stmt: "SELECT id, hpath FROM blocks WHERE type='d' AND box='" + nbId + "' AND hpath NOT LIKE '/%/%'"
      }).then(function(rows){
        return { nbId: nbId, docs: rows || [] };
      });
    });
  }
  /* 解析云端 Markdown：
     ## 项目 → 任务行(📋) → 步骤行(- [ ]/ [x] 📅日期) → 🍅/⏳ 记录 */
  function parseCloudMd(md){
    var out = { summary: "", items: [] }, cur = null, curProject = "";
    /* 当前正在解析的任务里，最后一条步骤的序号。
       缩进的 🍅 子行归到它下面（步骤级番茄）。 */
    var lastSubIdx = -1;
    /* ⚠ 游离番茄：出现在第一个 📋 任务头之前、或 ## 标题之后还没开任务时的
       顶格 🍅 行（常见于「手动补记」和「任务被重新生成后旧番茄留在原处」）。
       以前 `if (cur) {...} return;` —— cur 为空就直接丢掉，
       于是这些番茄在快照重建时永久消失（文档里还在，快照里没了）。
       现在先攒起来，等下一个任务出现时挂上去；整篇都没有任务时，
       归到一个「未归类的历史记录」条目里，保证不丢。 */
    var orphanLogs = [];

    function newItem(name, date, done, imp){
      return { name: name, date: date || null, dateEnd: null, important: !!imp,
               mins: null, level: null, done: !!done, project: curProject,
               logs: [], notes: [], subs: [], _isTask: false };
    }

    String(md || "").split(/\r?\n/).forEach(function(rawLine){
      var s = rawLine.trim();
      if (!s) return;
      if (!out.summary) {
        var q = /^>\s?(.+)$/.exec(s);
        if (q) { out.summary = q[1].trim(); return; }
      }
      var hm = /^##\s+(.+)$/.exec(s);
      if (hm) { curProject = hm[1].trim(); cur = null; lastSubIdx = -1; return; }
      if (/^#{3,}\s/.test(s)) return;
      if (/^#\s+/.test(s)) { cur = null; lastSubIdx = -1; return; }

      /* 番茄记录：顶格的挂任务，缩进的（🍅 前面是 "- "）挂上一条步骤 */
      var mLog = /^(?:-\s+)?🍅\s*(\d+)\s*,\s*([^~]+?)\s*~\s*([0-9:\- ]+)\s*(.*)$/.exec(s.replace(/\\~/g, "~"));
      if (mLog) {
        var pStart = mLog[2].trim();
        var pEnd = mLog[3].trim();
        /* 结束时间可能只有「时:分:秒」（新格式），也可能带完整日期（老格式）。
           只写时间时，用开始时间的日期补全，保证 end 始终是完整时间戳，
           否则后续按时间比较/排序/去重都会出错。 */
        if (pEnd && pEnd.indexOf("-") < 0) {
          var sd = /^(\d{4}-\d{2}-\d{2})/.exec(pStart);
          if (sd) pEnd = sd[1] + " " + pEnd;
        }
        var entry = { min: Number(mLog[1]), start: pStart, end: pEnd, text: (mLog[4] || "").trim() };
        /* 是 "- 🍅..." 形式的子项 → 归到上一条步骤 */
        if (/^-\s+🍅/.test(s) && lastSubIdx >= 0 && cur) entry.si = lastSubIdx;
        if (cur) {
          cur.logs.push(entry);
        } else {
          /* 还没有任务归属：先攒着，等下一个 📋 出现时挂上去。
             这样「任务头之前的手动补记」不会在重建快照时丢掉。 */
          orphanLogs.push(entry);
        }
        return;
      }
      if (s.indexOf("🍅") === 0) return;   /* 兜底：格式没对上就跳过 */
      var note = /^⏳\s*(.*)$/.exec(s);
      if (note) { if (cur) cur.notes.push({ text: note[1].trim() }); return; }

      /* 任务行：📋 → 开一个新任务 */
      if (s.indexOf("📋") >= 0) {
        /* 先取出工时 ⏱45，再把它从名字里剥掉 */
        var mt = /⏱\s*(\d+)/.exec(s);
        var taskMins = mt ? Number(mt[1]) : null;
        var nm = s.replace(/⏱\s*\d+/g, " ")
                  .replace(/📋/g, " ").replace(/@L\d+/g, " ").replace(/[🔥✅]/g, " ")
                  .replace(/\s+/g, " ").trim();
        if (!nm) return;
        cur = newItem(nm, null, false, false);
        if (taskMins) cur.mins = taskMins;
        cur._isTask = true;
        lastSubIdx = -1;
        /* 认领前面攒下的游离番茄（任务头之前的记录属于这个任务）。
           注意：只认领「本任务头之前」攒下的，认领后清空，
           所以后面的游离记录不会被这个任务重复拿走。 */
        if (orphanLogs.length) {
          orphanLogs.forEach(function(l){ cur.logs.push(l); });
          orphanLogs = [];
        }
        out.items.push(cur);
        return;
      }

      /* 步骤行：可带勾选框，带日期 */
      var core = s, done = false, imp = false, subQuad = null;
      var cb = /^-\s*\[([ xX])\]\s*(.*)$/.exec(core);
      if (cb) { done = cb[1].toLowerCase() === "x"; core = cb[2]; }
      /* 完成日期：优先用行尾的 ✅MM-DD（老格式），
         没有的话就用这一行的 📅 日期 —— 现在写入时不再追加 ✅MM-DD，
         「哪一天完成」完全由 📅 承载。不这样做的话 doneAt 全是空，
         计分就分不清「今天做的」和「前几天做的」，
         还会把历史步骤的日期一路改写成今天。 */
      var doneAt = null;
      var st = /(?:\s*✅(?:\s*(\d{2}-\d{2}))?)\s*$/.exec(core);
      if (st) {
        if (st[1]) {
          /* 年份取同一行 📅 计划日期的年份（跨年场景也基本成立） */
          var ym = /📅\s*(\d{4})-\d{2}-\d{2}/.exec(core);
          var yr = ym ? ym[1] : String(new Date().getFullYear());
          doneAt = yr + "-" + st[1];
        }
        done = true;
        core = core.slice(0, st.index).trim();
      }
      if (/✅\s*$/.test(core)) { done = true; core = core.replace(/✅\s*$/, "").trim(); }
      var pm = /\s*🍅x\d+\s*$/.exec(core);
      if (pm) core = core.slice(0, pm.index).trim();
      /* 日期可以横跨多天，写法例如：
           📅2026-11-16
           📅2026-09-08, 2026-09-11~09-13
         取第一段作为任务的起始日期（用于归档/分组），
         后面几段只作为「计划跨度」保留，不参与计分。
         正则要能吃掉整段，否则尾巴会留在步骤名字里。 */
      var dmx = /📅\s*((?:\d{4}-\d{2}-\d{2})(?:\s*~\s*\d{2}(?:-\d{2})?)?(?:\s*,\s*\d{4}-\d{2}-\d{2}(?:\s*~\s*\d{2}(?:-\d{2})?)?)*)/.exec(core);
      if (!dmx) return;
      var dmIndex = dmx.index;
      var dmLen = dmx[0].length;
      /* 把 「2026-09-08, 2026-09-11~09-13」 解析成一个完整日期数组。
         区间会被展开成逐个日期，这样「这一步做过哪几天」一目了然，
         写回时再由 formatDateList 压缩成区间。 */
      var dateList = parseDateExpr(dmx[1].trim());
      var dmFirst = /^(\d{4}-\d{2}-\d{2})(?:\s*~\s*(\d{2}(?:-\d{2})?))?/.exec(dmx[1].trim());
      var dm = [dmx[0], dmFirst ? dmFirst[1] : "", dmFirst ? dmFirst[2] : ""];
      var head = (core.slice(0, dmIndex) + " " + core.slice(dmIndex + dmLen)).trim();
      /* 状态标记 → 象限。三种标记都要认，否则从文档读回来时
         「重要·不紧急」「紧急·不重要」会被当成普通任务，象限就丢了。 */
      if (/🔥/.test(head)) { imp = true; subQuad = "iu"; }
      else if (/🌱/.test(head)) { subQuad = "in"; }
      else if (/🍃/.test(head)) { subQuad = "uu"; }
      /* 部分进度标记 ◐40% → 从文字里剥出来，存成 pct。
         没有这个标记的步骤 pct 记 0。 */
      var pctVal = 0;
      var pctM = /◐\s*(\d{1,3})\s*%/.exec(head);
      if (pctM) {
        pctVal = Math.max(0, Math.min(100, Number(pctM[1]) || 0));
        head = head.replace(pctM[0], "");
      }
      /* 标记不属于步骤文字，全部剥掉（否则每次读写都会叠加一个） */
      head = head.replace(/[🔥🌱🍃📋✅✓◐]/g, "").replace(/\s+/g, " ").trim();
      if (!head) return;

      /* 已经完成但没有 ✅MM-DD（新格式）：把这一行的 📅 日期当作完成日期。
         这是 doneAt 的唯一来源，不能省 —— 否则历史步骤会被当成本次新建，
         每次推送都改写成今天。 */
      if (done && !doneAt && dm[1]) doneAt = dm[1];

      if (cur) {
        /* dates 记录「这一步做过哪几天」，之后读写都沿用它。
           取消勾选时只改 done，不动 dates，这样多日期跨度不会被压成今天。 */
        /* ⚠ 同名步骤去重：文档里同一个任务下可能因为历史原因
           出现两行一样的步骤（旧数据/上一次写入异常）。
           无脑 push 会让 subs 多出一项，写回时按索引对番茄和状态，
           结果就是「改了这个、那个又变回去」。
           这里同名只保留一条，并合并两边的信息（任一为完成即视为完成，
           完成日期取较晚的那个）。 */
        var _dupe = null;
        for (var _k = 0; _k < cur.subs.length; _k++) {
          if (String(cur.subs[_k].text || "") === head) { _dupe = cur.subs[_k]; break; }
        }
        if (_dupe) {
          /* 已完成优先；日期取较晚；dates 取并集 */
          if (done && !_dupe.done) { _dupe.done = true; }
          if (doneAt && (!_dupe.doneAt || doneAt > _dupe.doneAt)) _dupe.doneAt = doneAt;
          if (pctVal > (Number(_dupe.pct) || 0)) _dupe.pct = pctVal;
          var merged = (_dupe.dates || []).slice();
          (dateList || []).forEach(function(x){ if (merged.indexOf(x) < 0) merged.push(x); });
          merged.sort();
          if (merged.length) _dupe.dates = merged;
          lastSubIdx = _k;                  /* 后续缩进的 🍅 归到这条 */
        } else {
          cur.subs.push({ text: head, done: done, doneAt: doneAt, date: dm[1] || null,
                          dates: dateList, pct: pctVal });
          lastSubIdx = cur.subs.length - 1;     /* 后续缩进的 🍅 归到这一步 */
        }
        if (!cur.date) cur.date = dm[1];
        if (dm[2] && !cur.dateEnd) cur.dateEnd = dm[1].slice(0, 5) + dm[2];
        /* 标记即象限：从文档读回时恢复任务所属象限，
           否则「重要·不紧急」的 🌱 会被当成普通任务重新归类。 */
        if (subQuad && !cur.q) cur.q = subQuad;
        if (imp) cur.important = true;
      } else {
        /* 没有任务头：当成独立步骤条目 */
        cur = newItem(head, dm[1], done, imp);
        if (subQuad) cur.q = subQuad;
        cur.subs.push({ text: head, done: done, doneAt: doneAt, date: dm[1] || null, pct: pctVal });
        lastSubIdx = 0;
        out.items.push(cur);
      }
    });

    /* 还有没被认领的游离番茄（整篇没有任务头，或全部出现在最后一个任务之后）
       → 归到一个独立条目，保证这些工时不会凭空消失。 */
    if (orphanLogs.length) {
      var orphanItem = newItem("历史番茄记录（未归属任务）", null, false, false);
      orphanItem.logs = orphanLogs.slice();
      out.items.push(orphanItem);
    }

    out.items.forEach(function(it){
      if (it._isTask && it.subs.length) {
        it.done = it.subs.every(function(s){ return s.done; });
      }
      delete it._isTask;
    });
    return out;
  }
  /* 调试钩子：控制台可验证文档解析（尤其是游离番茄的归属） */
  try { window.__parseCloudMd = parseCloudMd; } catch(ePM){}

  /* ---------- 本地改动队列 ---------- */
  var DELTA_KEY = "dsh.worktable.todos.delta.v1";
  function loadDeltas(){
    try { return JSON.parse(localStorage.getItem(DELTA_KEY) || "[]") || []; } catch(e){ return []; }
  }
  function saveDeltas(arr){ try { localStorage.setItem(DELTA_KEY, JSON.stringify(arr)); } catch(e){} }
  function recordDelta(name, si, done){
    var d = loadDeltas().filter(function(x){ return !(x.name === name && x.si === si); });
    d.push({ name: name, si: si, done: !!done, at: Date.now() });
    saveDeltas(d);
  }
  function clearDeltas(){ saveDeltas([]); }

  /* 把本地改动叠加到云端模型上 */
  function applyDeltasToModel(model, deltas){
    var map = {};
    deltas.forEach(function(d){ map[d.name + "|" + d.si] = d.done; });
    model.items.forEach(function(it){
      var touched = false;
      (it.subs || []).forEach(function(s, i){
        var k = it.name + "|" + i;
        if (Object.prototype.hasOwnProperty.call(map, k)) { s.done = !!map[k]; touched = true; }
      });
      if (touched && it.subs && it.subs.length) it.done = it.subs.every(function(s){ return s.done; });
    });
    return model;
  }

  /* 清掉历史遗留的标记污染（早期解析 bug 曾把 📅/🔥 拼进任务名） */
  function cleanName(s){
    return String(s || "")
      .replace(/^-\s*\[[ xX]\]\s*/, "")
      .replace(/📅\s*\d{4}-\d{2}-\d{2}(\s*~\s*\d{2}-\d{2})?/g, "")
      .replace(/⏱\s*\d+/g, "")        /* 工时标记 ⏱45 不属于任务名 */
      .replace(/[🔥📋✅🍅⏱✓]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }
  function readSnapshot(){
    try {
      var raw = JSON.parse(localStorage.getItem(TODOS_KEY) || "null");
      if (raw && Array.isArray(raw.items)) {
        raw.items.forEach(function(it){
          if (!it) return;
          var n = cleanName(it.name);
          if (n && n !== it.name) it.name = n;
        });
        /* 同名只保留一条，避免反复同步产生重复。
           若两条同名但一条有 doneAt、另一条没有，保留「信息更全」那条，
           否则刚勾上的完成日期会被空壳条目顶掉。 */
        var seen = {}, kept = [];
        raw.items.forEach(function(it){
          if (!it || !it.name) return;
          var prevIdx = seen[it.name];
          if (prevIdx === undefined) {
            seen[it.name] = kept.length;
            kept.push(it);
            return;
          }
          var cur = kept[prevIdx];
          var curAt = (cur.subs || []).filter(function(s){ return s && s.done && s.doneAt; }).length;
          var newAt = (it.subs || []).filter(function(s){ return s && s.done && s.doneAt; }).length;
          if (newAt > curAt) kept[prevIdx] = it;   /* 换成信息更全的 */
        });
        raw.items = kept;
      }
      return raw;
    } catch(e){ return null; }
  }
  function readSnapshotRaw(){
    try { return JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(e){ return null; }
  }
  function writeSnapshot(items, summary, tag, dirty){
    var raw = readSnapshot();
    var d = (dirty === undefined) ? ((raw && raw.dirty) || 0) : dirty;
    localStorage.setItem(TODOS_KEY, JSON.stringify({
      at: Date.now(),
      summary: summary || ((raw && raw.summary) || ""),
      tag: tag || ((raw && raw.tag) || "云端同步"),
      dirty: d,
      /* 还有未推送的删除时继续记账，推送成功后清空 */
      delNotes: d ? ((raw && raw.delNotes) || []) : [],
      delLogs: d ? ((raw && raw.delLogs) || []) : [],
      items: (function(){
        /* 同名任务保留已有的 hist 标记，避免被覆盖丢失 */
        var prevHist = {};
        ((raw && raw.items) || []).forEach(function(it){
          if (it && it.name && it.hist) prevHist[it.name] = 1;
        });
        return (items || []).map(function(it){
          if (!it) return it;
          if (!it.hist && prevHist[it.name]) it.hist = true;
          return it;
        });
      })()
    }));
    renderTodos();
  }

  /* 云端模型 → 本地 items
     备注/番茄记录以云端为基准：云端删掉的不会再被本地加回来；
     只有本地尚未推送（local=true）的新增才并入，删除靠 delNotes/delLogs 记账 */
  function modelToItems(model){
    var raw = readSnapshot(), byName = {};
    ((raw && raw.items) || []).forEach(function(it){ byName[it.name] = it; });
    var allDelNotes = (raw && raw.delNotes) || [];
    var allDelLogs = (raw && raw.delLogs) || [];

    return model.items.map(function(ci){
      var loc = byName[ci.name] || {};
      var locSubs = loc.subs || [];

      var delNotes = allDelNotes.filter(function(d){ return d.name === ci.name; }).map(function(d){ return d.text; });
      var delLogs = allDelLogs.filter(function(d){ return d.name === ci.name; });

      var logs = (ci.logs || []).filter(function(l){
        return !delLogs.some(function(d){ return d.min === l.min && d.start === l.start; });
      }).map(function(l){
        var o = { min: l.min, start: l.start, end: l.end, text: l.text || "" };
        /* si 决定这条番茄挂在哪一步下面，丢了就会全堆到卡片底部 */
        if (typeof l.si === "number") o.si = l.si;
        return o;
      });
      (loc.logs || []).forEach(function(l){
        if (!l.local) return;
        var dup = logs.some(function(x){ return x.min === l.min && x.start === l.start && (x.text || "") === (l.text || ""); });
        if (!dup) {
          var o2 = { min: l.min, start: l.start, end: l.end, text: l.text || "", local: true };
          if (typeof l.si === "number") o2.si = l.si;
          logs.push(o2);
        }
      });

      var notes = (ci.notes || []).filter(function(n){
        return delNotes.indexOf(n.text) < 0;
      }).map(function(n){ return { text: n.text }; });
      (loc.notes || []).forEach(function(n){
        if (!n.local) return;
        if (notes.some(function(x){ return x.text === n.text; })) return;
        if (delNotes.indexOf(n.text) >= 0) return;
        notes.push({ text: n.text, local: true });
      });

      return {
        name: ci.name,
        why: loc.why || "",
        how: loc.how || "",
        phase: loc.phase || "今日待办",
        date: ci.date || null,
        mins: ci.mins != null ? ci.mins : (loc.mins || null),
        level: ci.level != null ? ci.level : (loc.level || null),
        important: !!ci.important || !!loc.important,
        q: loc.q || null,
        project: ci.project || loc.project || "",
        dateEnd: ci.dateEnd || null,
        hist: !!ci.hist || !!loc.hist,     /* 历史任务：只同步，不在工作台显示 */
        logs: logs,
        notes: notes,
        /* 云端 ✅ 视为整条完成；否则保留本地子项进度 */
        /* 云端有步骤就完全以云端为准（内容+勾选），本机同步一致 */
        subs: (ci.subs && ci.subs.length)
          ? ci.subs.map(function(cs){ return { text: cs.text, done: !!cs.done, doneAt: cs.doneAt || null, date: cs.date || null, dates: cs.dates || null }; })
          : locSubs.map(function(s){ return { text: s.text, done: ci.done ? true : !!s.done, doneAt: s.doneAt || null, date: s.date || null, dates: s.dates || null }; })
      };
    });
  }

  /* 推送成功后清掉「待推送」标记与删除记账 */
  function stripPending(items){
    (items || []).forEach(function(it){
      (it.logs || []).forEach(function(l){ delete l.local; });
      (it.notes || []).forEach(function(n){ delete n.local; });
    });
  }


  /* 判断一篇文档是不是「待办项目文档」：必须至少有一个 📋 任务头行。
     代码块和引用块里出现的 📋 不算（那可能是笔记正文在讲这个符号）。 */
  function mdHasTask(md){
    var s = String(md || "");
    /* 去掉围栏代码块 */
    s = s.replace(/```[\s\S]*?```/g, "").replace(/~~~[\s\S]*?~~~/g, "");
    var lines = s.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i];
      if (/^\s*>/.test(ln)) continue;          /* 引用块跳过 */
      if (/^\s*#/.test(ln)) continue;          /* 标题跳过 */
      if (ln.indexOf("📋") >= 0) return true;
      /* 步骤行 / 番茄行 / 备注行 —— 这三种只会出现在待办文档里。
         ⚠ 必须认它们：任务头万一在某次写入中丢了（只剩番茄），
         文档就会被判成「真实笔记」而被 assertSafeTarget 永久拒写，
         任务头再也补不回来。曾经就是这样：云端某篇只剩一条 🍅，
         之后无论怎么推都不生效，两端永远差那几条。 */
      if (/^\s*-\s*\[[ xX]\]\s*\S/.test(ln)) return true;   /* 步骤复选框 */
      if (/^\s*-\s*🍅\s*\d+/.test(ln)) return true;          /* 番茄记录 */
      if (/^\s*⏳\s*\S/.test(ln)) return true;               /* 备注 */
    }
    return false;
  }

  /* 一次同步：先拉云端 → 叠加本地改动 → 有改动才回推云端 */
  /* 读取某个思源里「待办」目录下所有项目文档，附带修改时间 */
  function fetchSideDocs(rc){
    var nbIdOut = null;
    return ensureNotebook(rc).then(function(nbId){
      nbIdOut = nbId;
      var root = String(rc.rootPath || "").replace(/\/+$/, "");
      /* 两种布局：
         · 指定了 rootPath（本地 个人 笔记本）→ 只认 rootPath 下的文档
         · rootPath 为空（云端 每日待办 专用笔记本）→ 顶层文档就是待办
           但**必须限定在本笔记本内**（box=），否则会把别人的顶层文档也吃进来。
         之前的写法是错在：空 rootPath 时虽然加了 box 条件，但本地那边
         一旦 rootPath 没传对，就会把 仪表盘 / DIY / 日常记录 这些真正的
         顶层文档当成待办项目，推送时逐个 updateBlock 全改一遍。 */
      if (!root) {
        return rPost(rc, "/api/query/sql", {
          stmt: "SELECT id, hpath, updated FROM blocks WHERE type='d' AND box='" + nbId + "' AND hpath NOT LIKE '/%/%'"
        });
      }
      return rPost(rc, "/api/query/sql", {
        stmt: "SELECT id, hpath, updated FROM blocks WHERE type='d' AND box='" + nbId + "' AND hpath LIKE '" + root.replace(/'/g, "''") + "/%'"
      });
    }).then(function(rows){
      rows = (rows || []).filter(function(r){
        /* 排除根文档本身 */
        var root = String(rc.rootPath || "").replace(/\/+$/, "");
        if (root && r.hpath === root) return false;
        return true;
      });
      return Promise.all(rows.map(function(r){
        return rPost(rc, "/api/export/exportMdContent", { id: r.id }).then(function(x){
          var parsed = parseCloudMd(x && x.content);
          /* —— 关键防护：只把「真的装有待办任务」的文档当成项目文档 ——
             云端 每日待办 笔记本里，顶层文档就是待办项目；
             但如果查询范围一不小心放宽（例如 rootPath 传空时匹配了
             整个笔记本的顶层文档），就会把 仪表盘 / DIY / 日常记录
             这些真实笔记也算成项目，推送时逐个 updateBlock 覆盖掉。
             判定标准：文档里至少要有一个 `📋` 任务头，
             否则它只是一篇普通笔记，不属于待办，直接跳过。 */
          var rawMd = String((x && x.content) || "");
          var hasTask = mdHasTask(rawMd);
          if (!hasTask) return null;
          return {
            project: r.hpath.split("/").pop(),
            updated: String(r.updated || ""),
            docId: r.id,
            items: (parsed.items || []).map(function(it){
              return Object.assign({}, it, { project: it.project || r.hpath.split("/").pop() });
            })
          };
        }).catch(function(){ return null; });
      })).then(function(list){
        return list.filter(Boolean);
      });
    }).catch(function(e){
      return [];
    });
  }

  /* 把 updated（YYYYMMDDHHMMSS）转成可比较的数字 */
  function stampNum(s){
    var n = String(s || "").replace(/[^0-9]/g, "");
    return n ? Number(n) : 0;
  }
  /* 把「毫秒时间戳」转成和文档 updated 同量级的数字，便于统一比较。
     文档里收到的是 20261116124530（14 位）或毫秒（13 位），
     直接比数值大小会失真，所以这里统一折算成毫秒。 */
  function stampMs(s){
    var raw = String(s == null ? "" : s).trim();
    if (!raw) return 0;
    /* 纯数字：按位数判断是 yyyyMMddHHmmss 还是毫秒 */
    var d = raw.replace(/[^0-9]/g, "");
    if (!d) return 0;
    if (d.length >= 14) {
      /* 20261116124530 → Date */
      var y = +d.slice(0,4), mo = +d.slice(4,6), da = +d.slice(6,8);
      var h = +d.slice(8,10) || 0, mi = +d.slice(10,12) || 0, se = +d.slice(12,14) || 0;
      return new Date(y, mo-1, da, h, mi, se).getTime();
    }
    if (d.length === 13) return Number(d);
    if (d.length === 10) return Number(d) * 1000;   /* 秒级 */
    /* 带分隔符的时间串，交给 Date 解析 */
    var t = Date.parse(raw.replace(/-/g, "/"));
    return isNaN(t) ? 0 : t;
  }
  /* 毫秒 → 与文档一致的 14 位数字串，用作「工作台」这个数据源的 updated */
  function msToStamp(ms){
    var n = Number(ms) || 0;
    if (!n) return "";
    var d = new Date(n);
    var p = function(x){ return (x < 10 ? "0" : "") + x; };
    return String(d.getFullYear()) + p(d.getMonth()+1) + p(d.getDate())
         + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  }

  function syncMerged(opts){
    opts = opts || {};
    var rc = remoteCfg();
    if (!rc.base || !rc.token) return Promise.resolve();
    var deltas = loadDeltas();
    var raw = readSnapshot();
    var date = todayStr();

    /* ⚠ 有未推送的勾选（forcePush）时，先把它推出去，不要先拉一遍。
       否则后面用云端/文档的旧状态覆盖快照，用户刚勾的步骤会被取消。 */
    if (raw && raw.forcePush && deltas.length) {
      return pushTodos(true).then(function(){ clearDeltas(); }).then(function(){ return syncMerged(opts); });
    }

    return remoteDocsForDate(rc, date).then(function(res){
      if (!res.docs.length) {
        /* 首次：云端还没有今天的项目文档，用本地数据创建 */
        if (!raw || !raw.items || !raw.items.length) return null;
        return pushTodos(true).then(function(){ clearDeltas(); });
      }
      return Promise.all(res.docs.map(function(d){
        return rPost(rc, "/api/export/exportMdContent", { id: d.id }).then(function(x){
          return parseCloudMd(x && x.content);
        }).catch(function(){ return { summary: "", items: [] }; });
      })).then(function(mods){
        var model = { summary: "", items: [] };
        mods.forEach(function(m){
          if (!model.summary && m.summary) model.summary = m.summary;
          model.items = model.items.concat(m.items || []);
        });
        /* 日期筛选：保留「今天」「无日期」「以及更早但未完成」的条目——
           早期只留今天会把昨天没做完的任务整条丢掉，导致拉取后凭空消失 */
        /* 不丢弃历史：全部收进快照，用 hist 标记哪些不是今天的 */
        model.items.forEach(function(it){
          if (!it || !it.name) return;
          var isHist = false;
          if (it.date && it.date < date) {
            var subs = it.subs || [];
            isHist = subs.length > 0 && subs.every(function(s){ return s && s.done; });
          } else if (it.date && it.date > date) {
            isHist = true;
          }
          it.hist = isHist;
        });
        var seenN = {}, uniq = [];
        model.items.forEach(function(it){
          if (!it || !it.name || seenN[it.name]) return;
          seenN[it.name] = 1; uniq.push(it);
        });
        model.items = uniq;

        if (!model.items.length) {
          if (!raw || !raw.items || !raw.items.length) return null;
          return pushTodos(true).then(function(){ clearDeltas(); });
        }
        if (deltas.length) applyDeltasToModel(model, deltas);

        /* ============ 以工作台为准 ============
           工作台（快照）是**唯一数据源**。这里从云端/本地读文档，
           只是为了「补齐工作台还没有的任务」，绝不能反过来用文档覆盖工作台已有的状态。
           规则：
             · 工作台有数据 → **完全以工作台为准**，文档内容一概不采用
             · 工作台为空   → 才用文档数据初始化
           这样用户在工作台做的任何改动都不会被远端数据盖掉，
           也不会把文档里残留的重复任务重新拉回工作台。 */
        var wbSnap = raw;
        var wbHasData2 = !!(wbSnap && Array.isArray(wbSnap.items) && wbSnap.items.length);
        var merged = wbHasData2 ? wbSnap.items.slice() : model.items.slice();
        model.items = merged;

        var items = wbHasData2 ? merged : modelToItems(model);
        var dirty = (raw && raw.dirty) ? raw.dirty : 0;
        /* 只要工作台有内容，就以工作台为准；只有工作台空时才接受远端数据 */
        var wbHasData = !!(raw && Array.isArray(raw.items) && raw.items.length);
        var needPush = deltas.length > 0 || dirty || wbHasData;
        writeSnapshot(items, model.summary, needPush ? "以工作台为准" : "云端同步", needPush ? dirty : 0);
        try { localStorage.setItem(LAST_SYNC_KEY, String(Date.now())); } catch(e){}

        if (!needPush) {
          todoHint((opts.manual ? "已拉取云端数据" : "已按云端同步") + "（" + model.items.length + " 条待办）", "#2f7a4f");
          return null;
        }
        /* 以工作台为准 → 把工作台的内容推送到本地思源和云端 */
        return pushTodos(true).then(function(){
          clearDeltas();
          todoHint("已把 " + (deltas.length ? deltas.length + " 处勾选" : "")
            + (deltas.length && dirty ? " 与 " : "") + (dirty ? "番茄/备注" : "")
            + " 合并写回云端", "#2f7a4f");
        });
      });
    }).catch(function(e){
      todoHint("同步失败：" + ((e && e.message) || e));
    });
  }
  /* 手动拉取：立即从云端取一次（有未同步改动会先合并，不会丢） */
  /* 双源拉取：本地思源 + 云端，按文档修改时间取较新的那一份 */
  function pullBoth(){
    var btn = $("btnPull");
    if (!btn || btn.disabled) return Promise.resolve();
    var old = btn.textContent;
    btn.disabled = true; btn.textContent = "拉取中…";
    todoHint("正在比对本地与云端…");

    var lc = localCfg();
    var rc = remoteCfg();
    var date = todayStr();

    /* 工作台快照作为第三个数据源：
       它的 at 是用户最后一次在工作台里改动的时间。
       若 at 比两端文档都新，说明工作台有尚未推送的改动，应以它为准。 */
    var workbench = null;
    try {
      var wbSnap = readSnapshot();
      if (wbSnap && Array.isArray(wbSnap.items) && wbSnap.items.length) {
        workbench = {
          updated: msToStamp(wbSnap.at || wbSnap.forcePush || 0),
          items: wbSnap.items
        };
      }
    } catch(eWb){}

    /* 串行读取：两个源同时打可能触发并发闸门导致其中一个被丢 */
    var localDocs = [], cloudDocs = [];
    return (lc.token
      ? fetchSideDocs({ base: lc.base, token: lc.token, nbName: lc.nbName, rootPath: lc.rootPath })
          .then(function(r){ localDocs = r || []; })
      : Promise.resolve()
    ).then(function(){
      return rc.token
        ? fetchSideDocs({ base: rc.base, token: rc.token, nbName: rc.nbName || REMOTE_NB_NAME, rootPath: "" })
            .then(function(r){ cloudDocs = r || []; })
        : Promise.resolve();
    }).then(function(){
      /* 按项目名建立索引 */
      function idxByProject(list){
        var m = {};
        list.forEach(function(d){
          var k = d.project;
          if (!m[k] || stampNum(d.updated) > stampNum(m[k].updated)) m[k] = d;
        });
        return m;
      }
      var L = idxByProject(localDocs);
      var C = idxByProject(cloudDocs);
      var projects = Object.keys(Object.assign({}, L, C));

      /* 三端里谁的修改时间最新，就以谁为准：
         工作台(快照 at) > 本地文档(updated) > 云端文档(updated)。
         这样「工作台刚改、还没推」时不会被两份旧文档盖回去。 */
      function _pickOne(a, b, wb){
        var cands = [];
        if (a) cands.push({ src: "本地", updated: a.updated });
        if (b) cands.push({ src: "云端", updated: b.updated });
        if (wb) cands.push({ src: "工作台", updated: wb.updated });
        if (!cands.length) return null;
        return cands.reduce(function(best, x){
          return stampMs(x.updated) >= stampMs(best.updated) ? x : best;
        });
      }
      function _pickSrc(a, b, wb){ var r = _pickOne(a, b, wb); return r ? r.src : "—"; }
      function _pickUpd(a, b, wb){ var r = _pickOne(a, b, wb); return r ? r.updated : ""; }

      var model = { summary: "", items: [] };
      var picks = [];
      projects.forEach(function(pj){
        var a = L[pj], b = C[pj];

        /* —— 只增不减：两边的任务取并集 ——
           同名任务：按修改时间取较新的一份（不会因为一边没有就删掉） */
        var byName = {};
        var order = [];
        function addTask(it, srcName, upd){
          if (!it || !it.name) return;
          var cur = byName[it.name];
          if (!cur) {
            byName[it.name] = { item: it, src: srcName, upd: upd };
            order.push(it.name);
          } else {
            /* 同名：**修改时间新的赢**（统一折算成毫秒再比，避免位数不同失真） */
            if (stampMs(upd) > stampMs(cur.upd)) {
              byName[it.name] = { item: it, src: srcName, upd: upd };
            }
          }
        }
        if (a) (a.items || []).forEach(function(it){ addTask(it, "本地", a.updated); });
        if (b) (b.items || []).forEach(function(it){ addTask(it, "云端", b.updated); });
        /* —— 第三端：工作台（本地快照）——
           用户在工作台里勾了步骤、改了象限，改动先落在 localStorage 的快照里，
           要等推送才写进文档。如果比对时只看「本地文档 vs 云端文档」，
           这份最新的改动会被两份旧文档盖掉 —— 表现就是
           「改了没推上去，然后界面自己弹回原样，要再改一次才生效」。
           快照的 at 就是这批改动的最后修改时间，把它作为一个数据源参与比较。 */
        if (workbench) {
          (workbench.items || []).forEach(function(it){
            if (!it || !it.name) return;
            var hit = byName[it.name];
            /* 工作台是权威来源：只要它比当前胜出的那份新，就用它的
               （stampMs 统一折算成毫秒，避免 14 位文档时间 vs 13 位毫秒比较失真） */
            if (!hit || stampMs(workbench.updated) > stampMs(hit.upd)) {
              addTask(it, "工作台", workbench.updated);
            }
          });
        }

        var localOnly = 0, cloudOnly = 0, both = 0;
        order.forEach(function(nm){
          var rec = byName[nm];
          model.items.push(rec.item);
          if (a && b) {
            var inL = (a.items || []).some(function(x){ return x.name === nm; });
            var inC = (b.items || []).some(function(x){ return x.name === nm; });
            if (inL && inC) both++;
            else if (inL) localOnly++;
            else cloudOnly++;
          }
        });
        picks.push({
          project: pj,
          src: _pickSrc(a, b, workbench),
          updated: _pickUpd(a, b, workbench),
          local: a ? a.updated : "—",
          cloud: b ? b.updated : "—",
          workbenchAt: workbench ? workbench.updated : "—",
          localOnly: localOnly, cloudOnly: cloudOnly, both: both
        });
      });

      /* 不丢弃历史：全部收进快照，用 hist 标记哪些不是今天的。
         · 今天的 / 无日期的 / 更早但还有未完成步骤的 → hist=false（工作台显示）
         · 其余（更早日期的已完成任务、未来日期）→ hist=true（只同步，不显示） */
      model.items.forEach(function(it){
        if (!it || !it.name) return;
        var isHist = false;
        if (it.date && it.date < date) {
          var subs = it.subs || [];
          isHist = subs.length > 0 && subs.every(function(s){ return s && s.done; });
        } else if (it.date && it.date > date) {
          isHist = true;
        }
        it.hist = isHist;
        /* 昨天没做完、今天还在清单里的任务，日期顺延到今天。
           不这么做的话，云端和本地的文档会一直把它记为旧日期，
           执行力图/工作台统计就永远显示「14 号还有 6 项没做」。 */
        if (!isHist && it.date && it.date < date) it.date = date;
      });
      /* 去重：同名任务优先保留非历史的 */
      var seen = {}, uniq = [];
      model.items.slice().sort(function(a, b){ return (a.hist ? 1 : 0) - (b.hist ? 1 : 0); }).forEach(function(it){
        if (!it.name || seen[it.name]) return;
        seen[it.name] = 1; uniq.push(it);
      });
      model.items = uniq;

      if (!model.items.length) {
        /* 文档里一条都没有：只要工作台有数据，就按工作台推过去 */
        var raw0 = readSnapshot();
        if (raw0 && Array.isArray(raw0.items) && raw0.items.length) {
          return pushTodos(true).then(function(){ todoHint("文档为空，已按工作台重建", "#2f7a4f"); });
        }
        todoHint("本地和云端都没有待办");
        return null;
      }

      var raw = readSnapshot();
      /* ============ 以工作台为准（不比较时间）============
         工作台（localStorage 快照）是唯一数据源。
         从本地/云端读文档只为补齐工作台缺的任务，
         **绝不覆盖工作台已有的状态** —— 用户在工作台改的就是最终结果。 */
      var wbByName = {};
      var wbHasData = !!(raw && Array.isArray(raw.items) && raw.items.length);
      if (wbHasData) {
        raw.items.forEach(function(t){
          var nm = String(t.name || "").trim();
          if (nm) wbByName[nm] = t;
        });
      }
      var finalItems = [];
      if (wbHasData) {
        /* 工作台有数据 → **完全以工作台为准**，不采用文档里的任何任务。
           之前这里的「工作台没有就从文档补」会把文档里残留的旧任务
           （误建任务的残留、上面删掉又冒出来的）重新拉回工作台，
           造成任务重复、界面和文档对不上。现在只认工作台。 */
        finalItems = raw.items.slice();
      } else {
        /* 工作台是空的（首次使用 / 被清空）→ 才用文档数据初始化 */
        finalItems = model.items.slice();
      }
      var items = wbHasData ? finalItems : modelToItems(model);

      writeSnapshot(items, (raw && raw.summary) || "", "以工作台为准", 0);

      /* 报告比对结果 */
      var fromLocal = picks.filter(function(x){ return x.src === "本地"; }).length;
      var fromCloud = picks.filter(function(x){ return x.src === "云端"; }).length;
      var fromWb = picks.filter(function(x){ return x.src === "工作台"; }).length;

      /* 以工作台为准 → 本地和云端都要按工作台的内容写回。
         不管时间谁新谁旧，工作台就是最终结果。 */
      var pushLocal = picks.filter(function(x){
        return x.local !== "—";
      });
      var pushCloud = picks.filter(function(x){
        return x.cloud !== "—";
      });
      var conflict = picks.filter(function(x){
        return x.src !== "—" && x.local !== "—" && x.cloud !== "—" && x.local !== x.cloud;
      });

      /* ============ 手动拉取：比较本地思源 vs 云端思源 ============
         不自动回写任何一端，而是把比对结果显示出来，
         让用户决定「以哪端为准」把数据拉进工作台。 */
      /* 统计口径要正确：只数**真正有任务**的文档。
         以前把 /知识库A、/概念、/理论基础 这些没有待办的知识库文档
         也算了进去，于是「云端 14 条」比实际多好几条，看着像有不一致。 */
      var localCount = 0, cloudCount = 0;
      localDocs.forEach(function(d){ localCount += ((d.items || []).filter(function(x){ return x && x.name; })).length; });
      cloudDocs.forEach(function(d){ cloudCount += ((d.items || []).filter(function(x){ return x && x.name; })).length; });
      /* 同时统计「有任务的文档数」，用来判断两端是否真的对得上 */
      var localDocN = localDocs.filter(function(d){ return (d.items||[]).some(function(x){ return x && x.name; }); }).length;
      var cloudDocN = cloudDocs.filter(function(d){ return (d.items||[]).some(function(x){ return x && x.name; }); }).length;

      /* —— 到底差哪几条 ——
         按任务名做集合差：onlyLocal = 本地有云端没有，onlyCloud = 反之。
         只报数字（10 vs 8）看不出问题在哪，直接把名字列出来。 */
      var nameSet = function(docs){
        var s = {};
        (docs || []).forEach(function(d){
          (d.items || []).forEach(function(x){
            var n = String((x && x.name) || "").trim();
            if (n) s[n] = 1;
          });
        });
        return s;
      };
      var setL = nameSet(localDocs), setC = nameSet(cloudDocs);
      var onlyLocal = Object.keys(setL).filter(function(n){ return !setC[n]; });
      var onlyCloud = Object.keys(setC).filter(function(n){ return !setL[n]; });

      var diffText = "";
      if (!onlyLocal.length && !onlyCloud.length) {
        diffText = "两端任务一致";
      } else {
        var parts2 = [];
        if (onlyLocal.length) {
          parts2.push("仅本地 " + onlyLocal.length + " 条：" + onlyLocal.slice(0, 3).map(function(n){ return "「" + n.slice(0, 12) + "」"; }).join("、")
            + (onlyLocal.length > 3 ? " 等" : ""));
        }
        if (onlyCloud.length) {
          parts2.push("仅云端 " + onlyCloud.length + " 条：" + onlyCloud.slice(0, 3).map(function(n){ return "「" + n.slice(0, 12) + "」"; }).join("、")
            + (onlyCloud.length > 3 ? " 等" : ""));
        }
        diffText = parts2.join("；");
      }

      var done = function(){
        var detail = picks.map(function(x){
          return x.project.slice(0, 12) + "：本地 " + (x.local !== "—" ? "有" : "无") + " / 云端 " + (x.cloud !== "—" ? "有" : "无");
        }).slice(0, 8).join("    ");
        /* 提示写明：这两个数字是「任务条数」，并直接点出差哪几条 */
        try { window.__pullDiffText = diffText; } catch(eD){}
        todoHint("比对完成：本地思源 " + localCount + " 条 / 云端 " + cloudCount + " 条 · " + diffText, "#2f7a4f");
        /* 把两端数据暂存起来，供选择框使用。
           ⚠ 只保留**真正有任务**的文档：云端有 15 个文档，
           /知识库A、/概念、/理论基础 这些知识库文档没有待办，
           全算进去会让「云端条数」虚高，看起来像多了一堆任务。 */
        function onlyTaskDocs(list){
          return (list || []).filter(function(d){
            return (d.items || []).some(function(x){ return x && x.name; });
          });
        }
        window.__pullCandidates = {
          local: onlyTaskDocs(localDocs),
          cloud: onlyTaskDocs(cloudDocs),
          merged: model
        };
        try { renderTodos(); } catch(e){}
        try { localStorage.setItem(LAST_SYNC_KEY, String(Date.now())); } catch(e){}
        return picks;
      };

      /* 只做比对，不回写任何一端；由用户选择以哪端为准 */
      return done();
    }).catch(function(e){
      todoHint("拉取失败：" + ((e && e.message) || e), "#c0392b");
      return [];
    }).then(function(res){
      if (btn) { btn.disabled = false; btn.textContent = old; }
      return res;      /* 把 picks 透传出去 */
    });
  }

  function pullCloud(){
    return pullBoth();
  }
  /* 手动拉取：比对完成后弹出选择框，由用户决定以哪端为准。
     · 以本地思源为准 → 用本地思源的数据覆盖工作台
     · 以云端为准     → 用云端的数据覆盖工作台
     工作台自己的改动会被覆盖，所以只在用户明确点击时执行。 */
  function askPullSource(){
    var cand = window.__pullCandidates;
    if (!cand) { todoHint("请先点「↓」比对", "#d9a015"); return; }
    var lc = localCfg(), rc = remoteCfg();
    /* 只数「真正的任务」：
       parseCloudMd 解析出来的 items 里可能混入步骤/空条目，
       直接数 items.length 会把步骤也算成任务，条数虚高。
       有名字、且有 subs 或 date 的才算一条任务。 */
    function countTasks(docs){
      var n = 0, seen = {};
      (docs || []).forEach(function(d){
        (d.items || []).forEach(function(it){
          if (!it || !it.name) return;
          if (seen[it.name]) return;      /* 同名只算一次 */
          seen[it.name] = 1;
          n++;
        });
      });
      return n;
    }
    var lN = countTasks(cand.local);
    var cN = countTasks(cand.cloud);

    /* 各端最新修改时间：取该端所有文档 updated 的最大值。
       文档里的 updated 形如 20261116124530，这里格式化成看得懂的样式。 */
    function newestOf(docs){
      var best = "";
      (docs || []).forEach(function(d){
        var u = String(d.updated || "");
        if (u && u > best) best = u;
      });
      return best;
    }
    function fmtStamp(s){
      if (!s || s.length < 14) return "未知";
      return s.slice(0,4) + "-" + s.slice(4,6) + "-" + s.slice(6,8)
           + " " + s.slice(8,10) + ":" + s.slice(10,12) + ":" + s.slice(12,14);
    }
    var lTime = newestOf(cand.local);
    var cTime = newestOf(cand.cloud);
    var wbTime = (function(){
      try {
        var s = JSON.parse(localStorage.getItem(TODOS_KEY) || "null");
        var t = (s && (s.at || s.forcePush)) ? new Date(s.at || s.forcePush) : null;
        if (!t) return "未知";
        var p = function(x){ return (x < 10 ? "0" : "") + x; };
        return t.getFullYear() + "-" + p(t.getMonth()+1) + "-" + p(t.getDate())
             + " " + p(t.getHours()) + ":" + p(t.getMinutes()) + ":" + p(t.getSeconds());
      } catch(e){ return "未知"; }
    })();

    var box = document.getElementById("pullAsk");
    if (!box) {
      box = document.createElement("div");
      box.id = "pullAsk";
      box.className = "pullAsk";
      document.body.appendChild(box);
    }
    box.innerHTML =
      '<div class="pa-card">'
      + '<div class="pa-title">以哪一端为准拉取？</div>'
      + '<div class="pa-desc">「条」= 该端文档里解析出的<b>任务条数</b>（不含步骤）。'
      +   '工作台当前的内容会被覆盖。</div>'
      + (window.__pullDiffText ? ('<div class="pa-diff">' + esc(window.__pullDiffText) + '</div>') : '')
      + '<button class="pa-btn" data-src="local">'
      +   '<span class="pa-nm">本地思源 · ' + lN + ' 条</span>'
      +   '<span class="pa-time">' + fmtStamp(lTime) + '</span>'
      + '</button>'
      + '<button class="pa-btn" data-src="cloud">'
      +   '<span class="pa-nm">云端 · ' + cN + ' 条</span>'
      +   '<span class="pa-time">' + fmtStamp(cTime) + '</span>'
      + '</button>'
      + '<div class="pa-wb">工作台当前：' + wbTime + '</div>'
      + '<button class="pa-cancel">取消</button>'
      + '</div>';
    box.style.display = "flex";

    box.onclick = function(ev){
      var b = ev.target.closest("button");
      if (!b) return;
      if (b.classList.contains("pa-cancel") || b.getAttribute("data-src") === null && !b.classList.contains("pa-btn")) {
        box.style.display = "none";
        return;
      }
      var src = b.getAttribute("data-src");
      if (!src) { box.style.display = "none"; return; }
      box.style.display = "none";
      applyPullSource(src);
    };
  }

  /* 用指定端的数据覆盖工作台 */
  function applyPullSource(src){
    var cand = window.__pullCandidates;
    if (!cand) return;
    var docs = src === "local" ? (cand.local || []) : (cand.cloud || []);
    if (!docs.length) { todoHint("该端没有数据", "#c0392b"); return; }
    var srcLabel = (src === "local") ? "本地思源" : "云端";
    var otherLabel = (src === "local") ? "云端" : "本地思源";
    try {
      var model = { summary: "", items: [] };
      docs.forEach(function(d){
        if (!model.summary && d.summary) model.summary = d.summary;
        model.items = model.items.concat(d.items || []);
      });
      var items = modelToItems(model);
      writeSnapshot(items, model.summary || "", "手动拉取（" + srcLabel + "）", 0);
      /* 覆盖工作台只是第一步：工作台是唯一数据源，改完必须推出去，
         否则另一端还停在旧内容，两端就一直不一致。
         标 forcePush 走「紧急」通道，跳过节流。 */
      try {
        var sn = JSON.parse(localStorage.getItem(TODOS_KEY) || "null");
        if (sn) {
          sn.at = Date.now();
          sn.forcePush = Date.now();
          sn.dirty = 0;
          localStorage.setItem(TODOS_KEY, JSON.stringify(sn));
        }
      } catch(eF){}
      renderTodos();
      todoHint("已按「" + srcLabel + "」覆盖工作台：" + model.items.length + " 条，正在同步到" + otherLabel + "…", "#2f7a4f");
      /* 把两端都写成同一份内容 —— 这才是「保持一致」 */
      syncBothWays(srcLabel, otherLabel);
    } catch(e){
      todoHint("拉取失败：" + ((e && e.message) || e), "#c0392b");
    }
  }

  /* 拉取之后把两端对齐：
     工作台已经是选定那一端的内容，pushTodos 会同时写本地思源和云端，
     另一端就被覆盖成同样的任务。推完再回读校验一次，把数字告诉用户。 */
  function syncBothWays(fromLabel, toLabel){
    pushTodos(false).then(function(){
      /* ⚠ pushTodos 只等本地写完就返回，云端是后台队列。
         必须等 cloudChain 跑完再回读，否则会读到「云端还没写完」的旧数。
         以前只是 setTimeout 等几秒，经常等不到，报出假的「仍有差异」。 */
      return Promise.resolve(cloudChain).then(function(){
        return waitCloudIdle(15000);
      });
    }).then(function(){
      return countBoth();
    }).then(function(n){
      if (!n) {
        todoHint("已按「" + fromLabel + "」覆盖工作台并推送，两端已同步", "#2f7a4f");
        return;
      }
      if (n.l === n.c) {
        todoHint("已按「" + fromLabel + "」同步，本地思源与云端一致（各 " + n.l + " 条）", "#2f7a4f");
      } else {
        todoHint("已按「" + fromLabel + "」推送，但两端仍有差异：本地 " + n.l + " 条 / 云端 " + n.c
          + " 条（云端可能还在写入，稍后再点「↓」核对）", "#d9a015");
      }
    }).catch(function(e){
      todoHint("已覆盖工作台，但同步到" + toLabel + "失败：" + ((e && e.message) || e), "#c0392b");
    });
  }

  /* 等云端队列空闲；最多等 ms 毫秒，不阻塞太久 */
  function waitCloudIdle(ms){
    var started = Date.now();
    return new Promise(function(resolve){
      (function tick(){
        if (!cloudBusy() || Date.now() - started > ms) { resolve(); return; }
        setTimeout(tick, 300);
      })();
    });
  }

  /* 只数条数，不弹选择框、不动按钮 —— 供拉取后的校验用 */
  function countBoth(){
    var lc = localCfg(), rc = remoteCfg();
    if (!lc.token || !rc.token) return Promise.resolve(null);
    var localN = 0, cloudN = 0;
    var num = function(docs){
      var n = 0;
      (docs || []).forEach(function(d){
        n += ((d.items || []).filter(function(x){ return x && x.name; })).length;
      });
      return n;
    };
    return fetchSideDocs({ base: lc.base, token: lc.token, nbName: lc.nbName, rootPath: lc.rootPath })
      .then(function(ld){ localN = num(ld); })
      .catch(function(){ localN = -1; })
      .then(function(){
        return fetchSideDocs({ base: rc.base, token: rc.token, nbName: REMOTE_NB_NAME, rootPath: "" });
      })
      .then(function(cd){ cloudN = num(cd); })
      .catch(function(){ cloudN = -1; })
      .then(function(){
        if (localN < 0 || cloudN < 0) return null;
        return { l: localN, c: cloudN };
      });
  }

  $("btnPull").addEventListener("click", function(){
    /* 第一次点：比对；比对完再点：弹选择框 */
    if (window.__pullCandidates && Date.now() - (window.__pullAt || 0) < 120000) {
      askPullSource();
      return;
    }
    pullCloud().then(function(){
      window.__pullAt = Date.now();
      if (window.__pullCandidates) askPullSource();
    });
  });

  /* ================= 番茄钟（圆形计时） =================
     侧边栏的计时器独立运行：选一条待办的某一步 → 开始 → 结束会自动
     写入「🍅N 说明」记录并勾上那一步，跟主界面点 🍅 的效果一致。
     状态放内存，切窗口不会丢（侧边栏窗口常驻）。 */
  var PT = null;            /* { ti, si, total, left, startAt, note, timerId } */
  var PT_RING = 2 * Math.PI * 52;   /* 圆周长，r=52 */

  function ptKey(){ return "dsh.worktable.pomo.v1"; }
  function ptSave(){
    try {
      if (!PT) { localStorage.removeItem(ptKey()); return; }
      localStorage.setItem(ptKey(), JSON.stringify({
        ti: PT.ti, si: PT.si, total: PT.total, startAt: PT.startAt, note: PT.note, taskName: PT.taskName,
        accSec: PT.accSec || 0, paused: !!PT.paused
      }));
    } catch(e){}
  }
  function ptLoad(){
    try {
      var o = JSON.parse(localStorage.getItem(ptKey()) || "null");
      if (!o || !o.startAt) return null;
      var acc = Number(o.accSec) || 0;
      var paused = !!o.paused;
      var left = paused ? (Number(o.total) - acc)
                        : (Number(o.total) - acc - Math.floor((Date.now() - Number(o.startAt)) / 1000));
      if (left <= 0) { localStorage.removeItem(ptKey()); return null; }
      return { ti: o.ti, si: o.si, total: Number(o.total), left: left, startAt: Number(o.startAt),
               note: o.note || "", taskName: o.taskName || "", timerId: null,
               accSec: acc, paused: paused, startedAtReal: Number(o.startAt) - acc * 1000 };
    } catch(e){ return null; }
  }
  function ptFmt(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  }
  function ptPaint(){
    var fg = $("pomoFg"), ring = $("pomoRing"), tm = $("pomoTime"), st = $("pomoState");
    if (!fg) return;
    /* ⚠ 绝对不要给 #pomoPick 设 textContent / innerHTML ——
       那会清空 <select> 的全部 option。以前这里在结束时写 ""、
       计时中写 "→ 步骤名"，而 ptPaint 每秒都会被 tick 调一次，
       于是下拉框每秒被清空一遍，再被 renderTodos 重新填上，
       表现就是「任务选择一直在跳」。当前步骤显示在 #pomoTask 里就够了。 */
    if (!PT) {
      fg.style.strokeDashoffset = 0;
      ring.className = "pomoRing";
      tm.textContent = "25:00";
      st.textContent = "未开始";
      $("pomoStart").disabled = false;
      $("pomoStop").disabled = true;
      $("pomoTask").textContent = "";
      return;
    }
    var frac = PT.total ? (PT.left / PT.total) : 0;
    fg.style.strokeDashoffset = String(PT_RING * (1 - frac));
    ring.className = "pomoRing" + (PT.left <= 0 ? " done" : (PT.paused ? " paused" : (PT.timerId ? " run" : "")));
    tm.textContent = (PT.paused ? "⏸ " : "") + ptFmt(PT.left);
    st.textContent = PT.left <= 0 ? "时间到" : (PT.paused ? "已暂停" : (PT.timerId ? "计时中" : "已暂停"));
    $("pomoStart").disabled = true;
    $("pomoStop").disabled = false;
    var pb = $("pomoPause");
    if (pb) { pb.disabled = false; pb.textContent = PT.paused ? "▶ 继续" : "⏸ 暂停"; }
    $("pomoTask").textContent = PT.taskName
      ? (PT.taskName.slice(0, 14) + (PT.stepText ? " · " + String(PT.stepText).slice(0, 12) : ""))
      : "";
  }
  function ptTick(){
    if (!PT) return;
    if (PT.paused) { ptPaint(); return; }          /* 暂停中：剩余时间不动 */
    PT.left = Math.max(0, PT.total - (PT.accSec || 0) - Math.floor((Date.now() - PT.startAt) / 1000));
