    ptPaint();
    if (PT.left <= 0) {
      clearInterval(PT.timerId);
      PT.timerId = null;
      ptFinish(true);
    }
  }
  /* 暂停 / 继续 */
  function ptTogglePause(){
    if (!PT) return;
    if (PT.paused) {
      PT.startAt = Date.now();
      PT.paused = false;
      if (!PT.timerId) PT.timerId = setInterval(ptTick, 1000);
      todoHint("番茄继续计时", "#2f7a4f");
    } else {
      PT.accSec = (PT.accSec || 0) + Math.floor((Date.now() - PT.startAt) / 1000);
      PT.left = Math.max(0, PT.total - PT.accSec);
      PT.paused = true;
      if (PT.timerId) { clearInterval(PT.timerId); PT.timerId = null; }
      todoHint("番茄已暂停（已用 " + Math.round(PT.accSec / 60) + " 分钟）", "#d9a015");
    }
    ptSave();
    ptPaint();
  }
  /* 结束并写入记录 */
  function ptFinish(autoEnd){
    if (!PT) return;
    var cur = PT;
    var noteEl = $("pomoNoteIn");
    var note = noteEl ? String(noteEl.value || "").trim() : (cur.note || "");
    if (cur.timerId) clearInterval(cur.timerId);
    PT = null;
    try { localStorage.removeItem(ptKey()); } catch(e){}

    var raw = readSnapshot();
    if (raw && raw.items && raw.items[cur.ti]) {
      var t = raw.items[cur.ti];
      /* 暂停的时间不算进用时 */
      var elapsedSec = Math.round(
        cur.paused ? (cur.accSec || 0)
                   : (cur.accSec || 0) + (Date.now() - cur.startAt) / 1000
      );
      /* 不足 1 分钟不记录（主界面同一条规则） */
      if (elapsedSec < 60) {
        todoHint("用时不足 1 分钟（" + elapsedSec + " 秒），没有记录", "#d9a015");
        if (noteEl) noteEl.value = "";
        ptPaint();
        if ($("pomoNoteIn")) $("pomoNoteIn").value = "";
        ptBuildPick();
        return;
      }
      var used = Math.max(1, Math.round(elapsedSec / 60));
      t.logs = t.logs || [];
      var entry = { min: used, start: fmtDT(new Date(cur.startAt)), end: fmtDT(new Date()), text: note };
      if (typeof cur.si === "number") entry.si = cur.si;
      t.logs.push(entry);
      if (typeof cur.si === "number" && (t.subs || [])[cur.si] && !t.subs[cur.si].done) {
        t.subs[cur.si].done = true;
        t.subs[cur.si].doneAt = todayStr();
        recordDelta(t.name, cur.si, true);
      }
      raw.at = Date.now();
      raw.dirty = 0;
      raw.forcePush = Date.now();
      try { localStorage.setItem(TODOS_KEY, JSON.stringify(raw)); } catch(e){}
      todoHint((autoEnd ? "番茄结束（时间到）" : "番茄已记录") + "：" + used + " 分钟", "#2f7a4f");
      renderTodos();
      scheduleSync();
    }
    if (noteEl) noteEl.value = "";
    ptPaint();
  }
  /* 番茄钟不再有下拉框：计时对象来自待办里点的那一步 🍅。
     这里只负责把「当前瞄准的是哪一步」显示出来，
     没有对象时给出引导文字。 */
  function paintCurStep(){
    var el = $("pomoCur");
    if (!el) return;

    /* 有计时对象（在跑 / 暂停）→ 用它；否则看预备框选中的那一步 */
    var ti = null, si = null, locked = false;
    if (PT && PT.ti != null && PT.si != null) {
      ti = PT.ti; si = PT.si; locked = true;
    } else if (pomoPrepSide && pomoPrepSide.ti != null) {
      ti = pomoPrepSide.ti; si = pomoPrepSide.si;
    }

    if (ti == null) {
      el.textContent = "点下面待办里的 🍅 选一步开始";
      el.title = "";
      el.classList.add("noneState");
      el.classList.remove("locked");
      return;
    }

    var raw = readSnapshot();
    var t = raw && raw.items && raw.items[ti];
    var s = t && (t.subs || [])[si];
    if (!t || !s) {
      el.textContent = "点下面待办里的 🍅 选一步开始";
      el.classList.add("noneState");
      el.classList.remove("locked");
      return;
    }

    el.classList.remove("noneState");
    el.textContent = String(s.text || "").slice(0, 24);
    el.title = String(t.name || "") + " · " + String(s.text || "");
    el.classList.toggle("locked", locked);
  }
  /* 兼容旧调用点：以前到处调 ptBuildPick()，现在都转到这里 */
  function ptBuildPick(){ paintCurStep(); }

  $("pomoStart").addEventListener("click", function(){
    /* 没有下拉框了：目标来自待办里点过 🍅 的那一步。
       已经在计时就忽略，避免叠开两个。 */
    if (PT && PT.timerId) return;

    var ti = null, si = null;
    if (pomoPrepSide && pomoPrepSide.ti != null) { ti = pomoPrepSide.ti; si = pomoPrepSide.si; }
    else if (PT && PT.ti != null) { ti = PT.ti; si = PT.si; }

    if (ti == null) {
      todoHint("先在下面待办里点某一步右边的 🍅", "#d9a015");
      return;
    }
    var raw = readSnapshot();
    var t = raw && raw.items && raw.items[ti];
    var s = t && (t.subs || [])[si];
    if (!t || !s) { todoHint("那一步已经不在了，重新点一次 🍅", "#d9a015"); return; }
    if (s.done) { todoHint("这一步已经完成了", "#d9a015"); return; }

    /* 从待办里点的 🍅 一定带着预备框（分钟数在里面），直接开始 */
    if (pomoPrepSide && pomoPrepSide.ti === ti) {
      var go = document.querySelector(".stepPrepGo");
      if (go) { go.click(); return; }
    }

    /* 兜底：没有预备框就按默认时长开一个 */
    var mins = Number(t.mins) || 25;
    var n = Math.max(1, (t.subs || []).length);
    var stepMins = Math.max(5, Math.min(90, Math.round(mins / n / 5) * 5));
    ptStartNow(ti, si, stepMins, "");
  });
  $("pomoStop").addEventListener("click", function(){ ptFinish(false); });
  $("pomoPause").addEventListener("click", function(){ ptTogglePause(); });
  /* 侧边栏里改写说明 → 同步回共享存储，主界面计时框跟着变 */
  (function(){
    var noteIn = $("pomoNoteIn");
    if (!noteIn) return;
    noteIn.addEventListener("input", function(){
      if (!PT) return;
      PT.note = String(noteIn.value || "");
      ptSave();
    });
  })();
  /* 从步骤旁的 🍅 直接开始计时（复用 doTaskAction 的入口） */
  /* 点步骤右边的 🍅：先弹出「分钟数 + 开始」，确认后再计时。
     和主窗口的「预备」状态一致 —— 以前侧边栏点一下就直接开始，
     用户来不及改时长，也不知道到底在计多久。

     ⚠ 预备框由 renderTodos 负责画出来（见 taskHtml 里的 _prepHtml），
     这里只改 pomoPrepSide 然后重绘。早期版本是临时 insertBefore 一个 li，
     只要快照一变触发 renderTodos，那个 li 就被冲掉，表现为「点了没反应」。 */
  /* （pomoPrepSide 已在 taskHtml 之前声明） */

  function ptStartForStep(ti, si){
    /* 同一个再点一次 → 收起 */
    if (pomoPrepSide && pomoPrepSide.ti === ti && pomoPrepSide.si === si) {
      pomoPrepSide = null;
      try { renderTodos(); } catch(e){}
      return;
    }
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items[ti]) return;
    var t = raw.items[ti];
    if (!(t.subs || [])[si]) return;

    var mins = Number(t.mins) || 25;
    var n = Math.max(1, (t.subs || []).length);
    /* 默认单步时长：任务时长 ÷ 步骤数，5 分钟取整，夹在 5~90。
       和 taskHtml 里的 _def0 保持同一套算法，避免开框和渲染不一致。 */
    var stepMins = Math.max(5, Math.min(90, Math.round(mins / n / 5) * 5));

    pomoPrepSide = { ti: ti, si: si, min: stepMins };
    try { renderTodos(); } catch(e){}

    /* 重绘后把焦点放到「这一步在做什么」，光标停在末尾 ——
       这条信息最常改；时长多数时候用默认值。 */
    var box = document.querySelector('.stepPrep');
    var noteEl = box ? box.querySelector('.stepPrepNote') : null;
    if (noteEl) {
      try {
        noteEl.focus();
        var L = noteEl.value.length;
        noteEl.setSelectionRange(L, L);
      } catch(e){}
    } else {
      var minIn = box ? box.querySelector('.stepPrepMin') : null;
      if (minIn) { try { minIn.focus(); minIn.select(); } catch(e){} }
    }
  }

  function ptClosePrep(){
    if (!pomoPrepSide) return;
    pomoPrepSide = null;
    try { renderTodos(); } catch(e){}
  }

  /* 真正开始计时。noteIn 来自预备框里「这一步在做什么」，
     优先于顶部番茄钟卡片里的说明框（那是给没开预备框的老路径用的）。 */
  function ptStartNow(ti, si, stepMins, noteIn){
    var raw = readSnapshot();
    if (!raw || !raw.items || !raw.items[ti]) return;
    var t = raw.items[ti];
    var sb = (t.subs || [])[si];
    if (!sb) return;

    var pre = $("pomoNoteIn");
    var preNote = String(noteIn != null ? noteIn : (pre ? pre.value : "") || "").trim();
    /* 说明与步骤标题一模一样时不重复存，留空更好读 */
    if (preNote === String(sb.text || "").trim()) preNote = "";
    if (PT && PT.timerId) clearInterval(PT.timerId);
    PT = { ti: ti, si: si, total: stepMins * 60, left: stepMins * 60,
           startAt: Date.now(), note: preNote, taskName: t.name, stepText: sb.text, timerId: null,
           accSec: 0, paused: false, startedAtReal: Date.now() };
    PT.timerId = setInterval(ptTick, 1000);
    ptSave(); ptPaint();
    if ($("scroll")) $("scroll").scrollTop = 0;
    /* 顶部的说明框也同步显示同一条内容，避免两处不一致 */
    try { if (pre) pre.value = preNote; } catch(e0){}
    var inp = $("pomoNoteIn"); if (inp) { inp.value = preNote; try { inp.focus(); } catch(e){} }
    todoHint("开始：" + stepMins + " 分钟 · " + sb.text, "#2f7a4f");
  }

  /* ⋯ 打开主界面（生成/评分/指定都在那里） */
  $("btnMore").addEventListener("click", function(){
    try {
      var inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
      if (inv) {
        inv("show_main").catch(function(){});
        window.close && 0;
      }
    } catch(e){}
    todoHint("在主窗口操作：指定任务 / AI 生成 / AI 评分");
  });

  /* ========== 已禁用：自动拉取 ==========
     以前勾选后 1.5 秒会自动跑一次 syncMerged()，它会去读文档再写回快照，
     这就是「工作台改了、过一会儿又被覆盖」的根源。
     现在**一律不自动拉取**：工作台是唯一数据源，改动只往上推（push），
     需要从思源/云端往回拿数据时，只能手动点「↓ 拉取」。
     这里保留函数名，内部改成直接推送，防止旧调用点把拉取带回流程。 */
  var syncTimer = null;
  function scheduleSync(){
    if (syncTimer) clearTimeout(syncTimer);
    syncTimer = setTimeout(function(){
      syncTimer = null;
      /* 只推送，不拉取；也只推变了的项目 */
      try {
        var ch = takeChangedProjects();
        pushTodos(true, ch.length ? ch : undefined);
      } catch(e){}
    }, 1500);
  }
  /* 主界面点「拉取/推送」时通过 localStorage 发指令，这里执行 */
  window.addEventListener("storage", function(e){
    if (e.key === "dsh.worktable.syncCmd.v1" && e.newValue) {
      var cmd = "";
      try { cmd = JSON.parse(e.newValue).cmd || ""; } catch(err){}
      if (cmd === "push") pushTodos(false);
      else if (cmd === "pull") pullCloud();
    }
  });
  window.addEventListener("storage", function(e){
    /* 本地有勾选变更（delta）→ 只推送，不拉取 */
    if (e.key === DELTA_KEY) scheduleSync();
  });

  /* ========== 已禁用：自动同步 ==========
     原来每 60 秒会跑一次 pullBoth()（读本地+云端文档再写回快照），
     这就是「工作台改了过一会儿又被覆盖」的另一条路径。
     现在自动同步只做**推送**：把工作台的内容写到本地思源和云端，
     绝不反过来改写工作台。 */
  var autoSyncing = false;
  var lastAutoSyncAt = 0;
  var AUTO_MIN_GAP = 60000;
  function autoSync(why){
    if (autoSyncing) return Promise.resolve();
    if (Date.now() - lastAutoSyncAt < AUTO_MIN_GAP) return Promise.resolve();
    autoSyncing = true;
    lastAutoSyncAt = Date.now();
    /* 只推不拉 */
    return pushTodos(true).catch(function(){}).then(function(){ autoSyncing = false; });
  }
  /* 保留旧名，内部转给 autoSync */
  function syncCloud(force){
    if (!force && Date.now() - lastSyncAt() < SYNC_INTERVAL) return Promise.resolve();
    return autoSync("定时");
  }

  /* ============ 本地高频轮询 ============
     每 5 秒读一次本地思源文档，与本地快照比对：
       · 有差异 → 把差异合并进快照，并标记「本地改过」，随后推一次云端
       · 无差异 → 什么都不做（不推云端）
     这样只有真实修改才会产生云端请求。 */
  var LOCAL_POLL_MS = 5000;
  var localPollRunning = false;
  var lastPushAt = 0;          /* 上次推送时间，用于节流 */
  var localDocSig = {};      /* 上次看到的每个项目的文档签名，用于快速判断有没有变 */
  var pollStat = { at: 0, ms: 0, running: false };

  function syncLocalOnly(){
    if (localPollRunning) return Promise.resolve();
    var tPoll = Date.now();
    pollStat = { at: tPoll, ms: 0, running: true };
    /* 紧急开关打开时不做任何后台同步 */
    try { if (localStorage.getItem("dsh.worktable.pausePush") === "1") return Promise.resolve(); } catch(eP2){}
    var lc = localCfg();
    if (!lc.token) return Promise.resolve();
    var raw = readSnapshot();
    /* 本地还有未同步的编辑就不覆盖，等它推完 */
    if (raw && raw.dirty) return Promise.resolve();
    /* 还有删除墓碑说明改动还没推到文档，这时候回头读文档
       会把刚删掉的番茄又读回快照（等于撤销删除）。等推送完再同步。 */
    if (raw && ((raw.delLogs && raw.delLogs.length) || (raw.delNotes && raw.delNotes.length) || (raw.delTodos && raw.delTodos.length))) {
      return Promise.resolve();
    }

    localPollRunning = true;
    return fetchSideDocs({ base: lc.base, token: lc.token, nbName: lc.nbName, rootPath: lc.rootPath })
      .then(function(docs){
        if (!docs || !docs.length) return null;
        var snap = readSnapshot();
        if (!snap || !Array.isArray(snap.items)) return null;

        var changed = false;
        var changedProjects = {};
        docs.forEach(function(d){
          (d.items || []).forEach(function(it){
            var old = null;
            for (var i = 0; i < snap.items.length; i++) {
              if (snap.items[i].name === it.name) { old = snap.items[i]; break; }
            }
            if (!old) return;   /* 新任务由拉取流程处理，这里只同步已有任务 */

            /* 番茄记录也要比：文档里新增/变动了番茄，快照必须跟上，
               否则侧边栏不显示、下一次推送还会把它当"多余"清掉 */
            var docLogs = it.logs || [];
            var snapLogs = old.logs || [];
            /* 墓碑里的番茄不进快照：用户在主界面删掉的，不能被文档读回来 */
            var delHere = (snap.delLogs || []).filter(function(d){ return d.name === it.name; });
            docLogs = docLogs.filter(function(l){
              if (delHere.some(function(d){
                return Number(d.min) === Number(l.min) && String(d.start||"").trim() === String(l.start||"").trim();
              })) return false;
              return true;
            });
            /* 快照里也要剔掉墓碑对应的记录（删除后本地还没被同步） */
            snapLogs = snapLogs.filter(function(l){
              return !delHere.some(function(d){
                return Number(d.min) === Number(l.min) && String(d.start||"").trim() === String(l.start||"").trim();
              });
            });
            if (delHere.length) old.logs = snapLogs;
            var logsDiffer = docLogs.length !== snapLogs.length || JSON.stringify(docLogs.map(function(l){ return [l.min, l.start, l.end, l.text||"", l.si===undefined?-1:l.si]; })) !== JSON.stringify(snapLogs.map(function(l){ return [l.min, l.start, l.end, l.text||"", l.si===undefined?-1:l.si]; }));
            if (logsDiffer) {
              old.logs = docLogs.map(function(l){
                var o = { min: l.min, start: l.start, end: l.end, text: l.text || "" };
                if (typeof l.si === "number") o.si = l.si;
                return o;
              });
              changed = true;
              changedProjects[String((old.project || "").trim() || inferProject(old.name) || "未归类")] = 1;
            }

            /* 象限同步：主窗口里把卡片拖到另一个象限后，快照里会写 rec.q。
               这里要跟着改 old.q，否则本地的 quadrant 还是旧的，
               下一轮把文档写回去时标记又变回原来的（🔥/🌱/🍃 不更新）。
               快照里的 q 是用户刚拖出来的，优先级高于文档解析结果。 */
            if (it.q && it.q !== old.q) {
              old.q = it.q;
              old.important = (it.q === "iu" || it.q === "in");
              changed = true;
              changedProjects[String((old.project || "").trim() || inferProject(old.name) || "未归类")] = 1;
            }

            /* 比步骤完成状态 + 完成日期 */
            var newSubs = it.subs || [];
            var oldSubs = old.subs || [];
            var differs = newSubs.length !== oldSubs.length;
            if (!differs) {
              for (var j = 0; j < newSubs.length; j++) {
                if (!!newSubs[j].done !== !!oldSubs[j].done ||
                    String(newSubs[j].text) !== String(oldSubs[j].text) ||
                    String(newSubs[j].doneAt || "") !== String(oldSubs[j].doneAt || "")) { differs = true; break; }
              }
            }
            /* ⚠ 不能用「快照刚更新过就一律不覆盖」这种粗粒度判断：
               那样用户主动取消勾选也会被挡住，表现为「取消了又被勾回去」。
               改成精确到「哪一步、想要什么状态」：
               主窗口勾选时会写 dsh.worktable.todos.intent.v1，
               只有当文档给出的状态与用户意图相反时，才认为文档是延迟的旧数据。
               另外 forcePush 非 0 说明这一轮推送还没写完，也跳过。 */
            if (differs && snap && snap.forcePush) {
              differs = false;
            }
            var intent = null;
            try { intent = JSON.parse(localStorage.getItem("dsh.worktable.todos.intent.v1") || "null"); } catch(eI){}
            var intentFresh = intent && intent.at && (Date.now() - Number(intent.at)) < 8000;
            if (differs && intentFresh) {
              /* 只在「用户刚点过的那一步」上，文档说反了 → 跳过这一步的同步，
                 其它步骤照常合并 */
              var guarded = false;
              for (var j2 = 0; j2 < oldSubs.length; j2++) {
                var os = oldSubs[j2], nsub = newSubs[j2];
                if (!os || !nsub) continue;
                if (String(os.text || "").trim() !== String(intent.text || "")) continue;
                if (!!nsub.done !== !!intent.done && !!os.done === !!intent.done) {
                  guarded = true; break;
                }
              }
              if (guarded) differs = false;
            }
            if (differs) {
              /* 保留完成日期 **和多日期跨度**：
                 文档解析出来的 sub 已经带了 date / dates（📅 那一整串），
                 老快照里可能还有更完整的信息，两者取较全的。
                 这里每 5 秒跑一次，如果只保留 text+done+doneAt，
                 date / dates 会被反复抹掉，日期最终全塌成今天。 */
              var tk = todayStr();
              old.subs = newSubs.map(function(s, j){
                var prev = oldSubs[j] || {};
                var pickDates = function(a, b){
                  if (Array.isArray(a) && a.length) return a;
                  if (Array.isArray(b) && b.length) return b;
                  return null;
                };
                var keepDates = pickDates(s.dates, prev.dates);
                var keepDate = s.date || prev.date || null;
                if (!s.done) {
                  /* 取消勾选：只改 done，date / dates 原样保留 */
                  return { text: s.text, done: false, doneAt: null,
                           date: keepDate, dates: keepDates };
                }
                var at = s.doneAt || prev.doneAt || null;
                if (!at) at = prev.done ? null : tk;
                return { text: s.text, done: true, doneAt: at,
                         date: keepDate || at, dates: keepDates };
              });
              changed = true;
              changedProjects[String((old.project || "").trim() || inferProject(old.name) || "未归类")] = 1;
            }
          });
        });

        if (!changed) return null;

        /* 只推真正变化的项目 */
        var touchedList = Object.keys(changedProjects);

        /* 标记：本地确实被改过 → 需要往云端同步一次。
           ⚠ 这个节流以前会直接把整轮改动丢掉（return null），
           用户勾完第二下时正好撞上「刚推过 10 秒内」，于是这次勾选
           既不写快照也不推送 —— 表现就是「第二次勾不动」。
           现在节流只拦「推送」，快照照常合并写入。 */
        var now = Date.now();
        var throttled = (now - lastPushAt < 10000);

        /* ⚠ 必须**重新读一次最新快照**再写，不能拿轮询开始时的 snap 整份写回。
           snap 是几秒前读的，期间用户可能刚勾了别的步骤；
           整份写回就会把那些新的勾选冲掉。 */
        return writeSnapshotSafe(function(fresh){
          var freshByName = {};
          (fresh.items || []).forEach(function(t){ freshByName[String(t.name || "").trim()] = t; });
          (snap.items || []).forEach(function(st){
            var nm = String(st.name || "").trim();
            /* 只处理本轮真正有变化的项目，其余任务完全不动 */
            if (!changedProjects[nm]) return;
            var ft = freshByName[nm];
            if (!ft || !Array.isArray(ft.subs)) return;
            var ftByText = {};
            ft.subs.forEach(function(s){ if (s && s.text) ftByText[String(s.text).trim()] = s; });
            (st.subs || []).forEach(function(ss, sidx){
              if (!ss || !ss.text) return;
              var key = String(ss.text).trim();
              var target = ftByText[key];
              if (!target) return;
              /* 用户刚点过的那一步：以用户意图为准，文档说反了就是旧数据 */
              var _iv = null;
              try { _iv = JSON.parse(localStorage.getItem("dsh.worktable.todos.intent.v1") || "null"); } catch(eIv){}
              if (_iv && _iv.name === nm && String(_iv.text || "").trim() === key && _iv.done) {
                target.done = true;
                if (!target.doneAt) target.doneAt = ss.doneAt || todayStr();
                return;
              }
              /* 不把「已勾」改成「未勾」：以最新快照为准 */
              if (target.done && !ss.done) return;
              target.done = !!ss.done;
              if (ss.doneAt) target.doneAt = ss.doneAt;
              if (ss.date) target.date = ss.date;
              if (Array.isArray(ss.dates) && ss.dates.length) target.dates = ss.dates.slice();
            });
          });
          fresh.at = now;
          fresh.dirty = 0;
          /* ⚠ 绝不能在这里写 forcePush。
             forcePush 的语义是「用户刚改了待办，去推一次」。
             syncLocalOnly 每 5 秒跑一轮，如果每轮都写一个新的 forcePush，
             pollPush 就每 5 秒被触发一次 → 又推一次文档 → 文档时间戳变了
             → 下一轮又比出差异 → 再写 forcePush …… 自我维持的死循环，
             表现就是「勾一下，本地思源隔几秒就被重写一遍，一直不停」。
             这里已经通过下面的 pushTodos(touchedList) 自己推了，不需要再发信号。 */
        }).then(function(){
          try { renderTodos(); } catch(e){}
          if (throttled) return null;
          lastPushAt = now;
          /* 推思源（只推不拉），只推这一轮真正变了的项目。
             ⚠ 不要再顺带推一遍云端：pushTodos 自己会并行推本地 + 云端，
             这里以前重复触发，导致一次操作跑两轮完整推送。 */
          return pushTodos(true, touchedList).then(function(){
            /* 推完了：把项目基准推进到当前状态。
               否则下一轮轮询会把「刚写好的文档」再比出一次差异，
               又来一轮推送 —— 那样本地就会每 5 秒被重写一次。 */
            try { if (typeof refreshProjBaseline === "function") refreshProjBaseline(); } catch(eR){}
            /* 本轮改动已经推完，把「待推项目」也清掉，
               免得 pollPush / storage 再拿同一批去推第二遍。 */
            try { if (typeof clearPendingProjects === "function") clearPendingProjects(); } catch(eC){}
          });
        });
      })
      .catch(function(){})
      .then(function(){
        localPollRunning = false;
        pollStat.ms = Date.now() - tPoll;
        pollStat.running = false;
      });
  }
  window.__pollStat = function(){ return pollStat; };

  setInterval(syncLocalOnly, LOCAL_POLL_MS);

  /* 云端：1 小时才读一次（读的时候做「只增不减」的差异合并） */
  setInterval(function(){ syncCloud(false); }, SYNC_INTERVAL);

  /* 启动后 8 秒做一次完整比对 */
  setTimeout(function(){ autoSync("启动"); }, 30000);

  function refresh(){
    /* 兜底：如果上一次推送异常退出，按钮可能卡在「推送中…」。
       没有在推的时候，刷新就把它复位。 */
    try {
      var pb = $("btnPush");
      if (pb && !pushInFlight) {
        if (pb.textContent !== "↑") pb.textContent = "↑";
        if (pb.disabled) pb.disabled = false;
      }
    } catch(e){}
    /* 顶层文档用于猜项目归类，加载完再渲染待办 */
    loadTopDocs().then(function(){ renderTodos(); }).catch(function(){ renderTodos(); });
    renderWeek();
    refreshCapacity();
    renderGraph();
    renderDb();
  }

  /* ---------- 交互 ---------- */
  function hide(){
    try {
      var inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
      if (inv) { inv("toggle_sidebar").catch(function(){}); }
    } catch(e){}
  }
  $("btnHide").addEventListener("click", hide);

  /* ---------- 右键 → 打开主窗口的「设置 → 侧边栏」----------
     侧边栏上右键原本是 WebView 的默认菜单（刷新、检查元素…），
     对普通用户没什么用。改成直达侧边栏的设置，改快捷键、
     开关「占住屏幕边缘」都在那里，比记快捷键更直观。
     做法：拦掉 contextmenu，打开主窗口并把页签切到设置。 */
  /* ---------- 右键 ----------
     默认禁用：不弹任何菜单。
     在「设置 → 侧边栏 → 启用右键」里打开后，
     侧边栏空白处右键 = 打开主窗口的「设置 → 侧边栏」。
     输入框里右键始终放行（粘贴、全选要用）。 */
  var RC_KEY = "dsh.worktable.rightClick.v1";
  var rcEnabled = false;
  try { rcEnabled = localStorage.getItem(RC_KEY) === "1"; } catch(e){}

  document.addEventListener("contextmenu", function(ev){
    var t = ev.target;
    if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
    /* 无论开没开，系统默认菜单一律不弹 */
    ev.preventDefault();
    if (rcEnabled) openSidebarSettings();
  }, true);

  window.addEventListener("storage", function(ev){
    if (ev.key === RC_KEY) rcEnabled = ev.newValue === "1";
  });
  document.addEventListener("rightclick-change", function(ev){
    rcEnabled = !!(ev.detail);
  });

  /* 让主窗口切到「设置」页并滚到侧边栏卡片 */
  function openSidebarSettings(){
    try {

  /* ---------- 拖动吸附 ----------
     标题栏是 data-tauri-drag-region，按住即可拖动窗口。
     松手后吸到「离窗口最近那块屏」的左/右边缘，并把落点记下来。

     为什么不用 mouseup：拖动窗口时系统接管了鼠标消息，
     页面里往往收不到 mouseup，靠它吸附就会「抖动但不吸附」。

  (function(){

    var stableCount = 0;      /* 连续几次位置没变 */
    var moved = false;        /* 这一轮有没有移动过（避免静止时反复吸附） */
    var snapping = false;     /* 正在吸附，暂停轮询 */
    var timer = null;

    function readPos(){
      return inv("sidebar_pos").then(function(r){ return JSON.parse(r); }).catch(function(){ return null; });
    }

      if (snapping) return;

      /* 把真实内容宽度报给后端：innerWidth 是 CSS 像素，乘 dpr 才是物理像素。

      var cw = Math.round(window.innerWidth * (window.devicePixelRatio || 1));

        stableCount = 0;
        moved = false;
        snapping = false;
      }).catch(function(){ snapping = false; });
    }

      if (snapping) return;
      readPos().then(function(p){
        if (!p) return;

          stableCount++;

          if (moved && stableCount >= 3) doSnap();
        } else {
          if (lastPos) moved = true;   /* 位置变了 = 用户正在拖 */

     云端每轮往返 150–900ms，累积起来就是十几秒。
     这里按项目算一份签名，和上一轮比，只把变了的项目名交出去。 */
  var projSig = {};
  /* 项目内容签名：只取**真正会写进文档**的东西。

     于是签名每轮都和基准不一致，「变了」恒为真，
     退回全量推送（六个文档全重写，就是十几秒的来源）。 */
  function projSignature(t){

      lv: t.level || 0, proj: t.project || "",

         ⚠ pct 必须算进来：进度会写成 ◐NN% 进文档，

         于是永远不触发推送 —— 云端就一直停在旧百分比。 */
      subs: (t.subs || []).map(function(x){ return [x.text, !!x.done, Number(x.pct) || 0]; }),

      logs: (t.logs || []).map(function(l){ return [l.min, String(l.start || "").trim()]; }),

     基准的推进统一由 refreshProjBaseline() 负责。 */
  function computeChangedProjects(){
    var s = null;
    try { s = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(eP){}

    var now = {};
    s.items.forEach(function(t){
      if (!t) return;
      var pj = String(t.project || "").trim() || inferProject(t.name) || "未归类";

        if (!t) return;

  function refreshProjBaseline(){ projSig = snapshotProjState(); }

     该只推哪几个文档，而不是把六个全部重写。 */
  function projectsFromDelta(){
    var arr = [];
    try { arr = JSON.parse(localStorage.getItem("dsh.worktable.todos.delta.v1") || "[]") || []; } catch(e){}
    var cut = Date.now() - 30000;
    var names = {};
    arr.forEach(function(d){ if (d && Number(d.at) > cut && d.name) names[d.name] = 1; });
    var keys = Object.keys(names);

    var s = null;
    try { s = JSON.parse(localStorage.getItem(TODOS_KEY) || "null"); } catch(e){}

  var lastSnapSig = "";

  var lastForceSeen = 0;

        var ch = changedForForcePush(fp);

        if (!h) return;
        var sig = h.length + "|" + h.slice(0, 200) + "|" + h.slice(-200);
        if (sig === lastSig) return;      /* 没变就不推 */
        lastSig = sig;
        var inv = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke;
        if (!inv) return;
        var title = window.__cardTitleRef ? window.__cardTitleRef(card) : "预览";
        inv("preview_update", { html: h, title: title }).catch(function(){});
      } catch(e){}
    }
    /* 每 400ms 检查一次：有开着的浮层且内容变了就推 */
    setInterval(push, 400);
  })();

  refresh();
})();
</script>
